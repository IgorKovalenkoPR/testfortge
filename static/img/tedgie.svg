<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Tedgie — TestForTge armadillo mascot">
  <defs>
    <!-- Red armor plate gradient (lighter top, deeper red bottom) -->
    <linearGradient id="armorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#E84B3C"/>
      <stop offset="100%" stop-color="#B0241A"/>
    </linearGradient>
    <!-- Cream belly + limbs gradient -->
    <linearGradient id="bellyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#F5D8B0"/>
      <stop offset="100%" stop-color="#E8BC85"/>
    </linearGradient>
    <!-- T-shirt (black) gradient -->
    <linearGradient id="shirtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2B2B2B"/>
      <stop offset="100%" stop-color="#0F0F0F"/>
    </linearGradient>
  </defs>

  <!-- ░░ TAIL ░░ (segmented red, peeking out behind body, bottom-right) -->
  <path d="M70 78 q14 -4 18 -16 q3 -8 -2 -14"
        fill="none" stroke="url(#armorGrad)" stroke-width="9"
        stroke-linecap="round"/>
  <path d="M74 76 l3 -3 M78 73 l3 -3 M82 69 l3 -3 M85 64 l3 -3 M86 58 l3 -3"
        stroke="#7A150E" stroke-width="1.4" stroke-linecap="round" fill="none"/>

  <!-- ░░ HIND LEG (left) ░░ -->
  <ellipse cx="34" cy="86" rx="7" ry="5" fill="url(#bellyGrad)"/>
  <ellipse cx="58" cy="86" rx="7" ry="5" fill="url(#bellyGrad)"/>
  <!-- toe lines -->
  <path d="M30 88 l1 2 M34 89 l0 2 M38 88 l-1 2
           M54 88 l1 2 M58 89 l0 2 M62 88 l-1 2"
        stroke="#A87238" stroke-width="1" stroke-linecap="round" fill="none"/>

  <!-- ░░ BODY (cream belly under shirt) ░░ -->
  <ellipse cx="46" cy="62" rx="22" ry="20" fill="url(#bellyGrad)"/>

  <!-- ░░ ARMOR-PLATED BACK ░░ — three stacked banded plates -->
  <!-- top hump -->
  <path d="M22 50 q0 -16 24 -16 q24 0 24 16 v6 H22 z"
        fill="url(#armorGrad)"/>
  <!-- middle band -->
  <ellipse cx="46" cy="58" rx="26" ry="6" fill="url(#armorGrad)"/>
  <!-- lower band -->
  <ellipse cx="46" cy="65" rx="25" ry="5" fill="url(#armorGrad)"/>
  <!-- band separators -->
  <path d="M22 56 q24 4 48 0 M22 63 q24 4 48 0"
        stroke="#7A150E" stroke-width="1.2" fill="none" opacity="0.8"/>
  <!-- armor speckles -->
  <g fill="#7A150E" opacity="0.55">
    <circle cx="32" cy="48" r="1"/>
    <circle cx="40" cy="44" r="1"/>
    <circle cx="50" cy="44" r="1"/>
    <circle cx="58" cy="48" r="1"/>
    <circle cx="34" cy="58" r="0.9"/>
    <circle cx="46" cy="56" r="0.9"/>
    <circle cx="56" cy="59" r="0.9"/>
  </g>

  <!-- ░░ HEAD ░░ — slightly off-center, leans left -->
  <ellipse cx="30" cy="36" rx="18" ry="16" fill="url(#armorGrad)"/>
  <!-- head freckles / spots -->
  <g fill="#7A150E" opacity="0.6">
    <circle cx="22" cy="32" r="1"/>
    <circle cx="26" cy="28" r="1"/>
    <circle cx="32" cy="26" r="1"/>
    <circle cx="20" cy="38" r="1"/>
    <circle cx="28" cy="40" r="1"/>
    <circle cx="36" cy="34" r="1"/>
    <circle cx="34" cy="42" r="1"/>
  </g>

  <!-- ░░ EARS ░░ — long, pointy, leaning back -->
  <path d="M34 22 q4 -10 12 -10 q-2 6 -6 12 z" fill="url(#armorGrad)"/>
  <path d="M34 22 q4 -10 12 -10 q-2 6 -6 12 z" fill="#F2A6A0" opacity="0.5"/>
  <path d="M22 22 q-6 -8 -2 -14 q6 4 8 12 z" fill="url(#armorGrad)"/>
  <path d="M22 22 q-6 -8 -2 -14 q6 4 8 12 z" fill="#F2A6A0" opacity="0.5"/>

  <!-- ░░ SNOUT ░░ -->
  <ellipse cx="14" cy="40" rx="7" ry="5" fill="url(#armorGrad)"/>
  <!-- nose -->
  <ellipse cx="9" cy="40" rx="3" ry="2.4" fill="#7A150E"/>
  <ellipse cx="9" cy="39.4" rx="1" ry="0.6" fill="#FFFFFF" opacity="0.6"/>

  <!-- ░░ EYE ░░ -->
  <ellipse cx="24" cy="36" rx="3.6" ry="3.6" fill="#FFFFFF"/>
  <ellipse cx="24" cy="36" rx="3" ry="3" fill="#2B6FA8"/>
  <circle cx="24" cy="36" r="1.6" fill="#0E1F2E"/>
  <circle cx="24.7" cy="35.3" r="0.7" fill="#FFFFFF"/>
  <!-- eyebrow -->
  <path d="M21 31.5 q3 -1.2 6 0.2" stroke="#7A150E" stroke-width="1.2" stroke-linecap="round" fill="none"/>

  <!-- ░░ CHEEK BLUSH ░░ -->
  <ellipse cx="20" cy="44" rx="3" ry="1.8" fill="#F5A095" opacity="0.7"/>

  <!-- ░░ SMILE ░░ -->
  <path d="M11 44 q3 3 7 1.5" stroke="#2B0A0A" stroke-width="1.4" stroke-linecap="round" fill="none"/>

  <!-- ░░ T-SHIRT (black) ░░ -->
  <path d="M22 58
           q0 -4 6 -6
           q4 -2 18 -2
           q14 0 18 2
           q6 2 6 6
           v22
           q-12 4 -24 4
           q-12 0 -24 -4 z"
        fill="url(#shirtGrad)"/>
  <!-- collar -->
  <path d="M40 54 q6 4 12 0 q-1 4 -6 4 q-5 0 -6 -4 z"
        fill="url(#bellyGrad)"/>

  <!-- ░░ TESTFORT SHIELD on the shirt ░░ -->
  <g transform="translate(46 70)">
    <!-- shield outline -->
    <path d="M-9 -8 l9 -3 l9 3 v6 c0 7 -4 11 -9 13 c-5 -2 -9 -6 -9 -13 z"
          fill="#0F0F0F" stroke="#E03A2A" stroke-width="1.4"/>
    <!-- TEST in white -->
    <text x="0" y="-1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="4.2" font-weight="800" fill="#FFFFFF" letter-spacing="0.2">TEST</text>
    <!-- FORT in red -->
    <text x="0" y="6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="4.2" font-weight="800" fill="#E03A2A" letter-spacing="0.2">FORT</text>
  </g>

  <!-- ░░ ARMS (cream paws) ░░ -->
  <!-- left arm waving -->
  <ellipse cx="22" cy="68" rx="6" ry="5" fill="url(#bellyGrad)" transform="rotate(-25 22 68)"/>
  <!-- right arm down -->
  <ellipse cx="72" cy="74" rx="6" ry="5" fill="url(#bellyGrad)" transform="rotate(25 72 74)"/>
  <!-- claws -->
  <g stroke="#A87238" stroke-width="1" fill="none" stroke-linecap="round">
    <path d="M16 70 l-2 2 M18 72 l-1 3 M20 73 l0 3"/>
    <path d="M76 76 l3 2 M75 79 l2 2 M73 80 l1 3"/>
  </g>
</svg>
