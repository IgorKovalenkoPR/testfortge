<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="240" height="300" role="img" aria-label="Tedgie — TestForTge armadillo mascot">
  <defs>
    <!-- Bright red armour (shell plates, cap, ears) -->
    <linearGradient id="armor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#EC4B3D"/>
      <stop offset="100%" stop-color="#C42B22"/>
    </linearGradient>
    <!-- Deep maroon (band shadows, inner segments) -->
    <linearGradient id="armorDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#8A211C"/>
      <stop offset="100%" stop-color="#5E1310"/>
    </linearGradient>
    <!-- Cream / beige body, limbs, face -->
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#F4DCB8"/>
      <stop offset="100%" stop-color="#E3BE89"/>
    </linearGradient>
    <!-- Black t-shirt -->
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#2B2B2B"/>
      <stop offset="100%" stop-color="#0E0E0E"/>
    </linearGradient>
    <!-- Maroon-purple inner ear -->
    <linearGradient id="earIn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#6E2338"/>
      <stop offset="100%" stop-color="#491627"/>
    </linearGradient>
  </defs>

  <!-- ░░ GROUND SHADOW ░░ -->
  <ellipse cx="118" cy="285" rx="80" ry="12" fill="#000000" opacity="0.10"/>

  <!-- ══════════ TAIL (behind body, curling to lower-right) ══════════ -->
  <path d="M150 232 q46 12 60 40 q4 8 -4 10 q-10 3 -18 -6 q-22 -22 -46 -30 z"
        fill="url(#belly)"/>
  <!-- tail red banded top -->
  <path d="M150 230 q40 8 56 30 q-6 -3 -14 -1 q-18 -16 -44 -20 z" fill="url(#armor)"/>
  <g fill="url(#armorDark)">
    <ellipse cx="176" cy="248" rx="9" ry="6" transform="rotate(28 176 248)"/>
    <ellipse cx="196" cy="262" rx="7" ry="5" transform="rotate(35 196 262)"/>
  </g>
  <g fill="#5E1310" opacity="0.7">
    <circle cx="164" cy="244" r="2"/>
    <circle cx="186" cy="256" r="1.8"/>
    <circle cx="204" cy="268" r="1.5"/>
  </g>

  <!-- ══════════ BACK SHELL — stacked banded plates ══════════ -->
  <!-- filler crescent so no gaps show the body through -->
  <path d="M116 82 q72 4 74 82 q2 40 -22 74 q-6 -76 -64 -124 z" fill="url(#armorDark)"/>
  <g stroke="#4C0F0D" stroke-width="1" stroke-linejoin="round">
    <!-- plate 7 (lowest, into tail) -->
    <g transform="translate(150 234) rotate(122)">
      <path d="M-26 0 Q-26 -18 0 -20 Q26 -18 26 0 Z" fill="url(#armorDark)"/>
    </g>
    <!-- plate 6 -->
    <g transform="translate(166 214) rotate(106)">
      <path d="M-27 0 Q-27 -19 0 -21 Q27 -19 27 0 Z" fill="url(#armor)"/>
      <path d="M-27 0 Q0 7 27 0" fill="none" stroke="#7A150E" stroke-width="1.6"/>
    </g>
    <!-- plate 5 -->
    <g transform="translate(173 189) rotate(92)">
      <path d="M-28 0 Q-28 -20 0 -22 Q28 -20 28 0 Z" fill="url(#armorDark)"/>
    </g>
    <!-- plate 4 -->
    <g transform="translate(172 162) rotate(78)">
      <path d="M-28 0 Q-28 -20 0 -22 Q28 -20 28 0 Z" fill="url(#armor)"/>
      <path d="M-28 0 Q0 7 28 0" fill="none" stroke="#7A150E" stroke-width="1.6"/>
    </g>
    <!-- plate 3 -->
    <g transform="translate(162 131) rotate(60)">
      <path d="M-27 0 Q-27 -19 0 -21 Q27 -19 27 0 Z" fill="url(#armorDark)"/>
    </g>
    <!-- plate 2 -->
    <g transform="translate(147 108) rotate(44)">
      <path d="M-26 0 Q-26 -18 0 -20 Q26 -18 26 0 Z" fill="url(#armor)"/>
      <path d="M-26 0 Q0 7 26 0" fill="none" stroke="#7A150E" stroke-width="1.6"/>
    </g>
    <!-- plate 1 (top, tucked behind head/neck) -->
    <g transform="translate(129 89) rotate(26)">
      <path d="M-23 0 Q-23 -16 0 -18 Q23 -16 23 0 Z" fill="url(#armor)"/>
      <path d="M-23 0 Q0 6 23 0" fill="none" stroke="#7A150E" stroke-width="1.5"/>
    </g>
  </g>
  <!-- speckles on the shell -->
  <g fill="#5E1310" opacity="0.6">
    <circle cx="140" cy="108" r="2"/>
    <circle cx="158" cy="126" r="1.8"/>
    <circle cx="178" cy="172" r="2"/>
    <circle cx="180" cy="200" r="1.8"/>
    <circle cx="166" cy="150" r="1.6"/>
  </g>

  <!-- ══════════ HIND LEGS ══════════ -->
  <g fill="url(#belly)">
    <path d="M84 236 q-6 26 -2 42 q1 6 8 6 q7 0 8 -6 q3 -22 -2 -42 z"/>
    <path d="M132 236 q-4 26 0 42 q1 6 8 6 q7 0 8 -6 q4 -20 -2 -42 z"/>
    <ellipse cx="90" cy="282" rx="12" ry="6"/>
    <ellipse cx="146" cy="282" rx="12" ry="6"/>
  </g>
  <g stroke="#B98A4E" stroke-width="1.3" stroke-linecap="round" fill="none">
    <path d="M83 284 l-1 3 M90 285 l0 3 M97 284 l1 3"/>
    <path d="M139 284 l-1 3 M146 285 l0 3 M153 284 l1 3"/>
  </g>

  <!-- ══════════ BODY (beige, under shirt) ══════════ -->
  <ellipse cx="108" cy="188" rx="60" ry="72" fill="url(#belly)"/>

  <!-- right arm (down at side) -->
  <path d="M158 158 q22 12 20 44 q-1 12 -12 12 q-9 0 -11 -10 q-4 -26 -14 -38 z"
        fill="url(#belly)"/>

  <!-- ══════════ T-SHIRT ══════════ -->
  <path d="M60 150
           q-2 -14 14 -20
           q-6 14 4 22
           q14 -12 30 -12
           q16 0 30 12
           q10 -8 4 -22
           q16 6 14 20
           l-6 20
           q-2 2 -8 -2
           l-2 60
           q-32 12 -64 0
           l-2 -60
           q-6 4 -8 2 z"
        fill="url(#shirt)"/>
  <!-- collar showing beige -->
  <path d="M92 132 q16 12 32 0 q-3 10 -16 10 q-13 0 -16 -10 z" fill="url(#belly)"/>

  <!-- ══════════ TESTFORT SHIELD on the shirt ══════════ -->
  <g transform="translate(108 188) scale(1.9)">
    <path d="M-11 -10 l11 -4 l11 4 v7 c0 9 -5 14 -11 16 c-6 -2 -11 -7 -11 -16 z"
          fill="#111" stroke="#E23A2B" stroke-width="1.5"/>
    <text x="0" y="-1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="5" font-weight="800" fill="#FFFFFF" letter-spacing="0.2">TEST</text>
    <text x="0" y="6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="5" font-weight="800" fill="#E23A2B" letter-spacing="0.2">FORT</text>
  </g>

  <!-- ══════════ LEFT ARM (waving, palm out) ══════════ -->
  <path d="M58 152 q-18 -6 -26 -30 q-4 -12 4 -16 q9 -4 14 6 q8 18 22 26 z"
        fill="url(#belly)"/>
  <ellipse cx="34" cy="112" rx="12" ry="13" fill="url(#belly)"/>
  <ellipse cx="34" cy="114" rx="6.5" ry="8" fill="#F5A794" opacity="0.55"/>
  <g stroke="#B98A4E" stroke-width="1.3" stroke-linecap="round" fill="none">
    <path d="M28 101 l-2 -4 M34 99 l0 -5 M40 101 l2 -4"/>
  </g>

  <!-- ══════════ HEAD ══════════ -->
  <ellipse cx="92" cy="82" rx="50" ry="46" fill="url(#belly)"/>

  <!-- ░░ EARS ░░ (tall, rabbit-like, leaning back-right) -->
  <!-- front ear -->
  <path d="M84 50 Q90 6 110 0 Q113 26 104 50 Z" fill="url(#armor)"/>
  <path d="M91 48 Q97 16 108 9 Q108 28 100 47 Z" fill="url(#earIn)"/>
  <!-- back ear -->
  <path d="M110 52 Q132 10 156 10 Q144 37 126 52 Z" fill="url(#armor)"/>
  <path d="M117 50 Q134 20 148 18 Q139 37 124 49 Z" fill="url(#earIn)"/>

  <!-- ░░ RED CAP over the head ░░ -->
  <path d="M50 76
           q6 -42 52 -46
           q52 -2 60 42
           q3 18 -8 34
           q-14 -20 -40 -18
           q-4 -14 -18 -14
           q-16 0 -22 12
           q-16 -2 -24 6
           q-4 -8 0 -16 z"
        fill="url(#armor)"/>
  <!-- red muzzle bridge dipping toward the nose -->
  <path d="M52 78 q-8 10 -6 22 q10 4 18 -2 q0 -12 -12 -20 z" fill="url(#armor)"/>
  <!-- cap freckles -->
  <g fill="#7A150E" opacity="0.6">
    <circle cx="70" cy="52" r="2"/>
    <circle cx="84" cy="44" r="2"/>
    <circle cx="100" cy="42" r="2"/>
    <circle cx="62" cy="64" r="1.8"/>
    <circle cx="78" cy="60" r="1.8"/>
    <circle cx="116" cy="52" r="1.8"/>
    <circle cx="128" cy="66" r="1.8"/>
  </g>

  <!-- ░░ SNOUT + NOSE ░░ -->
  <ellipse cx="46" cy="98" rx="16" ry="12" fill="url(#belly)"/>
  <ellipse cx="38" cy="99" rx="7" ry="6" fill="#6E1A16"/>
  <ellipse cx="36" cy="96.5" rx="2.4" ry="1.6" fill="#FFFFFF" opacity="0.55"/>

  <!-- ░░ EYE ░░ -->
  <g>
    <ellipse cx="86" cy="86" rx="15" ry="16" fill="#FFFFFF"/>
    <ellipse cx="86" cy="87" rx="11.5" ry="13" fill="#24384B"/>
    <circle cx="86" cy="88" r="6" fill="#0E1A26"/>
    <circle cx="90" cy="83" r="3.2" fill="#FFFFFF"/>
    <circle cx="82" cy="92" r="1.6" fill="#FFFFFF" opacity="0.7"/>
  </g>
  <!-- eyebrow -->
  <path d="M74 66 q10 -5 22 1" stroke="#6E1512" stroke-width="3.4" stroke-linecap="round" fill="none"/>

  <!-- ░░ CHEEK BLUSH ░░ -->
  <ellipse cx="64" cy="104" rx="7" ry="4.2" fill="#F0876A" opacity="0.65"/>

  <!-- ░░ SMILE ░░ -->
  <path d="M52 106 q9 8 20 3" stroke="#3A100C" stroke-width="2.2" stroke-linecap="round" fill="none"/>
</svg>
