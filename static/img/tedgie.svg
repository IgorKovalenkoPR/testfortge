<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="240" height="300"
     role="img" aria-label="Tedgie — the TestForTge armadillo, inspecting a bug through a magnifying glass">
  <!--
    Tedgie, drawn from the TestFort character sheet — the magnifying-glass pose.

    Four things about the reference each cost an attempt, and they are the
    difference between "an armadillo" and "this armadillo":

      1. The pose is FRONT-FACING. Drawn in profile with a long tapering
         snout, the character reads as an anteater and the armour reads as
         a sash. Front-on, with a short muzzle, it reads as this mascot at
         40px — which is the size base.html uses in the panel header.
      2. The armour wraps around BOTH sides of the body and over the
         shoulders, with the cream belly inset inside it. Red on one side
         only is a crescent, however large it is.
      3. The plate gaps are full arcs across the whole shell, hidden behind
         the belly in the middle. That is what makes the segments read on
         both margins at once, and it stays legible when the whole drawing
         is 40px wide — engraved lines on a red field do not.
      4. The hand is drawn AFTER the handle so it overlaps it. Drawn before,
         the glass floats next to the character instead of being held.

    Palette sampled from the sheet:
      shell #E1362B · plate gap #A81F17 · shell shade #8E1C14
      cream #F3DFC0 · cream shade #E0C39A · ear + nose #6E241C
      rim #3A3A3A · lens #EDF3F8 · bug #E1362B / #17171A

    viewBox stays 240×300: base.html renders this at 66×84 and again at
    40×40, so changing the aspect would silently squash one of them.
  -->
  <defs>
    <clipPath id="tgShell">
      <path d="M116 146 C76 146 56 182 56 216 C56 256 82 278 116 278
               C150 278 176 256 176 216 C176 182 156 146 116 146 Z"/>
    </clipPath>
    <clipPath id="tgSkull"><ellipse cx="116" cy="106" rx="50" ry="46"/></clipPath>
    <clipPath id="tgLens"><circle cx="194" cy="176" r="27"/></clipPath>
  </defs>

  <ellipse cx="120" cy="288" rx="62" ry="8" fill="#000" opacity="0.07"/>

  <!-- ── Tail: banded, exits behind the shell to the lower left ────── -->
  <path d="M74 244 C56 254 38 268 26 282 C34 288 46 288 54 281
           C64 270 78 259 90 254 Z" fill="#8E1C14"/>
  <g fill="#A81F17">
    <ellipse cx="70" cy="256" rx="3.6" ry="7.6" transform="rotate(-40 70 256)"/>
    <ellipse cx="56" cy="266" rx="3.2" ry="7" transform="rotate(-44 56 266)"/>
    <ellipse cx="41" cy="276" rx="2.8" ry="6" transform="rotate(-48 41 276)"/>
  </g>

  <!-- ── Shell: the body, armour wrapping round both sides ─────────── -->
  <path d="M116 146 C76 146 56 182 56 216 C56 256 82 278 116 278
           C150 278 176 256 176 216 C176 182 156 146 116 146 Z"
        fill="#E1362B"/>
  <g clip-path="url(#tgShell)">
    <!-- plate gaps: full arcs, hidden behind the belly, reading at both
         margins — see note 3 -->
    <g stroke="#A81F17" stroke-width="5.4" fill="none" stroke-linecap="round">
      <path d="M62 178 C88 160 144 160 170 178"/>
      <path d="M57 204 C88 190 144 190 175 204"/>
      <path d="M57 230 C88 218 144 218 175 230"/>
      <path d="M63 254 C90 244 142 244 169 254"/>
    </g>
    <!-- volume: a shade down the right flank -->
    <path d="M150 150 C168 164 176 192 176 216 C176 256 150 278 116 278
             C138 272 158 250 160 214 C161 188 156 166 144 152 Z"
          fill="#8E1C14" opacity="0.3"/>
  </g>

  <!-- ── Belly: cream, inset inside the armour ─────────────────────── -->
  <path d="M116 166 C93 166 78 194 78 220 C78 248 95 267 116 267
           C137 267 154 248 154 220 C154 194 139 166 116 166 Z"
        fill="#F3DFC0"/>

  <!-- ── Far arm, hanging at the left ──────────────────────────────── -->
  <!-- limbs are round-capped strokes, not outlined shapes: a stroke keeps a
       constant width along the curve, and a hand-authored outline of a bent
       limb tapers wherever the two edges disagree — which is what made the
       previous arms read as crescents rather than arms -->
  <path d="M80 206 Q66 220 65 238" stroke="#E0C39A" stroke-width="15"
        fill="none" stroke-linecap="round"/>
  <ellipse cx="64" cy="242" rx="9.5" ry="8.5" fill="#E0C39A"/>

  <!-- ── Feet ─────────────────────────────────────────────────────── -->
  <ellipse cx="99" cy="278" rx="16" ry="9.5" fill="#E0C39A"/>
  <ellipse cx="137" cy="279" rx="16" ry="9.5" fill="#F3DFC0"/>

  <!-- ── Head ─────────────────────────────────────────────────────── -->
  <!-- ears: rounded, and tucked under the cap so the head overlaps their
       lower half. Pointed ears drawn clear of the head read as horns -->
  <ellipse cx="80" cy="72" rx="11.5" ry="15" transform="rotate(-24 80 72)"
           fill="#6E241C"/>
  <ellipse cx="153" cy="72" rx="11.5" ry="15" transform="rotate(24 153 72)"
           fill="#6E241C"/>
  <ellipse cx="116" cy="106" rx="50" ry="46" fill="#F3DFC0"/>
  <!-- the armour cap: crown and back of the skull, clipped to the head -->
  <g clip-path="url(#tgSkull)">
    <path d="M66 112 C64 80 86 60 116 60 C146 60 168 80 166 112
             C150 99 82 99 66 112 Z" fill="#E1362B"/>
    <g stroke="#A81F17" stroke-width="3.4" fill="none" stroke-linecap="round">
      <path d="M96 66 C90 80 89 92 92 104"/>
      <path d="M136 62 C134 78 134 92 137 104"/>
    </g>
    <g fill="#8E1C14">
      <circle cx="106" cy="82" r="1.9"/><circle cx="118" cy="76" r="1.7"/>
      <circle cx="128" cy="84" r="1.9"/><circle cx="112" cy="91" r="1.6"/>
      <circle cx="124" cy="93" r="1.7"/><circle cx="136" cy="86" r="1.6"/>
    </g>
  </g>
  <!-- eyes on the cream face, looking toward the glass -->
  <ellipse cx="100" cy="120" rx="10.5" ry="11.5" fill="#fff"/>
  <ellipse cx="132" cy="120" rx="10.5" ry="11.5" fill="#fff"/>
  <circle cx="103" cy="122" r="5.4" fill="#17171A"/>
  <circle cx="135" cy="122" r="5.4" fill="#17171A"/>
  <circle cx="104.8" cy="119.6" r="1.9" fill="#fff"/>
  <circle cx="136.8" cy="119.6" r="1.9" fill="#fff"/>
  <!-- short muzzle, nose, smile -->
  <ellipse cx="120" cy="141" rx="22" ry="15" fill="#E0C39A"/>
  <ellipse cx="120" cy="139" rx="21" ry="14" fill="#F3DFC0"/>
  <ellipse cx="124" cy="135" rx="7.6" ry="6" fill="#6E241C"/>
  <path d="M117 147 q7 6 14 1" stroke="#6E241C" stroke-width="2.6"
        fill="none" stroke-linecap="round"/>

  <!-- ── Near arm, reaching up to the handle ───────────────────────── -->
  <path d="M152 198 Q170 200 180 211" stroke="#F3DFC0" stroke-width="15"
        fill="none" stroke-linecap="round"/>

  <!-- ── Magnifying glass ─────────────────────────────────────────── -->
  <rect x="172" y="192" width="11" height="34" rx="5.5"
        transform="rotate(34 177 209)" fill="#3A3A3A"/>
  <circle cx="194" cy="176" r="27" fill="#EDF3F8"/>
  <g clip-path="url(#tgLens)">
    <path d="M174 164 q14 -13 30 -6 q-17 7 -23 21 Z" fill="#fff" opacity="0.9"/>
  </g>
  <circle cx="194" cy="176" r="27" fill="none" stroke="#3A3A3A" stroke-width="7"/>
  <!-- the hand comes last so it wraps the handle — see note 4 -->
  <ellipse cx="180" cy="212" rx="10" ry="9" fill="#F3DFC0"
           transform="rotate(-12 180 212)"/>

  <!-- ── The bug under inspection ─────────────────────────────────── -->
  <g transform="translate(214 226)">
    <g stroke="#17171A" stroke-width="1.5" stroke-linecap="round">
      <path d="M-6 -6 l-6 -5"/><path d="M-7 0 l-8 0"/><path d="M-6 6 l-6 5"/>
      <path d="M6 -6 l6 -5"/><path d="M7 0 l8 0"/><path d="M6 6 l6 5"/>
    </g>
    <ellipse cx="0" cy="0" rx="9.2" ry="7.8" fill="#E1362B"/>
    <path d="M0 -7.8 L0 7.8" stroke="#17171A" stroke-width="1.5"/>
    <circle cx="-4.1" cy="-2.7" r="1.75" fill="#17171A"/>
    <circle cx="4.1" cy="-2.7" r="1.75" fill="#17171A"/>
    <circle cx="-3.7" cy="3.1" r="1.55" fill="#17171A"/>
    <circle cx="3.7" cy="3.1" r="1.55" fill="#17171A"/>
    <ellipse cx="0" cy="-7.8" rx="4.5" ry="3.8" fill="#17171A"/>
    <circle cx="-1.7" cy="-9.2" r="0.85" fill="#fff"/>
    <circle cx="1.7" cy="-9.2" r="0.85" fill="#fff"/>
  </g>
</svg>
