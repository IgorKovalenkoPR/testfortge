<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 56" role="img" aria-label="TestFortge — a Testfort product">
  <title>TestFortge</title>
  <desc>Wordmark. &quot;TestFort&quot; in Testfort charcoal reads as the parent brand; the &quot;ge&quot; suffix in coral accent indicates the Forge product line.</desc>

  <defs>
    <linearGradient id="tfgCoral" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF865C"/>
      <stop offset="100%" stop-color="#FF8A59"/>
    </linearGradient>

    <!-- Subtle anvil/spark mark that evokes &quot;forge&quot; -->
    <symbol id="tfgMark" viewBox="0 0 56 56">
      <!-- Shield outline (Testfort heritage) -->
      <path d="M28 5 L48 12 V28 C48 40 38 48 28 52 C18 48 8 40 8 28 V12 Z"
            fill="#111111"/>
      <!-- Forge anvil inside the shield -->
      <path d="M18 30 H38 L34 26 H22 Z" fill="#FFFFFF"/>
      <rect x="25" y="30" width="6" height="10" fill="#FFFFFF"/>
      <rect x="20" y="40" width="16" height="3" rx="1" fill="#FFFFFF"/>
      <!-- Spark accent -->
      <circle cx="40" cy="18" r="2.2" fill="url(#tfgCoral)"/>
    </symbol>
  </defs>

  <!-- Left brand mark -->
  <use href="#tfgMark" x="0" y="0" width="56" height="56"/>

  <!-- Wordmark: TestFort in charcoal, ge in coral -->
  <g font-family="'Poppins','Montserrat',system-ui,sans-serif"
     font-weight="700"
     font-size="32"
     letter-spacing="-0.5">
    <text x="66" y="38" fill="#111111">TestFort</text>
    <text x="210" y="38" fill="url(#tfgCoral)">ge</text>
  </g>

  <!-- Small product descriptor under the wordmark -->
  <text x="66" y="50"
        font-family="'Poppins',system-ui,sans-serif"
        font-size="8"
        font-weight="500"
        letter-spacing="3"
        fill="#828282">
    A TESTFORT PRODUCT
  </text>
</svg>
