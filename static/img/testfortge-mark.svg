<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TestForTge">
  <title>TestForTge mark</title>
  <desc>Sword-shaped capital T inside a shield — the "T" bridges the wordmark so Testfort and Forge read as two joined words.</desc>
  <defs>
    <linearGradient id="tfgCoralMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB288"/>
      <stop offset="60%" stop-color="#FF865C"/>
      <stop offset="100%" stop-color="#E8643A"/>
    </linearGradient>
    <linearGradient id="tfgBladeSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F2F2F2"/>
      <stop offset="100%" stop-color="#BDBDBD"/>
    </linearGradient>
  </defs>

  <!-- Shield (coral gradient for high contrast on dark sidebar) -->
  <path d="M32 3 L57 12 V30 C57 44 46 54 32 60 C18 54 7 44 7 30 V12 Z"
        fill="url(#tfgCoralMark)" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Sword-T: crossguard (the T's horizontal bar) -->
  <rect x="17" y="17" width="30" height="6" rx="1" fill="#FFFFFF"/>
  <!-- Quillons (outer tips of the crossguard) -->
  <polygon points="14,17 17,15 17,25 14,23" fill="#FFFFFF"/>
  <polygon points="50,17 47,15 47,25 50,23" fill="#FFFFFF"/>

  <!-- Blade (the T's vertical stem, tapering to a point) -->
  <polygon points="29,23 35,23 33,47 31,47" fill="url(#tfgBladeSheen)" stroke="#FFFFFF" stroke-width="0.5"/>

  <!-- Pommel -->
  <circle cx="32" cy="15" r="2.2" fill="#FFFFFF"/>

  <!-- Forge spark -->
  <circle cx="47" cy="42" r="1.8" fill="#FFEFA8"/>
  <circle cx="50" cy="38" r="1.0" fill="#FFD56B"/>
</svg>
