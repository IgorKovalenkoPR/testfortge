[pytest]
# Markers only. Everything else (paths, parallelism) stays on the command
# line and in PYTEST_ADDOPTS, as before this file existed.
#
# The level markers are added automatically at collection from the file
# name — tests/_levels.py holds the mapping, tests/conftest.py applies it.
markers =
    unit: a single function or class, no app and no database (auto-applied)
    integration: through the Flask test client or the database (auto-applied)
    functional: a whole module's behaviour through its routes (auto-applied)
    e2e: a real browser against a live server (auto-applied)
    smoke: a quick does-it-start gate (auto-applied)
    load: load and capacity measurement (reserved; nothing maps to it yet)
    network: reaches a live third-party site; excluded from the CI gate, run by the non-blocking `network` job (see docs/testing/quarantine.md)
    xdist_group(name): keep these tests in one pytest-xdist worker
