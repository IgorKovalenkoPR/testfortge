<div class="guide-sections" hidden>

  <template data-content="workflow">
    <h3>What this card is</h3>
    <p>The route through the modules, for the case TestForTge exists for:
       a project starts, there is no Jira, no TestRail, and nobody wants
       to run the release out of a spreadsheet. One instance then holds
       the estimate, the test cases, the checklist, the runs, the defects
       and the numbers you report.</p>
    <p>Every other card describes one screen. This one describes the
       order.</p>

    <h3>What replaces what</h3>
    <ul>
      <li><strong>TestRail / Zephyr</strong> → <em>Test Cases</em> holds
          the pack, <em>Runs</em> is the register of walks over it. A run
          is the equivalent of a test run: it has an owner, a state and a
          pass rate.</li>
      <li><strong>Jira</strong> → <em>Bug Reports</em>, filed from the
          failing step itself, with the steps, the environment and the
          run already inside them.</li>
      <li><strong>The spreadsheet</strong> → <em>Checklist</em> for
          atomic coverage, and the run's own progress instead of a
          colour-coded column somebody forgets to update.</li>
      <li><strong>The estimate in a document</strong> →
          <em>Estimation</em>, which produces both the hours and the
          feature list the test cases are generated from, so the pack and
          the quote describe the same scope.</li>
    </ul>

    <h3>Day one — the instance</h3>
    <ol>
      <li><strong>Team → Invite</strong> everyone who will test. There
          are two roles: <em>Admin</em> creates projects, changes
          Settings and hands runs to people; <em>User</em> does the
          testing and sees what is assigned to them. Invitations are
          <strong>not emailed</strong> unless the server has a mail key —
          you get a link and send it however you already talk to your
          team.</li>
      <li><strong>Create the project</strong> from the 🗂 picker and name
          it after the client or the release. Everything attaches to
          whichever project is active, and an "Untitled project
          2026-08-11" is hard to recognise three weeks later.</li>
      <li><strong>Settings</strong>, once per team: the monthly AI
          allowance or your own Anthropic key, and — if screenshots and
          videos must survive a restart — object storage.</li>
    </ol>

    <h3>Scope, before you write a single case</h3>
    <p>Open <strong>Estimation</strong> and give it whatever the client
       actually sent: the requirements text, the Figma frames, or just
       the URL of the thing. You get hours per phase, a Min/Max band, a
       suggested tester headcount, and a feature list. Send the hours to
       whoever asked "how long"; keep the feature list, because the next
       button drops it straight into the generator.</p>

    <h3>Design — two artefacts, not one</h3>
    <ol>
      <li><strong>Test Cases</strong> for the flows that need
          preconditions, data and an expected result per step. This is
          what you show a client and what a new tester follows.</li>
      <li><strong>Checklist</strong> for the breadth a case pack makes
          expensive: every field, every state, every screen size. It is
          the artefact a spreadsheet was standing in for.</li>
    </ol>
    <p>Both save to the active project on their own. Both export —
       .xlsx, .csv, Markdown, HTML, and .feature for the test cases if
       there is a BDD repository waiting.</p>

    <h3>Execution — the part the spreadsheet does worst</h3>
    <ol>
      <li>Open <strong>Test Execution</strong>, pick what to walk (the
          whole pack, only the test cases, only the checklist, or a
          selection), name the environment, and start the run.</li>
      <li>Each item gets one verdict and a note. There are five:
          <em>Passed</em>, <em>Passed but</em> (it works, and there is a
          defect worth recording anyway), <em>Failed</em>,
          <em>Blocked</em> and <em>Skipped</em>. A verdict can be
          corrected — the run overwrites it rather than counting the item
          twice — and <em>Skipped</em> is not counted as exercised, so it
          cannot quietly inflate the pass rate.</li>
      <li>On <em>Failed</em> or <em>Passed but</em>, tick
          <strong>file a bug</strong>. The
          bug is created with the steps, the summary, the environment and
          a link back to this run, so nobody retypes a reproduction at
          six in the evening.</li>
      <li>Close the run when it is done. Closing it early is allowed and
          honest — a partial run is recorded as partial and says how many
          items have a verdict, which is the number that would otherwise
          get rounded up in a status meeting.</li>
    </ol>

    <h3>Who does what</h3>
    <p>An admin starts runs and assigns them; a tester opens
       <strong>Runs</strong>, sees their own queue, and resumes where
       they stopped — a walk of sixty checks survives a laptop sleep and
       a weekend. Reassigning an existing run is an admin action and
       keeps every verdict already recorded; starting a second run
       instead is how a team loses an afternoon.</p>

    <h3>Triage and the second release</h3>
    <p><strong>Bug Reports</strong> is the tracker: severity and priority
       as independent axes, states to move a defect through, evidence
       attached. Export CSV for a client who has an importer, or Markdown
       to paste into a channel or an email.</p>
    <p>For the next release, run the same pack again. The previous runs
       stay in <em>Runs</em> as the history, so "what did we cover last
       time" is a question with an answer, and the Dashboard shows the
       pass rate and the severity mix without anyone building a chart.</p>

    <h3>Four limits worth knowing before you promise this to a client</h3>
    <ul>
      <li><strong>Invitations and password resets are not emailed</strong>
          unless whoever runs the server sets a mail key. Until then you
          pass links by hand — fine for a team of five, awkward for
          thirty.</li>
      <li><strong>There is no live two-way sync with a tracker.</strong>
          Export is a file. If the client already lives in Jira, they get
          CSV or Markdown, not a mirrored issue.</li>
      <li><strong>Screenshots and videos sit on the instance's disk</strong>
          until object storage is configured in Settings. On a hosting
          plan with an ephemeral disk, a restart takes them with it —
          the verdicts and the bug text survive, the evidence does
          not.</li>
      <li><strong>AI generation costs money</strong> — either against the
          team's monthly allowance on the shared key, or against your own
          key. Past the allowance, generation falls back to the built-in
          rule engines rather than stopping.</li>
    </ul>
  </template>

  <template data-content="dashboard">
    <h3>What it is</h3>
    <p>The landing page. Shows your saved projects, live session
       metrics (test-case count, checklist items, execution
       ratios, bug severity, environments covered), and quick
       access to recent runs.</p>
    <h3>Typical workflow</h3>
    <ol>
      <li><strong>Pick or create a project.</strong> Every other
          module attaches its work to the active project. The
          sidebar shows the current project name; the 🗂 picker
          card on every module lets you switch without leaving the
          page (see the dedicated Projects card for details).</li>
      <li><strong>Skim the metrics.</strong> Pass-rate, bug
          severity distribution and environments covered tell you
          at a glance whether the last release was clean.</li>
      <li><strong>Open the relevant module.</strong> Estimation
          for new scope, Test Cases for design, Test Execution
          for running, Bug Reports for triage.</li>
    </ol>
    <h3>Common mistakes</h3>
    <ul>
      <li>Not setting a meaningful project name up front —
          auto-created "Untitled project YYYY-MM-DD HH:MM" rows
          accumulate. Use the 🗂 picker's <em>Create</em> form.</li>
    </ul>
  </template>

  <template data-content="estimation">
    <h3>What it is</h3>
    <p>Produces a Min/Max QA effort breakdown plus a starter test-
       case set from one of three sources. Output: hours per phase
       (Test design · Execution · Regression · Bug reporting +
       buffer) and a one-platform vs full-compatibility roll-up
       with PERT confidence bands.</p>
    <h3>Three input tabs</h3>
    <ol>
      <li><strong>📝 Requirements text.</strong> Paste a spec,
          user-story list, or feature backlog. The estimator
          normalises bullets / tables / freeform prose into a
          Feature list. You can also attach a .docx / .pdf /
          .xlsx — its text is merged with the textarea content.</li>
      <li><strong>🎨 Mockups.</strong> Upload PNG / JPG / WebP /
          PDF design screens (up to 20), or paste a public Figma
          file/frame URL. A vision model lists every testable
          element it sees — forms, dialogs, navigation, error
          states — and feeds them into the same estimator.</li>
      <li><strong>🌐 URL crawl.</strong> Paste a production or
          staging URL. The crawler walks the site, identifies
          pages and forms, and infers the architecture.</li>
    </ol>
    <h3>Reading the result</h3>
    <ul>
      <li>The summary card shows total test cases, total feature
          hours, and the one-platform vs full-compatibility
          roll-ups. The "PERT confidence" panel under it is the
          statistical view; the headline numbers stay
          two-point.</li>
      <li>The phase table breaks the total into Communication ·
          Documentation review · Checklist creation · Functional/
          UI · Bug reporting · Bug rechecking · Regression ·
          Compatibility (per extra platform).</li>
      <li>Click "Generate test cases from this estimate →" to
          drop the extracted feature list into the Test Cases
          generator.</li>
    </ul>
    <h3>Suggested team size</h3>
    <p>TestForTge picks a tester headcount for you based on the
       one-platform expected hours and complexity tier. You see it
       as a yellow <em>Suggested: N</em> badge above the Team-size
       coefficient. Click <strong>Override</strong> only when you
       have a fixed staffing constraint — the suggestion is what
       drives Brooks's-law communication overhead, and a manual
       override past 5 can inflate the estimate without reflecting
       reality.</p>
    <h3>Common mistakes</h3>
    <ul>
      <li>Switching tabs but leaving content in the previous tab
          — only the active tab's fields are submitted.</li>
      <li>Bumping the buffer to 30%+ "just in case" — the PERT
          band already contains the variability.</li>
      <li>For Mockups: needing more than 20 frames — split the
          run by epic / flow.</li>
      <li>Figma URLs without <code>FIGMA_PAT</code> — only the
          cover image is fetched; set the env var for per-frame
          renders.</li>
      <li>Overriding Team size on every run — the suggestion is
          deterministic given the same estimate, so an override
          you keep clicking is a signal to fix the input, not
          the headcount.</li>
    </ul>
  </template>

  <template data-content="test-cases">
    <h3>What it is</h3>
    <p>Generates ISTQB-shaped test cases (id / section / summary /
       preconditions / steps / data / expected / category / type /
       priority / status) from requirements text. Saves to the
       active project automatically.</p>
    <h3>Typical workflow</h3>
    <ol>
      <li>Paste requirements (or arrive prefilled from
          Estimation). Optionally attach .docx / .pdf / .xlsx /
          .csv / .md — text is extracted and merged.</li>
      <li>Add a custom prompt if you need a specific focus
          ("regression cases with form fills, submits and
          scrolls", "negative + edge cases only", "API only").</li>
      <li>Click Generate. Background job; progress modal polls
          until done.</li>
      <li>Review. Cases group by section. Use Export for
          .xlsx / .csv / Markdown / HTML, or <strong>.feature</strong>
          — a zip of Gherkin files, one per section, for a BDD
          repository.</li>
    </ol>
    <h3>URL-based generation</h3>
    <p>Paste a URL on its own line — the crawler walks the site,
       detects forms / auth / navigation, and the generator
       produces site-specific cases instead of generic web
       templates. Partial crawler failures (a 503 page, an
       SSRF-blocked host) flash a yellow banner; generation
       continues on whatever pages succeeded plus generic
       ISTQB-knowledge fallback.</p>
    <h3>TC editor — walkthrough binding</h3>
    <p>Each card on /test-cases has an inline editor for two
       fields that drive the walkthrough mode in Test Execution:</p>
    <ul>
      <li><strong>url_pattern</strong> — a glob like
          <code>/checkout/*</code>. When walkthrough mode is on,
          this TC fires on every page whose URL matches the
          pattern, without you wiring it manually.</li>
      <li><strong>trigger</strong> — when the TC should run:
          <code>manual</code> (default; runs only in tc_driven
          mode), <code>walkthrough_url_match</code> (fires only
          where the pattern matches), or <code>always</code> (runs
          on every visited page in a walkthrough run).</li>
    </ul>
    <h3>Common mistakes</h3>
    <ul>
      <li>Vague input → vague output. Give the generator
          structure: list fields, paths, error messages,
          environment.</li>
      <li>Re-running the same input expecting identical output —
          LLM generation is non-deterministic by design. Seed
          with the custom prompt for reproducibility.</li>
      <li>Submitting only a URL and expecting many specific
          cases — supplement with a sentence or two of context
          ("focus on checkout edge cases", "negative scenarios
          for the contact form") so the crawler's findings get
          shaped into the right test scope.</li>
    </ul>
  </template>

  <template data-content="checklist">
    <h3>What it is</h3>
    <p><strong>Low-level checklist</strong> — a detailed list that
       breaks each function down into specific checks, including
       negative scenarios and edge cases. The goal is exhaustive
       testing of a specific module.</p>
    <p>Example items:</p>
    <ul>
      <li>Authorization with empty fields.</li>
      <li>Authorization with an invalid password.</li>
      <li>Password recovery via email.</li>
    </ul>
    <h3>Rules for an effective checklist</h3>
    <ol>
      <li><strong>Atomicity (one item = one operation).</strong>
          Do not mix "Adding to cart" and "Payment" — these are
          separate actions and belong in separate items.</li>
      <li><strong>Unambiguity.</strong> Items must be brief but
          clear enough for a tester new to the product to know
          exactly what to do.</li>
      <li><strong>Language consistency.</strong> Write the whole
          list in one language (on real projects, almost always
          English).</li>
      <li><strong>Logical structure.</strong> Group checks by
          functional area — "Registration", "Shopping Cart",
          "User Profile".</li>
      <li><strong>Uniform formatting.</strong> Start every item
          with a noun ("Verification of…", "Submission of…") or
          an infinitive ("Verify…", "Send…").</li>
      <li><strong>Platforms &amp; Browsers.</strong> Always specify
          the devices, browsers and versions used for testing in
          separate columns.</li>
    </ol>
    <h3>Typical workflow</h3>
    <ol>
      <li>Drop your requirements / pasted text / attachment.</li>
      <li>Tweak the custom prompt for a specific lens
          ("from a security perspective", "mobile-first",
          "regression-only").</li>
      <li>Generate. Items group by functional area, each item
          starts with a verb or noun, includes negative scenarios
          and edge cases, and is small enough that a new tester
          can execute it without questions.</li>
      <li>Export to XLSX. Add Platforms &amp; Browsers columns
          before sharing with the team.</li>
    </ol>
    <h3>When to pick Checklist over Test Cases</h3>
    <ul>
      <li>You want exhaustive coverage of a specific module rather
          than test-script-shaped Steps to Reproduce.</li>
      <li>Time-boxed exploratory testing where each tester
          executes the same atomic items.</li>
      <li>Stakeholder demos / acceptance walk-throughs.</li>
      <li>Smoke + sanity rounds on a release candidate.</li>
    </ul>
  </template>

  <template data-content="test-execution">
    <h3>What it is</h3>
    <p>Runs your TC pack against an environment. Two modes:
       <strong>deterministic simulator</strong> (no Base URL — fast,
       heuristic) or <strong>real Playwright run</strong> (Base URL
       set — headless browser, screenshots, optional video).</p>

    <h3>Walking a pack by hand</h3>
    <p>Pick <em>Manual — walk it yourself</em> and the run becomes one
       item at a time, with its preconditions, numbered steps and
       expected result on screen and one click per verdict: Passed,
       Passed&nbsp;but, Failed, Blocked, Skipped.</p>
    <ul>
      <li><strong>It is resumable.</strong> Progress lives in the
          database, not the session, so a 60-check walk survives a
          laptop sleep, a browser restart and a hand-off to a colleague.
          The URL is the bookmark.</li>
      <li><strong>Failed or Passed but can file a bug in one click.</strong>
          Tick the box and what you typed in <em>"What did you see?"</em>
          becomes the actual result, word for word — the report never
          invents an observation you did not make.</li>
      <li><strong>Skipped is excluded from the pass rate; Blocked
          counts as executed.</strong> Closing early records the run as
          partial, so a half-finished walk is never read as full
          coverage.</li>
      <li>A later verdict on the same item overwrites the earlier one
          rather than appending, so corrections are cheap.</li>
    </ul>
    <h3>Typical workflow</h3>
    <ol>
      <li>Set <strong>Base URL</strong>. Without it the run is
          simulator-only — no live preview, no screenshots, no
          bug-attached video.</li>
      <li>Pick environment(s) — Web / Mobile Web / iOS /
          Android. Each one produces its own run record.</li>
      <li>Optionally open <em>"Open live view in new tab"</em>
          to watch frame-by-frame.</li>
      <li>Click <strong>Run Test Execution</strong>. The form
          stays put and shows in-page progress; the Playwright
          pass runs as a fully detached subprocess so it
          survives any web-server restart.</li>
      <li>When the worker finishes, the page auto-imports
          results: gallery thumbnails, per-case Pass/Fail, and
          auto-generated bug reports for failures.</li>
    </ol>
    <h3>Reading screenshots</h3>
    <ul>
      <li>Passed TCs show clean per-step "after" frames.</li>
      <li>Failed TCs lead with the <em>annotated failure
          screenshot</em> (red box + arrow on the broken element)
          plus the previous step's frame for context.</li>
      <li>Identical consecutive frames are deduped.</li>
    </ul>
    <h3>If the run stalls</h3>
    <p>The recent-runs table on <code>/test-execution/live</code>
       labels stalled runs (no info.json updates for &gt;2 min)
       with a red badge. Click <em>Import partial</em> to load
       whatever cases finished before the crash.</p>
    <h3>Common mistakes</h3>
    <ul>
      <li>Forgetting Base URL — the simulator runs and you
          wonder why the live view stays empty.</li>
      <li>Running 100+ cases on the free tier — Chromium memory
          adds up. Split into batches of ≤62 or upgrade to a
          Render Background Worker.</li>
    </ul>

    <h3>Generate TCs from a manual session (pilot)</h3>
    <p>Record yourself exploring the app — TestForTge slices the
       session into discrete proposed test cases and asks you to
       confirm each one. Saved TCs land in your project with their
       Playwright steps already attached, so the next run replays
       them deterministically. Pilot feature — gated on
       <code>RECORDER_ENABLED=1</code> per host.</p>
    <h4>One-time setup on the tester's machine</h4>
    <pre style="background:#0f172a;color:#e2e8f0;padding:8px 10px;
                 border-radius:4px;font-size:0.85em;">pip install playwright
python -m playwright install chromium</pre>
    <h4>Recording + review flow</h4>
    <ol>
      <li>From a TestForTge checkout, start review-mode capture:
          <pre style="background:#0f172a;color:#e2e8f0;padding:6px 10px;border-radius:4px;font-size:0.82em;">RECORDER_ENABLED=1 python -m tools.tfg_record \
    --project &lt;PID&gt; --url &lt;START_URL&gt;</pre>
          (Omit <code>--tc</code> to get review-mode. With
          <code>--tc</code> the recording attaches to an existing TC
          instead — that's the legacy single-TC flow.)</li>
      <li>Chromium opens. Walk the scenario as a tester would.
          Optionally use codegen's <strong>Assert visibility / text /
          URL</strong> toolbar buttons to mark expectation steps.</li>
      <li>Close the window. The CLI prints a <em>review link</em>
          like <code>/test-cases/review-session/&lt;token&gt;</code>.</li>
      <li>Open the link in TestForTge. The page shows N proposed
          TCs (LLM split your session into logical flows). For each:
          tick <em>Save</em>, optionally edit the summary, pick a
          suite tag (<strong>Smoke / Regression / E2E</strong> —
          the classifier pre-selects a sensible default).</li>
      <li>Click <strong>Save selected</strong>. Saved TCs land in
          your <code>/test-cases</code> page with a suite badge, and
          you can re-run them via <strong>Test Execution</strong>
          with the new <em>Run only [suite ▼]</em> knob.</li>
    </ol>
    <h4>Web Recorder browser extension (no terminal needed)</h4>
    <p>For testers who don't want to run a CLI, the
       <strong>TestForTge Recorder</strong> Chrome extension provides
       the same review-mode flow entirely in the browser. Pilot
       release — install via Developer mode unpacked.</p>
    <ol>
      <li><strong>Install the extension once:</strong> open
          <code>chrome://extensions</code> → toggle <em>Developer mode</em>
          on (top-right) → click <em>Load unpacked</em> → select the
          <code>extension/</code> folder from your TestForTge checkout.
          A 🎬 icon appears in the toolbar.</li>
      <li><strong>On <code>/test-cases</code></strong> (with
          <code>RECORDER_ENABLED=1</code> on the host) click
          <strong>🎬 Start session recording</strong> above the TC
          list. Enter a Start URL → click <em>Launch</em>.</li>
      <li>A new browser tab opens at the URL with a
          <strong>floating REC overlay</strong> in the top-right.
          Walk through the scenario — every click, fill, change, and
          SPA navigation is captured. Overlay shows live step count
          and timer.</li>
      <li>Click <strong>Stop</strong> on the overlay. The extension
          uploads captured steps and opens the review tab in the same
          browser. From there, the flow is identical to the CLI
          path: tick <em>Save</em>, pick suite tag, click
          <em>Save selected</em>.</li>
    </ol>
    <p>Each captured click carries up to 5 ranked locator alternates
       (<code>data-testid</code> > <code>id</code> > <code>role</code>
       > <code>label</code> > <code>placeholder</code> > ...) — same
       priority ladder the runner uses at replay time, so PR-A's
       multi-locator fallback works for extension-captured flows
       byte-identically to CLI-captured ones.</p>
    <p><strong>What's not yet captured:</strong> Shadow DOM internals,
       iframe-nested events, drag-and-drop sequences, file contents.
       The host element is captured but internals skipped — pilot
       trade-offs, not bugs.</p>

    <h4>CLI vs extension — when to use which</h4>
    <ul>
      <li><strong>Use the extension</strong> for routine recordings
          done by manual QA. No install on the tester's machine
          beyond the extension itself, no terminal, no Python.</li>
      <li><strong>Use the CLI</strong> (<code>python -m tools.tfg_record</code>)
          for CI/CD automation, debugging the recorder pipeline, or
          when you need to re-record from a saved codegen capture
          file (<code>--from-file</code>).</li>
    </ul>

    <h4>Suite tags — what they mean</h4>
    <ul>
      <li><strong>Smoke</strong> — short flows, single-page nav,
          quick health checks. Default for unclassified flows.</li>
      <li><strong>Regression</strong> — business-critical flows
          (auth, payment, checkout, billing, password reset,
          MFA…). Auto-tagged when the URL or step touches these
          keywords.</li>
      <li><strong>E2E</strong> — multi-page user journeys with
          form submission. Auto-tagged when the flow walks ≥2
          distinct pages and includes a submit.</li>
    </ul>
    <h4>Filters + suite-run knob</h4>
    <p>On <code>/test-cases</code>, the second filter row chips by
       suite — composed with the existing Positive / Negative chips
       so you can see "Smoke ∩ Positive" cards. On
       <code>/test-execution</code>, the <em>Run only [suite ▼]</em>
       knob next to the Run button ticks the right checkboxes for
       you before submission.</p>
    <h4>Review-link lifecycle</h4>
    <ul>
      <li>Link is single-use — once you click Save, a refresh
          shows "expired or already used".</li>
      <li>Drafts expire after 24 hours if you don't review them.</li>
      <li>A draft is bound to the project you ran the CLI against —
          switching to another project in the picker rejects the
          link with "wrong project".</li>
    </ul>

    <h3>QA Walkthrough mode</h3>
    <p>An orthogonal Run Mode at the top of the form. Choose
       <strong>QA walkthrough</strong> to skip the TC/CL picker and let
       the runner explore the page itself. It runs eight heuristic
       passes plus an accessibility scan on every page it visits:</p>
    <ul>
      <li><strong>Broken images</strong> — flags any <code>&lt;img&gt;</code>
          that loads with <code>naturalWidth=0</code>.</li>
      <li><strong>Hamburger / dropdown probe</strong> — on mobile and
          tablet sizes, taps the hamburger and counts nav links before
          and after; on desktop hovers each dropdown trigger.</li>
      <li><strong>Search field probe</strong> — opens the search
          trigger, fills "test", polls for a result/suggestion
          container.</li>
      <li><strong>Form auto-fill</strong> — fills every visible input
          in up to five forms with type-aware sample data. <em>Forms
          are NOT submitted.</em></li>
      <li><strong>Footer + social-link sanity</strong> — flags
          placeholder hosts (<code>example.com</code>, …) and
          missing <code>rel="noopener"</code> on external links.</li>
      <li><strong>CTA / tap-target audit</strong> — buttons without
          a destination, <code>href="#"</code>, sub-24-pixel hit
          areas.</li>
      <li><strong>axe-core accessibility</strong> — loads axe over
          CDN and reports Critical / Serious / Moderate issues with
          plain-language impact.</li>
      <li><strong>Landscape rotation</strong> — on mobile/tablet,
          flips the viewport and re-checks the page.</li>
    </ul>
    <p>Each finding becomes a bug in <em>Bug Reports</em> with
       <code>source:walkthrough</code> and <code>defect:&lt;class&gt;</code>
       labels. Cross-environment duplicates are collapsed by the
       walkthrough deduper before bug creation.</p>
    <p><strong>Opportunistic TC matching:</strong> when
       <em>TC binding = URL pattern</em>, every test case whose
       <code>trigger</code> is <code>walkthrough_url_match</code> or
       <code>always</code> and whose <code>url_pattern</code> matches
       the current page is fired through the regular TC runner. Pre-PR-2
       test cases default to <code>trigger=manual</code> and are
       skipped — set the trigger explicitly when authoring TCs you
       want the walkthrough to fire.</p>
    <p><strong>When to use it:</strong> smoke runs on a new build,
       link-rot checks after content migrations, accessibility
       baselines, exploratory pre-release sweeps. Not a substitute
       for scripted regression — heuristics catch defect <em>classes</em>,
       not your specific business flows.</p>
  </template>

  <template data-content="runs">
    <h3>What it is</h3>
    <p>The register of every walk over this project's pack — the manual
       ones and the automated ones. One row per run: number, when it
       started, mode, tester, state. It is the module that answers "who
       is testing what right now" and "what did we cover last
       release".</p>

    <h3>The two scopes</h3>
    <ul>
      <li><strong>Assigned to me</strong> — the tester's queue. This is
          the default with authentication on.</li>
      <li><strong>All runs</strong> — every run in the project.
          Admin-only, and deliberately not something a URL can widen: a
          tester who edits the address bar still sees their own runs.
          With authentication off there is nobody to scope by, so the
          page lists everything and says so.</li>
    </ul>

    <h3>What you do from here</h3>
    <ol>
      <li><strong>Resume</strong> an open run — it returns to the first
          item without a verdict, not to the beginning.</li>
      <li><strong>Review</strong> a closed one: the verdicts, the notes,
          the bugs it produced, and the pass rate it finished on.</li>
      <li><strong>Reassign</strong> (admin) when a walk outlives the
          person who started it. Every verdict already recorded stays.
          A run has an owner from the moment it starts — whoever started
          it, unless an admin picked someone else.</li>
    </ol>

    <h3>Open, partial, closed</h3>
    <p>A run is <em>open</em> until somebody closes it. Closing it with
       items left unjudged records it as <strong>partial</strong> and
       reports how many of the total have a verdict. That distinction is
       the whole point of the state: a partial run reported as complete
       overstates coverage, and it is the number a status meeting repeats
       without checking.</p>

    <h3>Common mistakes</h3>
    <ul>
      <li>Starting a new run instead of resuming — the verdicts are on
          the old one, and the new one begins at zero.</li>
      <li>Reading "Assigned to me" as empty and concluding the runs are
          gone. They are under <em>All runs</em>, held by somebody
          else.</li>
      <li>Leaving runs open across releases, so the register stops
          telling you what is actually in progress.</li>
    </ul>
  </template>

  <template data-content="automation">
    <h3>What it is</h3>
    <p>A separate module because automation has a different lifecycle
       from a manual run: the suite is <strong>generated here</strong>,
       <strong>runs where the browsers are</strong> (your machine or
       CI), and <strong>reports back here</strong>. Nothing executes on
       the TestForTge instance — the free tier has 512&nbsp;MB and one
       worker, and Chromium does not fit beside the app.</p>
    <h3>The three steps</h3>
    <ol>
      <li><strong>Generate.</strong> Download a self-contained Node
          project: playwright-bdd, allure-playwright, a step library, a
          GitHub Actions workflow, and the locators the recorder already
          learned. Only test cases saved in the <em>Manual&nbsp;+&nbsp;BDD</em>
          format are picked up — the pack counter on the page tells you
          how many there are.</li>
      <li><strong>Run.</strong> <code>npm ci &amp;&amp; npm test</code>.</li>
      <li><strong>Report back.</strong> <code>npm run upload</code> posts
          the <code>allure-results</code> directory to this page, which
          parses it in pure Python — no JVM anywhere.</li>
    </ol>
    <h3>Read the coverage report before you run anything</h3>
    <p>It is computed from the pack, not from a run, and it exists
       because of one rule: <strong>a check nobody performed must not
       report green.</strong></p>
    <ul>
      <li><strong>Assertions to verify manually</strong> — the step
          library could not bind them, so the scenario <em>skips</em>
          with the assertion text as the reason. Neither passed nor
          failed, and it says why.</li>
      <li><strong>Preconditions to set up by hand</strong> — skipped
          <em>before</em> acting, because a run from the wrong start
          state produces a result about a different situation.</li>
      <li><strong>Unbound action steps</strong> — these <em>fail</em>.
          A step the suite cannot perform is a defect in the test case,
          not something to pass over quietly.</li>
    </ul>
    <p>Skipped is its own column and is excluded from every pass rate,
       which is computed over executed scenarios only.
       <code>MANUAL-ASSERTIONS.md</code> in the bundle lists every gap
       by test-case id.</p>
    <h3>Result ingestion is off until you give it a token</h3>
    <p>The endpoint writes run history, so an unauthenticated one is an
       open write. Set <code>AUTOMATION_INGEST_TOKEN</code> on the
       service and CI sends it in an <code>X-TFG-Token</code> header;
       until then every upload is refused and the page says so.</p>
    <h3>Common mistakes</h3>
    <ul>
      <li>Generating with the pack in plain <em>Manual</em> format —
          the module finds no automation-targeted cases. Re-generate
          with <em>Manual&nbsp;+&nbsp;BDD</em> selected.</li>
      <li>Reading a high pass rate on a pack with a low bound-steps
          percentage. Check what skipped first.</li>
    </ul>
  </template>

  <template data-content="bug-reports">
    <h3>What it is</h3>
    <p>ISTQB-aligned, Jira-friendly defect store. Bugs are created
       automatically from Failed/Blocked test executions and can
       also be added manually. Each bug carries the evidence (annotated
       screenshot + recorded video) and links to the test case that
       produced it.</p>
    <h3>What's in a bug</h3>
    <ul>
      <li><strong>Title</strong> — a concise summary in the format
          <em>"[Component]: [Observable defect]"</em>. The component
          tells the developer where to look (e.g. "Career Page",
          "Login Form"); the defect describes what's actually
          happening (e.g. "click does not register; element times
          out"). Filler phrases like "does not work as expected"
          are stripped automatically because they do not describe
          observable behaviour.</li>

      <li><strong>Description</strong> — a 2-5 sentence narrative
          that explains the defect in third-person, observable
          language. Includes the scenario context, the affected
          URL, the action that triggers the defect, and the
          user-impact ("the user cannot complete checkout"). Does
          NOT speculate about root cause — only describes what was
          observed.</li>

      <li><strong>Steps to Reproduce</strong> — a numbered list of
          atomic actions that reliably reproduce the defect on a
          fresh session. Starts with <em>"1. Navigate to
          &lt;URL&gt;"</em>. Each step is one action, expressed in
          the same register a tester would use ("Click the
          'Submit' button", "Enter 'invalid@example' in the email
          field"). Pre-conditions appear before the numbered
          steps.</li>

      <li><strong>Actual Result (AR)</strong> — the observable
          state right after the last step in Steps to Reproduce.
          For automated bugs we include the verbatim Playwright
          error message and the final URL the browser was on,
          plus any browser console errors that fired during the
          step.</li>

      <li><strong>Expected Result (ER)</strong> — describes what
          should happen if the bug was fixed. Written in
          <em>"should"</em> phrasing ("The button should respond
          to the click within 1 second and open the application
          form"). Concrete and verifiable — a developer reading it
          knows exactly when the fix is done.</li>

      <li><strong>Severity</strong> — measures the <em>impact on
          the system itself</em>. Independent of who's affected
          or when the team plans to fix it. Levels:
          <ul>
            <li><em>Critical</em> — system unusable, core flow
                blocked, data loss, security breach.</li>
            <li><em>Major</em> — important feature works
                incorrectly; common task is broken; workaround
                exists but is inconvenient.</li>
            <li><em>Minor</em> — small deviation that doesn't
                break the feature; visual glitch on a
                non-critical screen.</li>
            <li><em>Trivial</em> — cosmetic, typo, spacing — no
                functional impact.</li>
          </ul></li>

      <li><strong>Priority</strong> — measures <em>how urgently
          the team should fix the defect</em>. Driven by business
          weight (revenue path? auth? niche admin screen?), user
          visibility, and release timing. <strong>Severity and
          Priority are independent axes</strong> — you can have:
          <ul>
            <li>Critical severity / Low priority — payment
                module crashes only on an obscure carrier the
                product hasn't launched on yet.</li>
            <li>Trivial severity / Highest priority — typo on
                the homepage hero seen by every visitor.</li>
            <li>Major severity / Medium priority — checkout
                edge case affects 2% of users; fix in next
                sprint.</li>
          </ul>
          See the <a href="https://testsigma.com/blog/difference-between-priority-and-severity/"
          target="_blank" rel="noopener">testsigma article</a>
          for the canonical reference.</li>

      <li><strong>Frequency</strong> — how often the defect can
          be reproduced. <em>Always</em> means every attempt
          reproduces; <em>Sometimes</em> means it's intermittent
          and timing-sensitive; <em>Rarely</em> needs specific
          state to trigger. Auto-generated bugs default to
          <em>Always</em> because they came from a deterministic
          Playwright run.</li>

      <li><strong>Attachments</strong> — the FAILED step's
          annotated screenshot (red box + arrow on the broken
          element) PLUS the previous step's clean screenshot for
          context. If video recording is on, the .webm of the
          full run is attached so reviewers can scrub to the
          moment the bug surfaced.</li>
    </ul>

    <h3>Typical workflow</h3>
    <ol>
      <li>After a run, open Bug Reports.</li>
      <li>Click a bug to expand. The screenshot above the form
          shows exactly where the run broke.</li>
      <li>Triage: read the auto-derived Severity and Priority,
          adjust based on business context the heuristic can't
          see (e.g. "this defect is on a feature shipping next
          week — bump to Highest").</li>
      <li>Assign to a developer, add labels, set the
          fix-version.</li>
      <li>Export when you are ready to hand off: <strong>CSV</strong>,
          which a tracker's CSV importer reads (Jira, Redmine and
          YouTrack all have one), or <strong>Markdown</strong>, which
          pastes into a ticket, a PR description or an email as it
          is.</li>
    </ol>

    <h3>Common mistakes</h3>
    <ul>
      <li>Treating Severity and Priority as the same thing —
          they aren't. A high-severity bug in a rarely-used
          flow may be Low priority; a low-severity bug on a
          page everyone sees may be Highest.</li>
      <li>Creating manual bugs without Steps to Reproduce —
          a developer can't fix what they can't reproduce.</li>
      <li>Trusting the auto-derived Severity blindly. The
          heuristic looks at the defect class and the affected
          area; it can't know that "this is the demo
          environment for a board meeting tomorrow".</li>
    </ul>
  </template>

  <template data-content="tedgie">
    <h3>What it is</h3>
    <p>The TestForTge AI assistant. Tedgie is trained on the
       <strong>ISTQB Foundation Level &amp; Advanced syllabuses</strong> —
       it answers QA-theory questions (test design techniques,
       defect lifecycle, risk-based testing, test types) and
       practical questions about the app's modules, your
       saved test cases, checklist and bug reports.</p>
    <h3>What Tedgie is good at</h3>
    <ul>
      <li><em>"What's the difference between equivalence
          partitioning and boundary value analysis?"</em> →
          ISTQB definitions + a worked example.</li>
      <li><em>"Which testing types apply to a payment flow?"</em>
          → functional, security, performance, compatibility,
          accessibility — each with a one-line rationale.</li>
      <li><em>"Why is my live view empty?"</em> → walks the
          diag checklist (Base URL set? Playwright importable?
          screenshots writing?).</li>
      <li><em>"Summarise the last 10 bugs by component."</em> →
          reads your session bugs and groups them.</li>
      <li><em>"Suggest 5 negative cases I'm missing for the
          login flow."</em> → generates targeted ideas from the
          current TC pack.</li>
      <li><em>"What's a good severity for an intermittent
          checkout error?"</em> → ISTQB-aligned answer with the
          Critical-vs-Major-vs-Minor reasoning.</li>
    </ul>
    <h3>What Tedgie is NOT</h3>
    <ul>
      <li>A test runner — use Test Execution.</li>
      <li>An estimation engine — use Estimation.</li>
      <li>An autonomous agent — Tedgie answers questions and
          generates content, but doesn't click buttons in your
          app for you.</li>
    </ul>
    <h3>Tip</h3>
    <p>Anchor questions in ISTQB terms ("what TEST DESIGN
       TECHNIQUE applies here?") to get the most precise
       answers; vague phrasing yields generic answers.</p>
  </template>

  <template data-content="projects">
    <h3>What it is</h3>
    <p>The project picker — the 🗂 card at the top of every module
       (Dashboard, Estimation, Test Cases, Checklist, Test
       Execution, Bug Reports). Lets you switch between projects
       without leaving the page you are on, and create a new project
       from anywhere with one click. Replaces the old "must navigate
       to Dashboard first" flow.</p>
    <h3>How it works</h3>
    <ul>
      <li><strong>Active project</strong> shows in the sidebar's
          bottom-left corner ("Project: …"). The picker dropdown
          highlights it.</li>
      <li><strong>Switch</strong> — pick another project from the
          dropdown and click the <em>Switch</em> button. The page
          re-renders with that project's test cases, checklist
          items, bug reports, last estimation snapshot, and last
          20 test-execution runs all loaded from the database.
          Your previous project's data is wiped from the session
          (it remains in the DB, just not in this tab's view).</li>
      <li><strong>Create</strong> — type a name in the right-hand
          input and click <em>Create</em>. The new project is
          saved to the database, becomes active, and the page
          re-renders with empty session — clean slate to start
          fresh work.</li>
      <li>The dropdown labels show counts at a glance:
          <code>Acme Checkout (12 TC · 5 CL · 3 bugs)</code>.</li>
    </ul>

    <h3>🕒 Recent projects on the Dashboard</h3>
    <p>The Dashboard shows a "Recent projects" card with the top
       5 projects you've touched, sorted by last activity. Each
       card displays the project name, content counts (TC / CL /
       bugs), and a last-activity timestamp; one-click "Open →"
       activates the project and rehydrates everything in one
       request. The currently active project is highlighted with
       an orange border and "Active" badge so you can see at a
       glance where you are. Projects beyond the top 5 stay in
       the picker dropdown — the widget just makes the most
       recent ones discoverable without scrolling a list.</p>

    <h3>What "recent" means</h3>
    <p>The system tracks an <em>activity timestamp</em> per
       project that bumps every time you save anything to it —
       generating test cases, running an estimation, recording
       a bug, starting a test execution run. So "Recent" means
       "where you actually did work", not "where you happened
       to land last week".</p>

    <h3>What's restored when you switch</h3>
    <ul>
      <li><strong>Test cases</strong> + traceability matrix.</li>
      <li><strong>Checklist</strong> items.</li>
      <li><strong>Bug reports</strong> with their attachments.</li>
      <li><strong>The latest estimation snapshot</strong> — the
          /estimation page renders the result card (PERT bands +
          phase table + history calibration) without re-running
          the estimator. Coefficients you used last time are
          pre-filled in the form.</li>
      <li><strong>The last 20 test-execution runs</strong> — the
          /test-execution page shows them in the run history with
          their stats, browser visibility, video flag, and start
          time. The full per-case results + screenshots stay on
          disk; click into a run to load them.</li>
    </ul>
    <h3>What attaches to the active project</h3>
    <p>Every action you take on the platform is tagged with the
       project that is active at that moment. When you switch
       projects, you switch context — the new project's data
       loads in, and any new work starts attaching to it.</p>
    <ul>
      <li>Generated <strong>test cases</strong> and the
          traceability matrix that links them to user
          stories.</li>
      <li>Generated <strong>checklist</strong> items.</li>
      <li><strong>Estimation snapshots</strong> — every time you
          click Run on the Estimation page, the result is
          recorded so you can compare scope changes across
          releases.</li>
      <li>Auto-generated and manually-created <strong>bug
          reports</strong>, with their attachments.</li>
      <li><strong>Test Execution runs</strong> — the per-case
          Pass/Fail/Blocked status, the recorded video, and the
          screenshot evidence each step produced.</li>
    </ul>
    <h3>Automatic recovery</h3>
    <p>The free Render hosting tier wipes sessions when it
       restarts (overnight, on redeploy, when memory runs low).
       The platform notices this on your next visit and quietly
       re-pins your most recent project so your work appears
       again. No manual import, no lost data — your projects
       live in the database, the session is just a thin pointer
       to the active one.</p>
    <h3>Common mistakes</h3>
    <ul>
      <li>Generating test cases without a meaningful project name
          — auto-created "Untitled project YYYY-MM-DD HH:MM" rows
          accumulate over time. Rename them or create a named
          project up front.</li>
      <li>Switching projects in the middle of a long Test
          Execution run — the run is already attached to the
          project that was active when you clicked "Run", so the
          switch only affects subsequent work.</li>
      <li>Trying to delete a project to "clear" it — that drops
          ALL its test cases, runs and bugs from the database.
          Use the picker to switch instead.</li>
    </ul>
  </template>

  <template data-content="team">
    <h3>What it is</h3>
    <p>Who is on the team, what they may do, and the invitations that
       have not been accepted yet. Projects, test cases, runs and bugs all
       belong to a team, not to a person — which is what makes a handover
       possible at all.</p>

    <h3>The two roles</h3>
    <ul>
      <li><strong>Admin</strong> — everything a user can do, plus:
          creates projects, changes Settings, invites and removes people,
          and hands runs to other testers.</li>
      <li><strong>User</strong> — works with everything: generates,
          walks runs assigned to them, files and triages bugs.</li>
    </ul>
    <p>Two roles rather than five, because a QA team of three to ten
       people has exactly one meaningful boundary: who may change the
       team's configuration.</p>

    <h3>Inviting someone</h3>
    <ol>
      <li>Enter the address, pick the role, create the invitation.</li>
      <li>You get <strong>a link</strong>. TestForTge sends no email
          unless whoever runs the server has configured a mail key, so
          normally you pass that link yourself — chat, email, whatever
          the team already uses.</li>
      <li>The invitation expires. The <em>Pending</em> table shows when,
          so an unaccepted one is visible rather than forgotten.</li>
    </ol>

    <h3>Guards that will stop you</h3>
    <ul>
      <li><strong>You cannot demote the last admin</strong> — your own
          role included. Promote somebody first; an instance with no
          admin can change nothing, and no screen can fix that from the
          inside.</li>
      <li>A removed member is <em>deactivated</em>, not erased: their
          runs, verdicts and bug reports keep their author, because a
          defect with no reporter is worth less than one with a name on
          it.</li>
    </ul>

    <h3>Where the first admin comes from</h3>
    <p>On a brand-new instance nobody can invite anybody — there is no
       first account to log in as. Whoever runs the server sets two
       variables and the first administrator is created at start-up. From
       then on the invitation flow is the only way in, and this page is
       where it happens.</p>

    <h3>Common mistakes</h3>
    <ul>
      <li>Inviting the whole team as Admin. It works, and then a project
          gets renamed and nobody knows by whom.</li>
      <li>Waiting for an email that is not being sent. Copy the
          link.</li>
      <li>Letting invitations expire and re-inviting instead of checking
          the Pending table.</li>
    </ul>
  </template>

  <template data-content="settings">
    <h3>What it is</h3>
    <p>Everything configured <strong>per team</strong>: the name, the AI
       spend, where artefacts are stored, how much room the team is
       using. Members can read this page; only admins can change it.
       Server-wide things — which models are allowed, whether email works
       at all — are shown here but set by whoever runs the instance.</p>

    <h3>AI usage and cost</h3>
    <ul>
      <li><strong>Monthly allowance (USD)</strong> caps spend on the
          platform's shared key. <code>0</code> removes the cap.</li>
      <li>The month's calls are itemised by feature and model, with the
          input, output and cost — so "why did generation get expensive"
          is answerable rather than a suspicion.</li>
      <li>Past the allowance, generation does not stop: it
          <strong>falls back to the built-in rule engines</strong>. The
          output is thinner and it costs nothing.</li>
    </ul>

    <h3>Your own API key</h3>
    <p>Supply an Anthropic key and the team's generation bills to your
       account, not the platform's — the allowance above stops applying.
       Two things to know: the key is stored encrypted and
       <strong>cannot be revealed again</strong> (only replaced or
       removed), and an instance whose server has no encryption key
       configured will refuse to store one at all rather than keep it in
       the clear.</p>

    <h3>Capacity</h3>
    <p>How many rows the team holds against the guideline for this
       server, what the largest part of that is, and roughly how much
       space it takes. Old execution results and closed bug reports from
       finished releases are the first things worth deleting — they are
       usually most of the total, and the least likely to be read
       again.</p>

    <h3>Storage</h3>
    <p>By default screenshots, videos and generated files live on the
       instance's own disk, which is fine until the instance restarts on
       a plan where that disk is ephemeral. Point the team at
       <strong>its own S3-compatible bucket</strong> — endpoint, bucket,
       region, access key, secret, HTTPS — and use
       <strong>Test connection</strong> before trusting it. The check
       writes, reads and deletes one object, and tells you which of the
       three failed.</p>

    <h3>Email</h3>
    <p>Whether this instance can send anything at all, the address it
       sends from, and how much of the daily allowance is spent.
       With no mail key configured, invitations and password resets
       produce links for you to pass on rather than silently failing to
       arrive.</p>

    <h3>Projects with no team</h3>
    <p>Projects created before teams existed belong to nobody. If there
       is exactly one team on the server you can claim them in one
       click; with several teams the bulk claim is refused on purpose,
       because guessing wrong makes one team's work visible to another
       and there is no undo for having seen it.</p>

    <h3>Common mistakes</h3>
    <ul>
      <li>Looking for per-project settings. There are none — this is per
          team, and the project is the container for work, not for
          configuration.</li>
      <li>Configuring a bucket and never pressing Test connection. A
          wrong region or a bucket that does not exist looks identical to
          a working setup until the first artefact disappears.</li>
      <li>Setting the allowance to 0 to "unblock" generation, when the
          honest fix is a key of your own or fewer full-pack
          regenerations.</li>
    </ul>
  </template>

  <template data-content="tips">
    <h3>Things that save hours</h3>
    <ul>
      <li><strong>Use the project picker.</strong> Pinning an
          active project means every TC, run, and bug
          auto-attaches. The 🗂 picker on every module lets you
          switch from anywhere — see the dedicated Projects card
          for the full mechanics.</li>
      <li><strong>Start at Estimation, not Test Cases.</strong>
          Even when you have a clear scope, running the
          estimator first surfaces edge cases you'd otherwise
          miss in TC generation.</li>
      <li><strong>Set Base URL even on the simulator path.</strong>
          It enables real-site checks that catch bugs the
          simulator can't see.</li>
      <li><strong>Open Live view in a separate tab</strong>
          when running &gt;30 cases. Watching frame-by-frame is
          usually how you spot WHY a run stalled.</li>
      <li><strong>Match the export to its reader:</strong> .xlsx for
          stakeholders, Markdown or HTML for documentation, CSV for a
          tracker's importer, .feature for a BDD repository. Every
          export carries the same data.</li>
      <li><strong>Use the Bug Reports tabs to triage.</strong>
          The auto-bugs land Open; move them through the
          workflow as they're worked.</li>
      <li><strong>Ask Tedgie when you're stuck.</strong> The
          ISTQB-trained assistant knows the test-design
          techniques and the app's diag flow.</li>
      <li><strong>Override Team-size sparingly.</strong> The
          system suggestion is a function of your estimate; a
          manual override that you repeat every run is a hint
          to fix the estimate's complexity tier or hour budget,
          not the headcount.</li>
    </ul>
  </template>
