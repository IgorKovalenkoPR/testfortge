    <p>Це маршрут по модулях — для того випадку, заради якого TestForTge

    <h3>Що чим замінюється</h3>
    <ul>
      <li><strong>TestRail / Zephyr</strong> → <em>Тест-кейси</em>

          посилання на прогін.</li>
      <li><strong>Таблиця</strong> → <em>Чек-ліст</em> для атомарного
          покриття, а замість колонки з кольорами — власний прогрес
          прогону, який нікому не треба вручну підтримувати.</li>
      <li><strong>Оцінка в документі</strong> → <em>Оцінка</em>, яка
          віддає і години, і список фіч, з якого потім генеруються
          кейси. Тобто пак і комерційна пропозиція описують один і той
          самий обсяг.</li>
    </ul>

    <h3>День перший — інстанс</h3>
    <ol>
      <li><strong>Команда → Запросити</strong> всіх, хто буде
          тестувати. Ролей дві: <em>Admin</em> створює проєкти, змінює
          налаштування і передає прогони людям; <em>User</em> тестує й
          бачить те, що призначено йому. Запрошення
          <strong>не надсилаються листом</strong>, якщо на сервері не
          налаштована пошта — ви отримуєте посилання й передаєте його
          тим каналом, яким команда і так спілкується.</li>
      <li><strong>Створіть проєкт</strong> у пікері 🗂 і назвіть його
          іменем клієнта або релізу. Усе інше прив'язується до активного
          проєкту, а «Untitled project 2026-08-11» через три тижні вже
          не розпізнати.</li>
      <li><strong>Налаштування</strong> — один раз на команду: місячний
          ліміт на AI або власний ключ Anthropic, і — якщо скриншоти й
          відео мусять переживати перезапуск — об'єктне сховище.</li>
    </ol>

    <h3>Обсяг, ще до першого кейса</h3>
    <p>Відкрийте <strong>Оцінку</strong> й дайте їй те, що клієнт
       насправді надіслав: текст вимог, кадри з Figma або просто URL
       продукту. Отримаєте години за фазами, коридор Min/Max,
       рекомендовану кількість тестувальників і список фіч. Години
       віддайте тому, хто питав «скільки часу»; список фіч залиште —
       наступна кнопка кладе його прямо в генератор.</p>

    <h3>Дизайн — два артефакти, а не один</h3>
    <ol>
      <li><strong>Тест-кейси</strong> — для сценаріїв, яким потрібні
          передумови, дані й очікуваний результат на крок. Це те, що
          показують клієнту і за чим іде новий тестувальник.</li>
      <li><strong>Чек-ліст</strong> — для широти, яка в паку кейсів
          коштує дорого: кожне поле, кожен стан, кожна ширина екрана.
          Саме цей артефакт раніше підміняла таблиця.</li>
    </ol>
    <p>Обидва самі зберігаються в активний проєкт. Обидва

       .feature, якщо на них чекає BDD-репозиторій.</p>

    <h3>Виконання — те, що таблиця робить найгірше</h3>
    <ol>
      <li>Відкрийте <strong>Виконання тестів</strong>, виберіть, що
          проходити (весь пак, лише кейси, лише чек-ліст або вибірку),
          назвіть середовище й почніть прогін.</li>
      <li>Кожен пункт отримує один вердикт і примітку. Вердиктів
          п'ять: <em>Passed</em>, <em>Passed but</em> (працює, але є
          дефект, який усе одно варто зафіксувати), <em>Failed</em>,
          <em>Blocked</em> і <em>Skipped</em>. Вердикт можна виправити —
          прогін перезаписує його, а не рахує пункт двічі — а
          <em>Skipped</em> не вважається пройденим, тому не може тихо
          завищити відсоток проходження.</li>
      <li>На <em>Failed</em> або <em>Passed but</em> поставте галочку
          <strong>створити баг</strong>. Баг створиться з кроками,
          заголовком, середовищем і посиланням на цей прогін — щоб
          ніхто не передруковував відтворення о шостій вечора.</li>
      <li>Закрийте прогін, коли він завершений. Закрити раніше можна, і
          це чесно: частковий прогін так і записується частковим і
          повідомляє, скільком пунктам виставлено вердикт. Саме це
          число інакше округлюють на статус-мітингу.</li>
    </ol>

    <h3>Хто що робить</h3>
    <p>Адмін стартує прогони й призначає їх; тестувальник відкриває
       <strong>Прогони</strong>, бачить свою чергу й продовжує з місця,
       де зупинився — прохід із шістдесяти перевірок переживає і сон
       ноутбука, і вихідні. Перепризначення наявного прогону — дія
       адміністратора, і вона зберігає всі вже виставлені вердикти;
       натомість старт другого прогону — це те, як команда втрачає
       півдня.</p>

    <h3>Тріаж і наступний реліз</h3>
    <p><strong>Баг-репорти</strong> — це трекер: severity й priority як
       незалежні осі, стани, якими ведуть дефект, прикріплені докази.
       Експортуйте CSV для клієнта, у якого є імпортер, або Markdown —
       щоб вставити в канал чи лист.</p>
    <p>Для наступного релізу проженіть той самий пак ще раз. Попередні
       прогони лишаються в <em>Прогонах</em> як історія, тому питання
       «що ми покривали минулого разу» має відповідь, а Головна показує
       відсоток проходження й розподіл за severity без того, щоб хтось
       будував графік руками.</p>

    <h3>Чотири обмеження, які варто знати до обіцянки клієнту</h3>
    <ul>
      <li><strong>Запрошення й скидання пароля не надсилаються
          листами</strong>, поки той, хто тримає сервер, не налаштує
          пошту. До того посилання передаються руками — нормально для
          команди з п'яти людей, незручно для тридцяти.</li>
      <li><strong>Живої двосторонньої синхронізації з трекером
          немає.</strong> Експорт — це файл. Якщо клієнт живе в Jira, він
          отримає CSV або Markdown, а не віддзеркалений тікет.</li>
      <li><strong>Скриншоти й відео лежать на диску інстансу</strong>,
          поки в налаштуваннях не вказане об'єктне сховище. На тарифі з
          ефемерним диском перезапуск забирає їх із собою: вердикти й
          текст багів залишаються, докази — ні.</li>
      <li><strong>Генерація коштує грошей</strong> — або з місячного
          ліміту команди на спільному ключі, або з вашого власного
          ключа. За межею ліміту генерація не спиняється, а переходить
          на вбудовані правила.</li>
    </ul>

          адміністратора, і навмисно не те, що можна розширити через
          URL: тестувальник, який відредагує адресний рядок, усе одно

          розмежовувати нема за чим, тому сторінка показує все й пише
          про це прямо.</li>

    <ol>

          першого пункту без вердикту, а не на початок.</li>
      <li><strong>Переглянути</strong> закритий: вердикти, примітки,
          створені баги й відсоток, на якому він завершився.</li>

          зберігаються. Власник у прогону є з моменту старту — той, хто
          його почав, якщо адміністратор не вказав іншого.</li>

    <p>Прогін <em>відкритий</em>, поки його хтось не закриє. Закриття з

       завершений, завищує покриття — і саме це число потім повторюють
       на мітингу, не перевіряючи.</p>

    <ul>

          перестає показувати, що справді в роботі.</li>
    </ul>

    <p>Сховище дефектів за ISTQB, дружнє до Jira. Баги створюються

    <h3>Що є в багу</h3>
    <ul>
      <li><strong>Заголовок</strong> — стислий опис у форматі
          <em>«[Компонент]: [спостережуваний дефект]»</em>. Компонент
          каже розробникові, де шукати (напр. «Сторінка кар'єри»,

          Порожні фрази на кшталт «працює не так, як очікувалось»
          автоматично прибираються, бо не описують спостережувану
          поведінку.</li>

      <li><strong>Опис</strong> — 2–5 речень, які пояснюють дефект у
          третій особі спостережуваною мовою. Містить контекст
          сценарію, уражений URL, дію, що спричиняє дефект, і вплив на
          користувача («користувач не може завершити оформлення
          замовлення»). НЕ припускає причину — лише описує
          побачене.</li>

      <li><strong>Кроки відтворення</strong> — нумерований список
          атомарних дій, які надійно відтворюють дефект на свіжій
          сесії. Починається з <em>«1. Перейти на &lt;URL&gt;»</em>.
          Кожен крок — одна дія, у тому самому регістрі, яким писав би
          тестувальник («Натиснути кнопку "Відправити"», «Ввести
          "invalid@example" у поле email»). Передумови стоять перед
          нумерованими кроками.</li>

      <li><strong>Фактичний результат (AR)</strong> — спостережуваний
          стан одразу після останнього кроку відтворення. Для
          автоматичних багів ми додаємо дослівне повідомлення про
          помилку від Playwright і кінцевий URL, на якому був браузер,
          плюс усі помилки консолі, що виникли під час кроку.</li>

      <li><strong>Очікуваний результат (ER)</strong> — описує, що має
          відбуватись, якщо баг виправлено. Формулюється через
          <em>«має»</em> («Кнопка має відреагувати на клік протягом 1
          секунди й відкрити форму заявки»). Конкретно й перевірювано —
          розробник, прочитавши це, точно знає, коли виправлення
          завершене.</li>

          саму систему</em>. Не залежить від того, кого це зачіпає й
          коли команда планує лагодити. Рівні:
          <ul>
            <li><em>Critical</em> — системою неможливо користуватися,

                безпеки.</li>
            <li><em>Major</em> — важлива функція працює неправильно;
                поширене завдання зламане; обхідний шлях є, але
                незручний.</li>
            <li><em>Minor</em> — невелике відхилення, яке не ламає
                функцію; візуальний артефакт на некритичному
                екрані.</li>
            <li><em>Trivial</em> — косметика, друкарська помилка,
                відступи — без функціонального впливу.</li>
          </ul></li>

      <li><strong>Пріоритет (Priority)</strong> — міряє, <em>наскільки
          терміново команді це лагодити</em>. Визначається бізнесовою
          вагою (шлях доходу? автентифікація? нішевий адмінський
          екран?), видимістю для користувачів і часом релізу.
          <strong>Серйозність і пріоритет — незалежні осі</strong>,
          тож буває:
          <ul>
            <li>Critical severity / низький пріоритет — модуль оплати
                падає лише в маловідомого оператора, з яким продукт ще

            <li>Trivial severity / найвищий пріоритет — друкарська
                помилка в головному банері, яку бачить кожен
                відвідувач.</li>
            <li>Major severity / середній пріоритет — межовий випадок
                оформлення замовлення зачіпає 2% користувачів; лагодимо
                в наступному спринті.</li>
          </ul>
          Канонічне джерело — <a
          href="https://testsigma.com/blog/difference-between-priority-and-severity/"
          target="_blank" rel="noopener">стаття testsigma</a>.</li>

      <li><strong>Частота</strong> — як часто дефект вдається
          відтворити. <em>Always</em> означає, що відтворюється щоразу;
          <em>Sometimes</em> — плаваючий і залежить від часу;
          <em>Rarely</em> — потребує особливого стану. Автоматично
          створені баги мають <em>Always</em>, бо походять із
          детермінованого прогону Playwright.</li>

      <li><strong>Вкладення</strong> — анотований скріншот кроку, що
          ВПАВ (червона рамка й стрілка на зламаному елементі), ПЛЮС
          чистий скріншот попереднього кроку для контексту. Якщо
          ввімкнено запис відео, прикріплюється .webm усього прогону,
          щоб рецензент міг перемотати до моменту появи бага.</li>
    </ul>

    <h3>Типовий порядок роботи</h3>
    <ol>
      <li>Після прогону відкрийте «Баг-репорти».</li>
      <li>Натисніть на баг, щоб розгорнути. Скріншот над формою

          наступного тижня — піднімаємо до найвищого»).</li>
      <li>Призначте розробника, додайте мітки, задайте версію

          вставляється в тікет, опис PR чи лист як є.</li>

    <h3>Типові помилки</h3>
    <ul>
      <li>Вважати серйозність і пріоритет одним і тим самим — це не

       проєкт і одним запитом підтягує все назад. Поточний активний
       проєкт підсвічено помаранчевою рамкою й бейджем «Активний», щоб
       одразу було видно, де ви. Проєкти поза першою п'ятіркою
       лишаються у випадному списку перемикача — віджет лише робить
       найсвіжіші помітними без гортання списку.</p>

    <h3>Що означає «нещодавні»</h3>
    <p>Система тримає для кожного проєкту <em>відмітку активності</em>,
       яка оновлюється щоразу, коли ви щось у нього зберігаєте —
       генеруєте тест-кейси, робите оцінку, заводите баг, запускаєте
       прогін. Тож «нещодавні» означає «де ви справді працювали», а не
       «де випадково опинилися минулого тижня».</p>

    <h3>Що відновлюється при перемиканні</h3>
    <ul>
      <li><strong>Тест-кейси</strong> + матриця трасування.</li>
      <li>Пункти <strong>чек-ліста</strong>.</li>
      <li><strong>Баг-репорти</strong> з їхніми вкладеннями.</li>
      <li><strong>Останній знімок оцінки</strong> — сторінка
          /estimation малює картку результату (інтервали PERT +
          таблиця фаз + калібрування за історією) без повторного
          прогону оцінювача. Коефіцієнти, які ви використали минулого
          разу, підставляються у форму.</li>
      <li><strong>Останні 20 прогонів виконання</strong> — сторінка
          /test-execution показує їх в історії з їхньою статистикою,
          видимістю браузера, прапорцем відео й часом старту. Повні
          результати по кейсах і скріншоти лишаються на диску;
          натисніть на прогін, щоб їх завантажити.</li>
    </ul>
    <h3>Що прив'язується до активного проєкту</h3>
    <p>Кожна ваша дія на платформі позначається тим проєктом, який
       активний у цю мить. Перемикаючи проєкт, ви перемикаєте контекст:
       завантажуються дані нового проєкту, і вся нова робота
       прив'язується вже до нього.</p>
    <ul>
      <li>Згенеровані <strong>тест-кейси</strong> й матриця трасування,
          що пов'язує їх із user stories.</li>
      <li>Згенеровані пункти <strong>чек-ліста</strong>.</li>
      <li><strong>Знімки оцінки</strong> — щоразу, коли ви натискаєте
          «Запустити» на сторінці оцінки, результат записується, щоб ви
          могли порівнювати зміни обсягу між релізами.</li>
      <li>Автоматично й вручну створені <strong>баг-репорти</strong> з
          їхніми вкладеннями.</li>
      <li><strong>Прогони виконання тестів</strong> — статус
          Pass/Fail/Blocked по кожному кейсу, записане відео й докази-
          скріншоти, які дав кожен крок.</li>
    </ul>
    <h3>Автоматичне відновлення</h3>
    <p>Безкоштовний тариф хостингу Render витирає сесії при
       перезапуску (вночі, при редеплої, коли бракує пам'яті).
       Платформа помічає це під час вашого наступного візиту й тихо
       повертає активним ваш найсвіжіший проєкт, тож робота
       з'являється знову. Ніякого ручного імпорту, нічого не
       втрачено — ваші проєкти живуть у базі даних, а сесія лише
       тонкий вказівник на активний.</p>
    <h3>Типові помилки</h3>
    <ul>
      <li>Генерувати тест-кейси без осмисленої назви проєкту — рядки
          «Untitled project YYYY-MM-DD HH:MM», створені автоматично, з
          часом накопичуються. Перейменуйте їх або створіть названий
          проєкт одразу.</li>
      <li>Перемикати проєкти посеред довгого прогону виконання —
          прогін уже прив'язаний до проєкту, який був активним у мить
          натискання «Запустити», тож перемикання впливає лише на
          подальшу роботу.</li>
      <li>Видаляти проєкт, щоб його «очистити», — це прибирає з бази
          ВСІ його тест-кейси, прогони й баги. Замість цього
          скористайтеся перемикачем.</li>
    </ul>

    <h3>Власний API-ключ</h3>
    <p>Якщо додати ключ Anthropic, генерація команди списується з вашого

       моменти: ключ зберігається зашифрованим і
       <strong>показати його знову неможливо</strong> (лише замінити або
       видалити), а інстанс, у якого на сервері немає ключа шифрування,
       радше відмовиться зберігати ключ, ніж триматиме його відкритим
       текстом.</p>

    <h3>Місткість</h3>
    <p>Скільки рядків команда тримає відносно орієнтиру цього сервера,
       що з цього найбільша частина і приблизно скільки місця це
       займає. Старі результати виконання й закриті баг-репорти
       завершених релізів — перше, що варто видаляти: зазвичай це
       більшість обсягу й найменш імовірне для повторного читання.</p>

    <h3>Сховище</h3>
    <p>За замовчуванням скриншоти, відео й згенеровані файли лежать на
       власному диску інстансу — і це нормально, поки інстанс не
       перезапуститься на тарифі, де диск ефемерний. Вкажіть команді
       <strong>власний бакет, сумісний з S3</strong> — endpoint, бакет,
       регіон, ключ доступу, секрет, HTTPS — і скористайтеся
       <strong>перевіркою з'єднання</strong>, перш ніж на нього
       покладатися. Перевірка записує, читає й видаляє один об'єкт і
       каже, який із трьох кроків не вдався.</p>

    <h3>Пошта</h3>
    <p>Чи може цей інстанс щось надсилати взагалі, з якої адреси надсилає

       запрошення та скидання пароля дають посилання, які ви передаєте
       самі, — замість листа, що тихо не доходить.</p>

    <h3>Проєкти без команди</h3>
    <p>Проєкти, створені до появи команд, не належать нікому. Якщо на
       сервері рівно одна команда, їх можна забрати одним кліком; якщо
       команд кілька, масове привласнення навмисно заборонене: помилка
       робить роботу однієї команди видимою для іншої, а скасувати
       «вже побачене» неможливо.</p>

    <h3>Типові помилки</h3>
    <ul>
      <li>Шукати налаштування на проєкт. Їх немає — усе на команду, а
          проєкт є контейнером для роботи, не для конфігурації.</li>
      <li>Налаштувати бакет і не натиснути перевірку з'єднання. Хибний
          регіон або відсутній бакет виглядають так само, як робоча
          конфігурація, — до моменту, коли зникне перший артефакт.</li>
      <li>Виставити ліміт у 0, щоб «розблокувати» генерацію, коли чесне
          рішення — власний ключ або менше повних перегенерацій
          паку.</li>
    </ul>
