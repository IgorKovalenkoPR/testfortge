<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TestForTge Recorder</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      width: 280px;
      margin: 0;
      padding: 14px;
      background: #fff;
      color: #1e293b;
    }
    h1 { font-size: 1.05em; margin: 0 0 8px 0; }
    p { font-size: 0.85em; color: #475569; margin: 4px 0; }
    .status-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 10px;
      margin: 10px 0;
    }
    .status-active { background: #fef2f2; border-color: #fca5a5; }
    .status-active strong { color: #dc2626; }
    button {
      width: 100%;
      padding: 8px 12px;
      font-size: 0.9em;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid #cbd5e1;
      background: #f1f5f9;
      color: #1e293b;
    }
    button.primary {
      background: #f97316;
      color: #fff;
      border-color: #ea580c;
    }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    button.secondary { background: #f1f5f9; }
    button + button { margin-top: 6px; }
    code {
      background: #f1f5f9;
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 0.82em;
    }
    label { font-size: 0.8em; color: #475569; display: block; margin: 8px 0 3px; }
    input[type="url"] {
      width: 100%;
      box-sizing: border-box;
      font-size: 0.85em;
      padding: 7px 9px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-family: monospace;
    }
    .step-count { color: #0369a1; font-weight: 600; }
    .hint { font-size: 0.78em; color: #94a3b8; margin-top: 8px; }
    .err { color: #dc2626; }
    .instance-row { font-size: 0.76em; color: #94a3b8; margin-top: 10px;
                    display: flex; gap: 6px; align-items: baseline;
                    flex-wrap: wrap; }
    .instance-row a { color: #0369a1; cursor: pointer; }
    /* Belt-and-braces: the JS toggles these via the `hidden` attribute.
       An explicit !important rule keeps `hidden` winning even if a
       future style adds a competing display. (Same class of bug that
       bit the web recorder modal.) */
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>🎬 TestForTge Recorder</h1>

  <div id="status-card" class="status-card">
    <p id="status-line">Loading…</p>
  </div>

  <!-- Active-recording controls -->
  <button id="stop-btn" class="primary" disabled hidden>Stop recording</button>

  <!-- Idle controls: start a new recording without leaving the browser -->
  <div id="idle-controls" hidden>
    <label for="sut-url">Site to record</label>
    <input type="url" id="sut-url" placeholder="https://app.example.com/login"
           autocomplete="off" spellcheck="false">
    <p id="idle-status" class="hint" style="min-height:1em;"></p>
    <button id="start-btn" class="primary">● Start recording</button>
    <button id="open-tfg-btn" class="secondary">Open TestForTge /test-cases ↗</button>

    <div class="instance-row">
      <span>Instance: <code id="base-display">— not set —</code></span>
      <a id="base-edit">change</a>
    </div>
    <div id="base-edit-row" hidden style="margin-top:6px;">
      <input type="url" id="base-url"
             placeholder="https://testfortge.onrender.com"
             autocomplete="off" spellcheck="false">
      <button id="base-save" class="secondary">Save instance</button>
    </div>

    <p class="hint">
      Starting opens <code>/test-cases</code> with this URL pre-filled and
      launches the recorder there — so it binds to your project and login.
    </p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
