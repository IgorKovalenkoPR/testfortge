name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel in-flight runs on force-push / rapid iteration so we don't queue
# up redundant CI minutes.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    # A real PostgreSQL for the schema-migration tests. Production runs
    # Postgres and the ALTERs are hand-written SQL, so verifying them only
    # on SQLite verifies them on the wrong engine. Free in Actions, and it
    # means every push checks the upgrade path a deploy will actually take.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tfg
          POSTGRES_PASSWORD: tfg
          POSTGRES_DB: tfg_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      # Don't short-circuit — we want to see failures on ALL versions,
      # not just the first one to break.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    env:
      # config.py mints an ephemeral SECRET_KEY when FLASK_DEBUG=1, so CI
      # doesn't need a real one. The test fixtures flip TESTING=True which
      # also disables CSRF — full prod-parity is covered by the container
      # build, not this matrix.
      FLASK_DEBUG: "1"
      # Force UTF-8 stdio so emojis in log messages don't blow up pytest
      # output capture on minimal-locale runners.
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
      # Points tests/test_schema_migration.py at the service container
      # above. Its contents are destroyed by those tests, which is why it
      # is a dedicated throwaway database and not the app's own.
      TFG_TEST_POSTGRES_URL: "postgresql+psycopg2://tfg:tfg@localhost:5432/tfg_migration_test"
      # Run the suite in parallel. Actions minutes are billed by wall
      # clock, so this is a saving and not a luxury: locally the whole
      # suite is 2:55 with four workers against 6:20 sequentially, and
      # this job runs the suite five times (matrix ×3, plus coverage and
      # the auth-on leg).
      #
      # Set through PYTEST_ADDOPTS rather than on each command because
      # ``run_tests.py`` builds its own argv and pytest reads this
      # variable itself — so one line covers the runner too.
      #
      # ``--dist loadgroup`` and not the default ``load``: three test files
      # talk to the shared Postgres service container, and M-1's per-process
      # isolation gives each worker its own *SQLite* scratch database — it
      # cannot give it its own Postgres server. Those files carry
      # ``pytest.mark.xdist_group("postgres")``, which loadgroup keeps
      # inside one worker; two workers dropping and recreating tables in one
      # database would reproduce exactly the false failures M-1 removed.
      #
      # ``loadfile`` was the first attempt and was not enough: it keeps a
      # file together and says nothing about three of them.
      # tests/test_suite_isolation.py::TestTheParallelCIStaysSafe holds the
      # pairing, and fails if a fourth file starts using that database
      # without the mark.
      PYTEST_ADDOPTS: "-n auto --dist loadgroup"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Test-only, and deliberately not in requirements.txt: that file
          # builds the web image, and a coverage plugin has no business in a
          # production dyno's site-packages.
          pip install pytest-cov
          # Parallel test execution (see PYTEST_ADDOPTS above). Test-only,
          # like the coverage plugin.
          pip install pytest-xdist
          # E8.7: a real S3 server over HTTP, so the storage adapter is
          # exercised on the wire and not against a stub. Test-only and
          # deliberately NOT in requirements.txt — it pulls in boto3, the
          # 15 MB package ADR 0002 §4.5 measured and rejected for the image.
          pip install "moto[server]"
          # MCP server tests import `mcp_server.server` which pulls in
          # the `mcp` package + (for the HTTP entrypoint) `uvicorn`.
          # These are listed separately because they're not needed by
          # the Flask web image — but CI must install them so pytest
          # can collect tests/test_mcp_*.
          pip install -r mcp_server/requirements.txt
          pip install pytest

      - name: Show environment
        run: |
          python --version
          pip list

      # Validate YAML-backed QA knowledge before tests so malformed
      # content fails fast with a clean error instead of via cascading
      # test failures.
      - name: Validate qa_knowledge YAML
        run: python -c "from engine.qa_knowledge_loader import LOADER; assert LOADER.areas(), 'no areas loaded'"

      # The glossary and wording rules are not schema-validated by LOADER
      # (they are prompt material, read as raw text). A malformed file
      # would degrade to an empty index and silently disable the
      # terminology linter, so assert the parsed shape here instead.
      - name: Validate terminology assets
        run: >-
          python -c "from engine import glossary as g;
          assert len(g.terms()) >= 85, f'glossary shrank to {len(g.terms())} terms';
          assert g.canonical_term('dropdown') == 'Drop-down', 'alias index broken';
          assert 'correctly' in g.banned_phrases('grading'), 'wording rules did not parse'"

      # No playwright browser install in *this* job — the browser tests
      # live in the `e2e` job below, which installs Chromium once and runs
      # them ten times. Everything here talks to Flask's test client, so a
      # 400 MB download per interpreter would buy nothing.
      #
      # Guard against the Postgres leg silently skipping: a skipped test
      # nobody looks at is the same as no coverage, and this whole service
      # container exists to stop the migration being verified on the wrong
      # engine.
      - name: Verify the Postgres leg actually runs
        run: >-
          python -m pytest tests/test_schema_migration.py -q
          -k postgres --no-header -p no:cacheprovider
          | tee /tmp/pg.txt;
          grep -qE "[1-9][0-9]* passed" /tmp/pg.txt

      # Failing test names are echoed as ``::error::`` workflow commands so
      # they land in the run's *annotations*. Without that the only thing a
      # failure publishes is "Process completed with exit code 1", and the
      # names live solely in the job log — which is fine when you can open
      # the log and useless when you cannot: on a public repository the
      # logs endpoint refuses an unauthenticated caller, so a red build is
      # unreadable to anyone without a token. This was measured the hard
      # way while diagnosing this very run.
      # Guard against the S3 leg silently skipping, for the same reason the
      # Postgres step above exists: tests/test_storage_failures.py is the
      # only place the S3 adapter touches a socket, and it importorskips on
      # moto. A skipped file nobody looks at is the same as no coverage.
      - name: Verify the S3 leg actually runs
        run: >-
          python -m pytest tests/test_storage_failures.py -q
          --no-header -p no:cacheprovider | tee /tmp/s3.txt;
          grep -qE "[1-9][0-9]* passed" /tmp/s3.txt

      - name: Run test suite
        run: |
          set -o pipefail
          python run_tests.py 2>&1 | tee /tmp/suite.txt || {
            sed -n '/short test summary info/,$p' /tmp/suite.txt \
              | grep -E "^(FAILED|ERROR)" | head -40 \
              | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      # Coverage gate (E9.6), on the modules the programme set a bar for
      # rather than on the repository. A whole-repo number is dominated by
      # code nobody is changing, so it drifts up while the new work drifts
      # down and the gate never fires.
      #
      # Branch coverage, not line: the defects this programme found were in
      # branches — a deactivated user still holding a role, an item keyed on
      # the wrong tuple, an org that nothing ever wrote. Line coverage was
      # already high while each of those was live.
      #
      # The threshold is the measured floor minus nothing. Set below what is
      # already true, a gate only fires after a regression has been sitting
      # there for a while; set at the measured value, the first slip fails
      # the build. Raise it when the number rises.
      - name: Coverage gate on the programme's modules
        if: matrix.python-version == '3.12'
        run: >-
          python -m pytest tests/ -q --tb=short -p no:cacheprovider
          --cov=engine.permissions --cov=engine.auth --cov=engine.route_policy
          --cov=engine.session_timeout
          --cov=engine.mailer
          --cov=engine.basic_auth
          --cov=engine.blobs
          --cov=engine.storage
          --cov=engine.retention
          --cov=engine.backup
          --cov=engine.project_facts
          --cov=engine.capacity
          --cov=engine.editable --cov=engine.run_limits --cov=engine.mentoring
          --cov=engine.manual_run --cov=engine.dashboard_config
          --cov=engine.dashboard_metrics --cov=engine.tedgie_eval
          --cov=engine.regeneration --cov=engine.import_preview
          --cov=engine.estimation_edit --cov=engine.bug_workflow
          --cov=engine.checklist_order --cov=engine.public_ids
          --cov=engine.tc_steps --cov=engine.features --cov=engine.security
          --cov-branch --cov-report=term-missing:skip-covered
          --cov-fail-under=93

      # The authenticated leg (E9.9). The product ships with AUTH_ENABLED
      # and ORG_MODE on, and until this existed the suite could only be run
      # with them off — 405 failures and 61 errors in the on state, almost
      # all of them "no fixture signs in, so every request redirects to the
      # sign-in page". Regressions in E1 and E2 were therefore invisible in
      # the mode they would actually ship in.
      #
      # It found a real defect on the first green run: nothing wrote
      # Project.org_id while the listing filtered by it, so a project
      # vanished from the picker the moment it was created.
      #
      # Only on one interpreter, and last: it doubles the suite's wall clock
      # and the flags-off leg above already covers the matrix. The point of
      # this leg is the mode, not the Python version.
      - name: Run test suite with authentication on
        if: matrix.python-version == '3.12'
        env:
          AUTH_ENABLED: "1"
          ORG_MODE: "1"
        run: |
          set -o pipefail
          python -m pytest tests/ -q --tb=short -p no:cacheprovider \
            2>&1 | tee /tmp/authon.txt || {
            sed -n '/short test summary info/,$p' /tmp/authon.txt \
              | grep -E "^(FAILED|ERROR)" | head -40 \
              | while IFS= read -r line; do echo "::error::auth-on $line"; done
            exit 1
          }

  # ── E9.5 — the golden paths, in a real browser, ten times ─────────
  #
  # A separate job because it needs a Chromium build (~400 MB) that the
  # matrix above has no use for, and because its failure mode is different:
  # a browser test that fails once in ten is a defect in the test or in the
  # code, and the programme's zero-flaky policy says so — no quarantine
  # list, no reruns, no `--retries`.
  #
  # Ten consecutive runs is the anti-flaky gate from
  # docs/plans/e9_test_strategy.md. It is cheap here (the file is ~35 s)
  # and it is the only thing that distinguishes "green" from "green on a
  # quiet machine". The loop stops at the first failure so the log ends at
  # the interesting run rather than nine runs later.
  e2e:
    name: e2e golden paths (×10)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Deliberately no PYTEST_ADDOPTS here: the ten-run gate is about
    # determinism, and a browser suite sharing workers measures contention
    # instead. This file is ~35 s; there is nothing to save.
    env:
      FLASK_DEBUG: "1"
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      # Skipping is how this file behaves when the browser is missing, and
      # a silently skipped browser suite is the same as not having one.
      - name: Verify the browser leg actually runs
        run: >-
          python -m pytest tests/test_e2e_golden_paths.py -q --no-header
          -p no:cacheprovider | tee /tmp/e2e.txt;
          grep -qE "[1-9][0-9]* passed" /tmp/e2e.txt

      - name: Ten consecutive runs
        run: |
          for i in $(seq 1 10); do
            echo "── run $i of 10 ─────────────────────────────"
            python -m pytest tests/test_e2e_golden_paths.py -q --no-header \
              -p no:cacheprovider || exit 1
          done
