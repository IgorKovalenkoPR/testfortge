name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel in-flight runs on force-push / rapid iteration so we don't queue
# up redundant CI minutes.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    # A real PostgreSQL for the schema-migration tests. Production runs
    # Postgres and the ALTERs are hand-written SQL, so verifying them only
    # on SQLite verifies them on the wrong engine. Free in Actions, and it
    # means every push checks the upgrade path a deploy will actually take.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tfg
          POSTGRES_PASSWORD: tfg
          POSTGRES_DB: tfg_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      # Don't short-circuit — we want to see failures on ALL versions,
      # not just the first one to break.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    env:
      # config.py mints an ephemeral SECRET_KEY when FLASK_DEBUG=1, so CI
      # doesn't need a real one. The test fixtures flip TESTING=True which
      # also disables CSRF — full prod-parity is covered by the container
      # build, not this matrix.
      FLASK_DEBUG: "1"
      # Force UTF-8 stdio so emojis in log messages don't blow up pytest
      # output capture on minimal-locale runners.
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
      # Points tests/test_schema_migration.py at the service container
      # above. Its contents are destroyed by those tests, which is why it
      # is a dedicated throwaway database and not the app's own.
      TFG_TEST_POSTGRES_URL: "postgresql+psycopg2://tfg:tfg@localhost:5432/tfg_migration_test"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # MCP server tests import `mcp_server.server` which pulls in
          # the `mcp` package + (for the HTTP entrypoint) `uvicorn`.
          # These are listed separately because they're not needed by
          # the Flask web image — but CI must install them so pytest
          # can collect tests/test_mcp_*.
          pip install -r mcp_server/requirements.txt
          pip install pytest

      - name: Show environment
        run: |
          python --version
          pip list

      # Validate YAML-backed QA knowledge before tests so malformed
      # content fails fast with a clean error instead of via cascading
      # test failures.
      - name: Validate qa_knowledge YAML
        run: python -c "from engine.qa_knowledge_loader import LOADER; assert LOADER.areas(), 'no areas loaded'"

      # The glossary and wording rules are not schema-validated by LOADER
      # (they are prompt material, read as raw text). A malformed file
      # would degrade to an empty index and silently disable the
      # terminology linter, so assert the parsed shape here instead.
      - name: Validate terminology assets
        run: >-
          python -c "from engine import glossary as g;
          assert len(g.terms()) >= 85, f'glossary shrank to {len(g.terms())} terms';
          assert g.canonical_term('dropdown') == 'Drop-down', 'alias index broken';
          assert 'correctly' in g.banned_phrases('grading'), 'wording rules did not parse'"

      # No playwright browser install — tests don't launch a real browser.
      # The async endpoint tests submit jobs to the in-process queue and
      # mock / bypass the runner. If that changes, add:
      #   python -m playwright install --with-deps chromium
      # Guard against the Postgres leg silently skipping: a skipped test
      # nobody looks at is the same as no coverage, and this whole service
      # container exists to stop the migration being verified on the wrong
      # engine.
      - name: Verify the Postgres leg actually runs
        run: >-
          python -m pytest tests/test_schema_migration.py -q
          -k postgres --no-header -p no:cacheprovider
          | tee /tmp/pg.txt;
          grep -qE "[1-9][0-9]* passed" /tmp/pg.txt

      - name: Run test suite
        run: python run_tests.py

      # The authenticated leg (E9.9). The product ships with AUTH_ENABLED
      # and ORG_MODE on, and until this existed the suite could only be run
      # with them off — 405 failures and 61 errors in the on state, almost
      # all of them "no fixture signs in, so every request redirects to the
      # sign-in page". Regressions in E1 and E2 were therefore invisible in
      # the mode they would actually ship in.
      #
      # It found a real defect on the first green run: nothing wrote
      # Project.org_id while the listing filtered by it, so a project
      # vanished from the picker the moment it was created.
      #
      # Only on one interpreter, and last: it doubles the suite's wall clock
      # and the flags-off leg above already covers the matrix. The point of
      # this leg is the mode, not the Python version.
      - name: Run test suite with authentication on
        if: matrix.python-version == '3.12'
        env:
          AUTH_ENABLED: "1"
          ORG_MODE: "1"
        run: python -m pytest tests/ -q --tb=short -p no:cacheprovider
