# Render Blueprint for TestFortge.
#
# When you connect this GitHub repo to a Render workspace via "New +" →
# "Blueprint" → pick this repo, Render reads this file and pre-fills the
# service config. You only need to fill in two secret env vars (the Basic
# Auth user/password) in the Render dashboard before the first deploy.
#
# Free tier specifics:
#   * 512 MB RAM / 0.1 CPU per service.
#   * Service sleeps after ~15 min of inactivity; first request after sleep
#     wakes it in ~30 s. Acceptable for ad-hoc QA review, NOT for client
#     demos — bump to the Starter plan ($7/mo) for always-on.
#   * Free tier ships with no persistent disk: snapshots, sessions and
#     uploaded files are wiped on every redeploy. The framework already
#     rotates sessions on every server start (SERVER_START_TIME marker),
#     so this is consistent with documented behaviour.
#
databases:
  # Free-tier Postgres (256 MB, 1 GB storage). The web service references
  # this by name to wire DATABASE_URL automatically.
  - name: testfortge-db
    plan: free
    region: frankfurt
    databaseName: testfortge
    user: testfortge

services:
  - type: web
    name: testfortge
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    # The Dockerfile CMD binds to a hardcoded :5000; Render injects $PORT
    # at runtime, so we override the CMD here to honour it.
    # Free-tier specifics (0.1 CPU, 512 MB RAM):
    #  * Crawling a real URL + Playwright across 5 pages can take
    #    90-180 s. Bumped --timeout to 300 so gunicorn stops killing
    #    mid-crawl with 502.
    #  * Reduced --workers from 2 to 1 — Playwright Chromium needs
    #    ~250 MB and 2 simultaneous workers OOM the 512 MB instance.
    #  * --threads 4 still serves smaller GETs (Tedgie chat, exports,
    #    health probes) concurrently while a long POST is in flight.
    #  * 2026-05-04 — /test-execution now dispatches the Playwright
    #    pass to a fully detached subprocess (engine/runner_worker.py
    #    via subprocess.Popen with start_new_session=True). The HTTP
    #    request returns in <1 s with a redirect to the live view; the
    #    worker keeps running independently of any gunicorn restart.
    #    --timeout still matters for the synchronous deterministic-
    #    simulator path (no Base URL) and for the /test-execution/
    #    results/<id> endpoint that re-runs the per-env loop after the
    #    worker writes result.json. 7200 (2 h) is generous backstop.
    # --worker-class gthread is required for SSE long-lived responses
    # (GET /chat/stream); do not switch to sync or the streaming reply
    # blocks the worker for the full Anthropic round-trip.
    dockerCommand: >-
      gunicorn
      --bind 0.0.0.0:$PORT
      --workers 1 --threads 4 --worker-class gthread
      --timeout 7200 --graceful-timeout 30
      --access-logfile - --error-logfile -
      app:app
    # /healthz is a DB-FREE liveness probe on purpose: it returns 200 as
    # long as the process is up and its dirs are writable. A DB outage
    # (e.g. the free-tier Postgres expiring ~every 30 days) must NOT flip
    # this to 503 — otherwise Render stops routing ALL traffic and the
    # site hangs on the "Application loading" interstitial. DB-aware
    # monitoring lives at /readyz (see routes/ops.py). Do NOT point
    # healthCheckPath at /readyz.
    healthCheckPath: /healthz
    envVars:
      # Postgres connection string injected by Render from the
      # ``testfortge-db`` database service declared above. SQLAlchemy
      # rewrites ``postgres://`` → ``postgresql+psycopg2://`` at runtime.
      - key: DATABASE_URL
        fromDatabase:
          name: testfortge-db
          property: connectionString
      # Auto-generated once, persisted by Render — keeps sessions valid
      # across redeploys.
      - key: SECRET_KEY
        generateValue: true
      # Render serves over HTTPS; flips Secure cookies + strict CSRF SSL.
      - key: BEHIND_HTTPS
        value: "1"
      # Run-mode flags
      - key: FLASK_DEBUG
        value: "0"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      # Keep Playwright OUT of the web worker on the free plan.
      #
      # Chromium needs ~250 MB on top of Flask + the LLM client + the
      # crawl, and the instance has 512 MB with a single gunicorn worker.
      # The worker was being OOM-killed ~110 s into a /test-cases
      # generation; because JobQueue lives in that process's memory the
      # job died with it, /test-cases/status/<id> answered 404, and the
      # user got "The generation job was lost" after a two-minute wait
      # with nothing saved.
      #
      # The requests-based crawl still runs, so the Test Case Author
      # agent keeps its control inventory. What is lost here is only the
      # browser-derived findings (performance, console errors, responsive
      # layout) — and /test-execution still does a real browser pass in a
      # detached subprocess that survives a gunicorn restart.
      #
      # Flip to 1 after moving to a paid plan with more RAM.
      - key: TESTFORTGE_BROWSER_ENABLED
        value: "0"
      # Web Recorder (Sprint 8 PR-B/E). Declared here because it was
      # already set to 1 by hand on the live service while being absent
      # from this blueprint — so a Manual Sync would have deleted it, and
      # the code default is "0", silently switching the recorder off in
      # production with no other symptom. Gates
      # /api/recorder-session/{start,finish}, the /test-cases recorder UI
      # and `tfg record` (app.py, routes/generation.py).
      - key: RECORDER_ENABLED
        value: "1"
      # Automation result ingestion — the shared secret CI sends as
      # `Authorization: Bearer <token>` to POST /automation/allure-results.
      #
      # `generateValue: true`, not `sync: false`: Render mints a random
      # value on the next sync and stores it, the same way MCP_BEARER_TOKEN
      # and SECRET_KEY are handled below and above. Nobody has to invent a
      # token, nobody types one into a field, and it never exists in this
      # repo. Read it once from the dashboard into the CI secret.
      #
      # It was `sync: false` while the endpoint had no consumer, and the
      # module reported itself disabled on prod because an unset value is
      # the safe default — the endpoint writes run history, so an
      # unauthenticated one is an open write. Generating it turns step 3
      # of the Automation module on; the endpoint still refuses every
      # request that does not present this exact value.
      - key: AUTOMATION_INGEST_TOKEN
        generateValue: true
      # Basic Auth gate — fill these in the Render dashboard before deploy.
      # `sync: false` means Render will NOT pull them from a generated
      # value or the file; they stay in the dashboard as secrets.
      - key: TESTFORTGE_BASIC_USER
        sync: false
      - key: TESTFORTGE_BASIC_PASSWORD
        sync: false
      # Anthropic API key — REQUIRED for Tedgie chat AND for the
      # /estimation Mockups vision pipeline (engine/mockup_vision.py).
      # Without it the mockup tab returns "Vision analysis returned no
      # output" and Tedgie falls back to the rule-based dispatcher.
      # Get one at https://console.anthropic.com/settings/keys.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional — Figma Personal Access Token. When set, the mockup
      # vision pipeline pulls per-frame PNG renders from the Figma
      # REST API (up to 5 frames per file). Without it, only the file
      # cover image (Open Graph) is fetched, which is enough for
      # high-level scope but loses screen-by-screen detail. Get one at
      # https://www.figma.com/settings (→ Personal access tokens).
      # Required scopes: `file_content:read`.
      - key: FIGMA_PAT
        sync: false
      # Optional — override the Anthropic model used everywhere
      # (Tedgie chat + mockup vision). Defaults to claude-sonnet-4-5
      # which supports vision; if you change to a text-only model the
      # Mockups tab will fail.
      - key: ANTHROPIC_MODEL
        sync: false
      # Sprint 5 PR-3: flip the QA Walkthrough mode ON for the live
      # deploy. Reading is centralised in
      # ``engine/walkthrough_runner.py::feature_enabled``; an
      # unset/empty value would make the runner refuse the mode and
      # the UI radio would still post but the worker would error.
      # Setting "1" here exposes the new heuristic battery + findings
      # subtab to operators on prod. Removing the variable reverts the
      # build to TC-driven-only without any code change.
      - key: WALKTHROUGH_MODE_ENABLED
        value: "1"

  # ── MCP HTTP service ──────────────────────────────────────────────
  # Same container image as the Flask app (the Dockerfile installs both
  # the web reqs and mcp_server/requirements.txt), different start
  # command: boot the Streamable-HTTP MCP server under uvicorn instead
  # of the Flask app under gunicorn. Reachable at
  # ``testfortge-mcp.onrender.com/mcp`` once deployed; MCP clients pass
  # ``Authorization: Bearer <MCP_BEARER_TOKEN>``.
  - type: web
    name: testfortge-mcp
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    # uvicorn binds to $PORT (Render injects it). The HTTP entrypoint
    # refuses to boot without MCP_BEARER_TOKEN set, so no
    # accidentally-public deploys.
    dockerCommand: python -m mcp_server.http_server
    # /healthz is the one path mcp_server.http_server lets through
    # without a Bearer token — exactly because Render's platform
    # healthcheck doesn't send Authorization headers. Pointing this
    # at /mcp would 401 every probe and leave the service in a
    # permanent "Failed" state. See mcp_server/http_server.py _PUBLIC_PATHS.
    healthCheckPath: /healthz
    envVars:
      # Share the same Postgres as the main service so MCP reads/writes
      # land in the operator-visible DB.
      - key: DATABASE_URL
        fromDatabase:
          name: testfortge-db
          property: connectionString
      # The shared secret MCP clients use in the Authorization header.
      # Render auto-generates a 32-char random value the first time you
      # apply this blueprint — copy it from the dashboard into your
      # client config (Claude Desktop / Claude Code mcpServers entry).
      - key: MCP_BEARER_TOKEN
        generateValue: true
      # Boot uvicorn on the port Render injects. The http_server module
      # reads PORT first, then MCP_HTTP_PORT, then defaults to 8765.
      - key: LOG_LEVEL
        value: INFO
      # The MCP server connects to Postgres (DATABASE_URL above) so the
      # SQLite-prod safety check never trips. Leaving FLASK_DEBUG unset
      # keeps prod behaviour identical to the Flask service.
      - key: FLASK_DEBUG
        value: "0"
      # mcp_server/server.py gates its `record_steps_attach` tool on this
      # flag. It has never been set on this service, so the tool is off;
      # "0" states that explicitly instead of leaving it to the code
      # default. Set to 1 only alongside the web service's recorder,
      # since the two share the same DB rows.
      - key: RECORDER_ENABLED
        value: "0"
      # Walkthrough trigger needs the same gate as the web service so
      # ``trigger_test_execution(mode="walkthrough")`` reaches a runner
      # that knows how to handle it.
      - key: WALKTHROUGH_MODE_ENABLED
        value: "1"
      # FastMCP's DNS-rebinding protection defaults to a localhost-only
      # allowlist. Without this env var the prod Host header
      # (``testfortge-mcp.onrender.com``) is rejected with
      # ``Invalid Host header`` BEFORE the bearer-auth middleware sees
      # the request — MCP clients then get a cryptic 421 instead of
      # 200. Comma-separated list parsed in
      # mcp_server.server._build_transport_security.
      - key: MCP_ALLOWED_HOSTS
        value: "testfortge-mcp.onrender.com"
