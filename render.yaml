# Render Blueprint for TestFortge.
#
# When you connect this GitHub repo to a Render workspace via "New +" →
# "Blueprint" → pick this repo, Render reads this file and pre-fills the
# service config. You only need to fill in two secret env vars (the Basic
# Auth user/password) in the Render dashboard before the first deploy.
#
# Free tier specifics:
#   * 512 MB RAM / 0.1 CPU per service.
#   * Service sleeps after ~15 min of inactivity; first request after sleep
#     wakes it in ~30 s. Acceptable for ad-hoc QA review, NOT for client
#     demos — bump to the Starter plan ($7/mo) for always-on.
#   * Free tier ships with no persistent disk: snapshots, sessions and
#     uploaded files are wiped on every redeploy. The framework already
#     rotates sessions on every server start (SERVER_START_TIME marker),
#     so this is consistent with documented behaviour.
#
databases:
  # Free-tier Postgres (256 MB, 1 GB storage). The web service references
  # this by name to wire DATABASE_URL automatically.
  - name: testfortge-db
    plan: free
    region: frankfurt
    databaseName: testfortge
    user: testfortge

services:
  - type: web
    name: testfortge
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    # The Dockerfile CMD binds to a hardcoded :5000; Render injects $PORT
    # at runtime, so we override the CMD here to honour it.
    # Free-tier specifics (0.1 CPU, 512 MB RAM):
    #  * Crawling a real URL + Playwright across 5 pages can take
    #    90-180 s. Bumped --timeout to 300 so gunicorn stops killing
    #    mid-crawl with 502.
    #  * Reduced --workers from 2 to 1 — Playwright Chromium needs
    #    ~250 MB and 2 simultaneous workers OOM the 512 MB instance.
    #  * --threads 4 still serves smaller GETs (Tedgie chat, exports,
    #    health probes) concurrently while a long POST is in flight.
    #  * 2026-05-04 — /test-execution now dispatches the Playwright
    #    pass to a fully detached subprocess (engine/runner_worker.py
    #    via subprocess.Popen with start_new_session=True). The HTTP
    #    request returns in <1 s with a redirect to the live view; the
    #    worker keeps running independently of any gunicorn restart.
    #    --timeout still matters for the synchronous deterministic-
    #    simulator path (no Base URL) and for the /test-execution/
    #    results/<id> endpoint that re-runs the per-env loop after the
    #    worker writes result.json. 7200 (2 h) is generous backstop.
    # --worker-class gthread is required for SSE long-lived responses
    # (GET /chat/stream); do not switch to sync or the streaming reply
    # blocks the worker for the full Anthropic round-trip.
    dockerCommand: >-
      gunicorn
      --bind 0.0.0.0:$PORT
      --workers 1 --threads 4 --worker-class gthread
      --timeout 7200 --graceful-timeout 30
      --access-logfile - --error-logfile -
      app:app
    # /healthz is a DB-FREE liveness probe on purpose: it returns 200 as
    # long as the process is up and its dirs are writable. A DB outage
    # (e.g. the free-tier Postgres expiring ~every 30 days) must NOT flip
    # this to 503 — otherwise Render stops routing ALL traffic and the
    # site hangs on the "Application loading" interstitial. DB-aware
    # monitoring lives at /readyz (see routes/ops.py). Do NOT point
    # healthCheckPath at /readyz.
    healthCheckPath: /healthz
    envVars:
      # Postgres connection string injected by Render from the
      # ``testfortge-db`` database service declared above. SQLAlchemy
      # rewrites ``postgres://`` → ``postgresql+psycopg2://`` at runtime.
      - key: DATABASE_URL
        fromDatabase:
          name: testfortge-db
          property: connectionString
      # Auto-generated once, persisted by Render — keeps sessions valid
      # across redeploys.
      - key: SECRET_KEY
        generateValue: true
      # Render serves over HTTPS; flips Secure cookies + strict CSRF SSL.
      - key: BEHIND_HTTPS
        value: "1"
      # Run-mode flags
      - key: FLASK_DEBUG
        value: "0"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      # Keep Playwright OUT of the web worker on the free plan.
      #
      # Chromium needs ~250 MB on top of Flask + the LLM client + the
      # crawl, and the instance has 512 MB with a single gunicorn worker.
      # The worker was being OOM-killed ~110 s into a /test-cases
      # generation; because JobQueue lives in that process's memory the
      # job died with it, /test-cases/status/<id> answered 404, and the
      # user got "The generation job was lost" after a two-minute wait
      # with nothing saved.
      #
      # The requests-based crawl still runs, so the Test Case Author
      # agent keeps its control inventory. What is lost here is only the
      # browser-derived findings (performance, console errors, responsive
      # layout) — and /test-execution still does a real browser pass in a
      # detached subprocess that survives a gunicorn restart.
      #
      # Stays 0. The budget for this platform is zero (see
      # docs/plans/cost_model.md), so there is no paid plan coming and no
      # extra RAM to flip this into. The automation half of the Execute
      # module is served instead by running Playwright in GitHub Actions
      # and posting the Allure results to /automation/allure-results
      # below — free minutes, 16 GB runners, and the ingest endpoint
      # already exists.
      - key: TESTFORTGE_BROWSER_ENABLED
        value: "0"
      # The OOM guard's ceiling for a browser pass (E5.2). Declared
      # explicitly rather than left to the cgroup-derived default, because
      # on this plan the number is load-bearing and worth reading in one
      # place: 512 MB limit minus the 130 MB a single page step was
      # measured to add between two polls.
      #
      # The guard now counts Chromium. Until E5.2 measured it, it watched
      # the Python process alone — 36 MB while the tree reached 393 — so
      # it never fired and the kernel did the stopping.
      - key: MEMORY_BUDGET_MB
        value: "380"
      # ── Programme feature flags (docs/plans/team_platform_architecture.md)
      #
      # All five declared at "0" from the start rather than added one per
      # epic. The reason is the RECORDER_ENABLED incident this file's test
      # was written for: a flag that exists in code but not in the
      # blueprint gets deleted by the next Manual Sync, silently. Declaring
      # them up front means the epic that ships one only has to change a
      # value, and tests/test_render_blueprint.py fails the build if a new
      # flag reaches engine/features.py without landing here too.
      - key: AUTH_ENABLED
        value: "0"
      - key: ORG_MODE
        value: "0"
      # Makes Postgres the source of truth for a project's artefacts
      # instead of the caller's session (ADR 0001). Must be "1" before
      # EDITORS_ENABLED or DASHBOARD_V2 do anything — engine/features.py
      # enforces that dependency and warns at boot if it is violated.
      - key: WORKSPACE_DB_FIRST
        value: "0"
      - key: EDITORS_ENABLED
        value: "0"
      - key: DASHBOARD_V2
        value: "0"
      - key: STORAGE_BACKEND_CONFIGURABLE
        value: "0"
      # Where artefacts go (E8.2, ADR 0002). "local" is this dyno's disk,
      # which is ephemeral — a restart takes every screenshot with it. "s3"
      # is any S3-compatible bucket: Cloudflare R2 (the free-tier choice),
      # AWS S3, Backblaze B2, Wasabi, MinIO.
      #
      # Declared with its default rather than left out, for the reason
      # tests/test_render_blueprint.py gives about every other flag here: a
      # Manual Sync deletes undeclared vars, and an operator who had
      # switched this to "s3" in the dashboard would find uploads silently
      # back on an ephemeral disk with no error anywhere.
      #
      # Flipping it needs the four STORAGE_S3_* values below set first.
      # engine/storage.py falls back to local disk and logs an error if
      # they are incomplete — it does not refuse to boot, because a typo in
      # a storage setting should not be an outage.
      - key: STORAGE_BACKEND
        value: "local"
      # The bucket's credentials. Blank here on purpose: E0.5 (create the
      # bucket) is an owner action, and the secret is set in the dashboard,
      # never in this file. `sync: false` is what stops a Manual Sync
      # overwriting a value the dashboard holds and this file does not.
      - key: STORAGE_S3_ENDPOINT
        sync: false
      - key: STORAGE_S3_BUCKET
        sync: false
      - key: STORAGE_S3_ACCESS_KEY
        sync: false
      - key: STORAGE_S3_SECRET_KEY
        sync: false
      # R2 wants an empty region; AWS wants a real one. Left unset rather
      # than guessed.
      - key: STORAGE_S3_REGION
        sync: false
      # The shared HTTP Basic password in front of the whole app (E1.8).
      #
      # "1" while it is still the perimeter. Once AUTH_ENABLED is "1" and
      # real accounts have replaced it, set this to "0" — one edit, and the
      # rollback is the same edit back, which is why it is a flag rather
      # than "delete the two secrets below and retype them if it goes
      # wrong".
      #
      # Setting it to "0" while AUTH_ENABLED is "0" is refused: the gate
      # stays up and the boot log says so, because that pair asks for no
      # shared password and no accounts either. See engine/basic_auth.py.
      - key: BASIC_GATE_ENABLED
        value: "1"
      # Where Flask sessions live. "filesystem" is the legacy behaviour
      # and loses every session when the dyno restarts — which on the free
      # plan is several times a day, and today the session is where a
      # project's working pack lives. "db" moves them into Postgres
      # (engine/server_session.py). Declared explicitly so the rollout is
      # one dashboard edit and the rollback is the same edit back.
      - key: SESSION_BACKEND
        value: "filesystem"
      # Session timeouts (E1.5, engine/session_timeout.py). Two clocks,
      # because they answer different questions: idle bounds an unattended
      # browser, absolute bounds a stolen cookie — an attacker's own
      # requests keep the idle clock fresh forever, so one without the
      # other is a half-measure.
      #
      # Declared here at their code defaults rather than left unset, for
      # the reason the flags above are: an env var that exists only in code
      # is invisible to whoever operates the service, and these two decide
      # when people get signed out. Both are ignored while AUTH_ENABLED=0.
      #
      # Note what actually bites today: with SESSION_BACKEND=filesystem the
      # dyno's disk is wiped every time it sleeps (~15 idle minutes), which
      # is far tighter than four hours. The idle clock starts mattering
      # under SESSION_BACKEND=db, where rows survive restarts.
      - key: SESSION_IDLE_MINUTES
        value: "240"
      - key: SESSION_ABSOLUTE_HOURS
        value: "24"
      # ── LLM cost controls (docs/plans/cost_model.md) ──────────────
      #
      # Monthly ceiling, in USD, on what one organisation may spend on the
      # *platform's* API key. A BYOK org is exempt — that is their key and
      # their bill. Not optional on a zero-budget platform: without a cap,
      # one team's runaway tab spends the operator's money with no limit.
      # Over the cap, generation falls back to the deterministic engine
      # rather than erroring (engine/llm_client.LLMBudgetExceeded).
      - key: LLM_ORG_BUDGET_USD
        value: "5"
      # Fernet key encrypting each org's own Anthropic key at rest.
      # `generateValue: true` so Render mints it and it never exists in
      # this repo — same handling as SECRET_KEY and MCP_BEARER_TOKEN.
      #
      # Deliberately NOT derived from SECRET_KEY: that is the
      # cookie-signing key, and rotating it to invalidate sessions is a
      # normal thing to do. Sharing them would make every stored customer
      # API key undecryptable the day someone did.
      #
      # Without this, BYOK is simply off — storing a key is refused rather
      # than stored in the clear, and the platform key is used.
      - key: TESTFORTGE_ENCRYPTION_KEY
        generateValue: true
      # ── Google sign-in (E1.4) ─────────────────────────────────────
      #
      # `sync: false` — both live in the dashboard. The secret must not be
      # in this repository, and the client id is declared alongside it so a
      # Manual Sync cannot delete one and leave the other: half-configured
      # means the button renders and then fails at the callback, which is
      # worse than the button not being there.
      #
      # Register this redirect URI on the OAuth client:
      #   https://testfortge.onrender.com/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Web Recorder (Sprint 8 PR-B/E). Declared here because it was
      # already set to 1 by hand on the live service while being absent
      # from this blueprint — so a Manual Sync would have deleted it, and
      # the code default is "0", silently switching the recorder off in
      # production with no other symptom. Gates
      # /api/recorder-session/{start,finish}, the /test-cases recorder UI
      # and `tfg record` (app.py, routes/generation.py).
      - key: RECORDER_ENABLED
        value: "1"
      # Automation result ingestion — the shared secret CI sends as
      # `Authorization: Bearer <token>` to POST /automation/allure-results.
      #
      # `generateValue: true`, not `sync: false`: Render mints a random
      # value on the next sync and stores it, the same way MCP_BEARER_TOKEN
      # and SECRET_KEY are handled below and above. Nobody has to invent a
      # token, nobody types one into a field, and it never exists in this
      # repo. Read it once from the dashboard into the CI secret.
      #
      # It was `sync: false` while the endpoint had no consumer, and the
      # module reported itself disabled on prod because an unset value is
      # the safe default — the endpoint writes run history, so an
      # unauthenticated one is an open write. Generating it turns step 3
      # of the Automation module on; the endpoint still refuses every
      # request that does not present this exact value.
      - key: AUTOMATION_INGEST_TOKEN
        generateValue: true
      # Basic Auth gate — fill these in the Render dashboard before deploy.
      # `sync: false` means Render will NOT pull them from a generated
      # value or the file; they stay in the dashboard as secrets.
      - key: TESTFORTGE_BASIC_USER
        sync: false
      - key: TESTFORTGE_BASIC_PASSWORD
        sync: false
      # ── The first administrator (engine/bootstrap.py) ─────────────
      #
      # An account is created only by claiming an invitation, and an
      # invitation is issued only by an admin — so a fresh database has no
      # way to acquire its first one, and turning AUTH_ENABLED on for one
      # locks everybody out. These two variables are that missing first
      # step: with both set and **no users in the database**, boot creates
      # one verified admin and one organisation, then never acts again.
      #
      # Deliberately keyed on "no users" rather than "first boot ever": the
      # free Postgres is recreated roughly monthly, and an instance that
      # re-locks itself after every reset is not usable. The cost is in
      # docs/runbooks/first-admin.md.
      #
      # The password is a credential, so `sync: false` — it stays in the
      # dashboard. It is also validated against the product's own rule, so
      # a short one creates nothing rather than a weak admin.
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ORG_NAME
        value: "My team"
      # ── Email (E0.4, engine/mailer.py) ────────────────────────────
      #
      # Resend. `sync: false` so the key stays a dashboard secret and never
      # reaches this repo. Both of the next two are required together: a key
      # with no verified sender address produces a 403 on every send, which
      # reads as a broken integration rather than a missing setting.
      #
      # With either unset the app does not pretend. Invitations still work —
      # the admin gets the link to forward, exactly as before this epic —
      # and password reset says plainly that the link will not arrive.
      # Nothing here is required for the product to run.
      - key: RESEND_API_KEY
        sync: false
      # The From address. Must be on a domain verified with Resend; the free
      # tier allows one domain.
      - key: MAIL_FROM
        sync: false
      # Messages per rolling 24 hours. The free tier's real ceiling is 100 a
      # day (3,000 a month) — declared here at that number so the limit is
      # visible to whoever operates the service rather than discovered when
      # mail stops arriving. Past the cap, sends are refused with a reason
      # and the copy-the-link fallback takes over. 0 switches sending off
      # without removing the key.
      - key: MAIL_DAILY_LIMIT
        value: "100"
      # Anthropic API key — REQUIRED for Tedgie chat AND for the
      # /estimation Mockups vision pipeline (engine/mockup_vision.py).
      # Without it the mockup tab returns "Vision analysis returned no
      # output" and Tedgie falls back to the rule-based dispatcher.
      # Get one at https://console.anthropic.com/settings/keys.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional — Figma Personal Access Token. When set, the mockup
      # vision pipeline pulls per-frame PNG renders from the Figma
      # REST API (up to 5 frames per file). Without it, only the file
      # cover image (Open Graph) is fetched, which is enough for
      # high-level scope but loses screen-by-screen detail. Get one at
      # https://www.figma.com/settings (→ Personal access tokens).
      # Required scopes: `file_content:read`.
      - key: FIGMA_PAT
        sync: false
      # Optional — override the Anthropic model used everywhere
      # (Tedgie chat + mockup vision). Defaults to claude-sonnet-4-5
      # which supports vision; if you change to a text-only model the
      # Mockups tab will fail.
      - key: ANTHROPIC_MODEL
        sync: false
      # Sprint 5 PR-3: flip the QA Walkthrough mode ON for the live
      # deploy. Reading is centralised in
      # ``engine/walkthrough_runner.py::feature_enabled``; an
      # unset/empty value would make the runner refuse the mode and
      # the UI radio would still post but the worker would error.
      # Setting "1" here exposes the new heuristic battery + findings
      # subtab to operators on prod. Removing the variable reverts the
      # build to TC-driven-only without any code change.
      - key: WALKTHROUGH_MODE_ENABLED
        value: "1"

      # ── E0.6: declared because undeclared means "deleted on the next
      #    Manual Sync", and for a value that lives in the dashboard that
      #    is silent. Everything below gates behaviour or is a credential;
      #    pure tuning knobs stay out on purpose — see
      #    tests/test_render_blueprint.py for the rule and the reasons.

      # Gates POST /api/backup/run (E8.4). The endpoint refuses outright
      # when unset, so an absent value is safe — but a value set by hand
      # and not declared here would vanish on a sync and the weekly job
      # would start failing with 403 and no other symptom.
      - key: BACKUP_TOKEN
        sync: false
      # Guards /metrics. **Optional by design and dangerous when unset**:
      # engine/route_policy.py deliberately leaves `metrics` out of the
      # machine-caller exemption for exactly this reason, so an instance
      # with no token publishes operator telemetry to anyone who asks.
      - key: OPS_ENDPOINTS_TOKEN
        sync: false
      # Plain HTTP to the object store. The endpoint's own scheme wins over
      # this (engine/storage.py), and it is declared so the five
      # STORAGE_S3_* keys are a complete set rather than four of five.
      - key: STORAGE_S3_SECURE
        sync: false

      # The MCP-driven browser driver (PR-F). Off unless asked for.
      - key: BROWSER_CONTROL_ENABLED
        value: "0"
      # The LLM authors for test cases and checklists. Default ON in code,
      # so leaving these undeclared means a Manual Sync could not turn them
      # off — and nobody reading the blueprint would know they exist.
      - key: TC_AUTHOR_ENABLED
        value: "1"
      - key: CL_AUTHOR_ENABLED
        value: "1"
      # The daily metric-snapshot thread (default on in code).
      - key: TESTFORTGE_SNAPSHOT_WORKER
        value: "1"
      # Stage-3 escape hatch: routes execution back to the pre-live runner.
      # Declared at "0" so a hand-set "1" cannot survive quietly — the
      # legacy path is kept for rollback, not for running on.
      - key: LEGACY_EXECUTOR
        value: "0"

      # ── Two safety switches, declared so they are pinned OFF ────────
      # Both are escape hatches that disable a guard. Declaring them means
      # a Manual Sync **resets** them, which is the safe direction: the
      # failure mode of a forgotten "1" here is an open SSRF surface or a
      # production database on SQLite.
      - key: SSRF_ALLOWLIST_BYPASS
        value: "0"
      - key: TESTFORTGE_ALLOW_SQLITE_PROD
        value: "0"
      # Paths that bypass the HTTP Basic perimeter. Pinned to the probes:
      # this is an allowlist on the outer gate, and widening it by hand
      # without a record is how a gate stops being one.
      - key: TESTFORTGE_BASIC_PUBLIC_PATHS
        value: "/healthz,/readyz"
      # Per-organisation row quota (E0.12). Empty means no quota.
      - key: ORG_QUOTA_ROWS
        sync: false

  # ── MCP HTTP service ──────────────────────────────────────────────
  # Same container image as the Flask app (the Dockerfile installs both
  # the web reqs and mcp_server/requirements.txt), different start
  # command: boot the Streamable-HTTP MCP server under uvicorn instead
  # of the Flask app under gunicorn. Reachable at
  # ``testfortge-mcp.onrender.com/mcp`` once deployed; MCP clients pass
  # ``Authorization: Bearer <MCP_BEARER_TOKEN>``.
  - type: web
    name: testfortge-mcp
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    # uvicorn binds to $PORT (Render injects it). The HTTP entrypoint
    # refuses to boot without MCP_BEARER_TOKEN set, so no
    # accidentally-public deploys.
    dockerCommand: python -m mcp_server.http_server
    # /healthz is the one path mcp_server.http_server lets through
    # without a Bearer token — exactly because Render's platform
    # healthcheck doesn't send Authorization headers. Pointing this
    # at /mcp would 401 every probe and leave the service in a
    # permanent "Failed" state. See mcp_server/http_server.py _PUBLIC_PATHS.
    healthCheckPath: /healthz
    envVars:
      # Share the same Postgres as the main service so MCP reads/writes
      # land in the operator-visible DB.
      - key: DATABASE_URL
        fromDatabase:
          name: testfortge-db
          property: connectionString
      # The shared secret MCP clients use in the Authorization header.
      # Render auto-generates a 32-char random value the first time you
      # apply this blueprint — copy it from the dashboard into your
      # client config (Claude Desktop / Claude Code mcpServers entry).
      - key: MCP_BEARER_TOKEN
        generateValue: true
      # Boot uvicorn on the port Render injects. The http_server module
      # reads PORT first, then MCP_HTTP_PORT, then defaults to 8765.
      - key: LOG_LEVEL
        value: INFO
      # The MCP server connects to Postgres (DATABASE_URL above) so the
      # SQLite-prod safety check never trips. Leaving FLASK_DEBUG unset
      # keeps prod behaviour identical to the Flask service.
      - key: FLASK_DEBUG
        value: "0"
      # mcp_server/server.py gates its `record_steps_attach` tool on this
      # flag. It has never been set on this service, so the tool is off;
      # "0" states that explicitly instead of leaving it to the code
      # default. Set to 1 only alongside the web service's recorder,
      # since the two share the same DB rows.
      - key: RECORDER_ENABLED
        value: "0"
      # Walkthrough trigger needs the same gate as the web service so
      # ``trigger_test_execution(mode="walkthrough")`` reaches a runner
      # that knows how to handle it.
      - key: WALKTHROUGH_MODE_ENABLED
        value: "1"
      # FastMCP's DNS-rebinding protection defaults to a localhost-only
      # allowlist. Without this env var the prod Host header
      # (``testfortge-mcp.onrender.com``) is rejected with
      # ``Invalid Host header`` BEFORE the bearer-auth middleware sees
      # the request — MCP clients then get a cryptic 421 instead of
      # 200. Comma-separated list parsed in
      # mcp_server.server._build_transport_security.
      - key: MCP_ALLOWED_HOSTS
        value: "testfortge-mcp.onrender.com"
  # ── Staging (E10 entry criterion) ──────────────────────────────────
  #
  # The place to see a release before prod does. It exists because three
  # zones were never verified anywhere: load, accessibility, and real mail
  # delivery — each needs a running instance that is not the one people
  # use.
  #
  # **It runs the mode the product ships in, which prod currently does
  # not.** AUTH_ENABLED / ORG_MODE are 1 here and 0 there, the Basic gate
  # is off, and the editors and dashboard-v2 flags are on. So this is also
  # where those flags get their first real traffic.
  #
  # ── Two constraints that shaped it, both measured ──
  #
  # 1. **One free Postgres per account**, and prod holds it. So staging
  #    runs on SQLite with the guard's own escape hatch, which means the
  #    database is on the container's ephemeral disk and **resets on every
  #    deploy**. That is a deliberate trade, not an oversight:
  #      * what it buys — every deploy is a clean first-run, which is
  #        exactly the path that had no first caller until
  #        engine/bootstrap.py existed. Staging re-proves it on each push;
  #      * what it costs — no migration testing, no "yesterday's data",
  #        and concurrent-write behaviour under load is SQLite's, not
  #        Postgres's. docs/runbooks/staging.md says so, and names the two
  #        ways out ($6 Render Basic-256mb, or a second free database from
  #        another provider).
  #
  # 2. **Free instance-hours are per account, not per service** (750/mo).
  #    Prod's keep-alive window already spends ~264 of them, so staging
  #    deliberately has **no keep-alive**: it sleeps, and a cold start on
  #    a staging box costs nobody anything. Do not add KEEPALIVE_URL here.
  - type: web
    name: testfortge-staging
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    # Same command as prod, with one difference: --timeout 1800 instead of
    # 7200. A staging run that hangs should end in half an hour rather
    # than hold a worker for two — nobody is waiting on its output.
    dockerCommand: >-
      gunicorn
      --bind 0.0.0.0:$PORT
      --workers 1 --threads 4 --worker-class gthread
      --timeout 1800 --graceful-timeout 30
      --access-logfile - --error-logfile -
      app:app
    healthCheckPath: /healthz
    envVars:
      # ── The database: SQLite, on purpose, and loudly ──
      #
      # No DATABASE_URL: the app falls back to STORAGE_FOLDER/testfortge.db.
      # The production guard in engine/db.py refuses SQLite outside debug
      # mode, and this is the escape hatch it documents — set here rather
      # than by turning FLASK_DEBUG on, because a debug Flask on a public
      # URL is a different and much worse decision.
      - key: TESTFORTGE_ALLOW_SQLITE_PROD
        value: "1"
      - key: FLASK_DEBUG
        value: "0"
      # ── The mode the product ships in ──
      - key: AUTH_ENABLED
        value: "1"
      - key: ORG_MODE
        value: "1"
      # No shared password in front of the product's own login. The
      # interlock in engine/basic_auth.py permits this only because
      # AUTH_ENABLED is 1 above — with both off it would keep the gate up
      # rather than expose the instance.
      - key: BASIC_GATE_ENABLED
        value: "0"
      # Staging is where flags prod has not enabled get their first real
      # traffic.
      - key: EDITORS_ENABLED
        value: "1"
      - key: DASHBOARD_V2
        value: "1"
      - key: WORKSPACE_DB_FIRST
        value: "1"
      - key: RECORDER_ENABLED
        value: "1"
      - key: WALKTHROUGH_MODE_ENABLED
        value: "1"
      # In-app Chromium stays off here for the same measured reason as
      # prod: ~390 MB over Flask against a 512 MB ceiling (E5.2).
      - key: TESTFORTGE_BROWSER_ENABLED
        value: "0"
      # ── The first administrator ──
      #
      # Required here, not optional: the database resets on every deploy,
      # so without these two nobody can sign in to the instance whose
      # whole purpose is being signed into. engine/bootstrap.py acts only
      # while the database has no users, which after a reset is always
      # true and after the first request never is.
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ORG_NAME
        value: "Staging team"
      # ── Storage ──
      #
      # Local disk, and never prod's bucket: E8.5 deletes a project's
      # blobs by prefix, and a staging deletion test pointed at the
      # production bucket would delete production evidence. When staging
      # gets object storage it gets its **own** bucket.
      - key: STORAGE_BACKEND
        value: "local"
      - key: STORAGE_BACKEND_CONFIGURABLE
        value: "0"
      # ── Secrets and the rest ──
      - key: SECRET_KEY
        generateValue: true
      - key: TESTFORTGE_ENCRYPTION_KEY
        generateValue: true
      # Its own token, so a staging upload can never land in prod's run
      # history.
      - key: AUTOMATION_INGEST_TOKEN
        generateValue: true
      # BYOK only. A platform key here would spend real money on test
      # generations nobody reads.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Mail: staging is where "does the invitation actually arrive" gets
      # answered, so the provider is set the same way as prod — from the
      # dashboard, never from this file.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: TESTFORTGE_SNAPSHOT_WORKER
        value: "0"
