# Not translations — the way the questions are actually asked. UA answers
# are graded on the same requirements, so a UA answer that skips the
# reasoning fails even if it is fluent.
- id: SEV-U1
  pack: severity_priority
  lang: uk
  q: "Опечатка в футері. Яка серйозність?"
  route: pack:severity_priority
  require:
    - [minor, тривіальн, незначн, косметичн, низьк]
  avoid: [критичн, блокер]

- id: SEV-U2
  pack: severity_priority
  lang: uk
  q: "Чи може бути низька серйозність і високий пріоритет?"
  route: pack:severity_priority
  require:
    - ["так", може, буває, звичайн]
    - [логотип, назв, бренд, головн, опечатк]

- id: SEV-U3
  pack: severity_priority
  lang: uk
  q: "Хто визначає пріоритет — я чи менеджер?"
  route: pack:severity_priority
  require:
    - [бізнес, власник, менеджер, замовник]
    - [серйозн, технічн, вплив]

- id: SEV-U4
  pack: severity_priority
  lang: uk
  q: "Пароль видно відкритим текстом у полі. Яка серйозність?"
  route: pack:severity_priority
  require:
    - [критичн, висок]
    - [безпек, вразлив]
  avoid: [незначн, косметичн]

- id: LYR-U1
  pack: layer
