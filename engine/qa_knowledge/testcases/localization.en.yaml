version: 1
area: localization
locale: en
default_section: Localization
cases:
  - summary: "Verify that the language switcher changes UI strings without breaking the layout"
    preconditions: "Site is reachable at {url}."
    steps:
      - "Open the Homepage in the default language"
      - "Use the language switcher in the Header or Footer to toggle to each available language"
      - "Pay attention to the visible UI strings after each switch"
      - "Pay attention to text overflow, clipped buttons and alignment after each switch"
    test_data: "All language toggles exposed in nav/footer"
    expected_result: "Switching language replaces the visible UI strings end-to-end. The layout adapts to longer translations without overflow or clipping. The selected language persists on subsequent navigation."
    category: Positive
    priority: High
    section: Localization
    testing_type: Localization
  - summary: "Verify that html[lang] reflects the active locale and matches the rendered text"
    preconditions: "Site supports more than one language."
    steps:
      - "Switch to each available language"
      - "Open DevTools and inspect the <html lang=\"…\"> attribute"
      - "Pay attention to the html[lang] value for each locale (e.g. uk, en, ru, pl)"
    test_data: "Locale toggles + DevTools"
    expected_result: "The lang attribute on <html> changes to the active locale on every switch. Screen readers and browsers receive the language hint matching that locale."
    category: Positive
    priority: Medium
    section: Localization
    testing_type: Localization
