version: 1
area: search
locale: en
default_section: Search
# Placeholders {url} and {host} are filled by engine.qa_persona._contextualise
# on the way out of generate_professional_test_cases. Use them wherever a
# tester would otherwise have to guess which site the case is about.
#
# Expected results use "should" / "should be" per the operator ruling of
# 2026-08-01: it is the one modal permitted, and only here. "must" and
# "shall" stay banned — see qa_knowledge/style/wording_rules.yaml.
cases:
  - summary: "Verify that the search returns items whose title or body contains the query string, ordered by relevance"
    preconditions: "{url} is open in the browser and the site holds content the query below will match."
    steps:
      - "Open {url} and go to the page carrying the search field"
      - "Enter a valid search term that matches existing data"
      - "Submit the search (press Enter or click Search button)"
      - "Review the results"
    test_data: "Search term matching existing data (e.g. 'software testing')"
    expected_result: "Search results should be displayed, every result should contain the query in its title or body, and the result count should match the number of rows rendered."
    category: Positive
    priority: High
    section: Search
  - summary: "Verify that 'No results' message is displayed for a non-matching query"
    preconditions: "A page of {host} exposing the search field is open in the browser."
    steps:
      - "Enter a search term that does not match any existing data"
      - "Submit the search"
    test_data: "Search term: 'xyznonexistent123456'"
    expected_result: "A 'No results found' message should be displayed. No error should appear and the search field should remain usable."
    category: Negative
    priority: High
    section: Search
  - summary: "Verify that XSS and SQL injection are blocked in the search field"
    preconditions: "A page of {host} exposing the search field is open in the browser."
    steps:
      - "Enter an XSS payload in the search field and submit"
      - "Enter an SQL injection payload in the search field and submit"
      - "Observe the page behavior after each submission"
    test_data: "XSS: <script>alert('xss')</script>, SQL: ' OR 1=1 --"
    expected_result: "Both payloads should be sanitized. No script should execute and no database error should be displayed. The search should return an empty result set or an error message."
    category: Security
    priority: High
    section: Search
