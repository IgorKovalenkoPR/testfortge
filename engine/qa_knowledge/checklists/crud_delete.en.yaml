version: 1
area: crud_delete
locale: en
sections:
  - name: "Delete — Positive"
    prefix: DEL
    items:
      - objective: "Verify that confirmation dialog is displayed before deletion"
        category: Positive
        priority: High
      - objective: "Verify that the record is deleted successfully after confirmation"
        category: Positive
        priority: High
      - objective: "Verify that the record is removed from the list view after deletion"
        category: Positive
        priority: High
      - objective: "Verify that success message is displayed after deletion"
        category: Positive
        priority: High
  - name: "Delete — Negative"
    prefix: DEL
    items:
      - objective: "Verify that deletion is cancelled when 'Cancel' is clicked in confirmation"
        category: Negative
        priority: High
      - objective: "Verify that related records are cascaded or the deletion is blocked with a message naming the dependency"
        category: Negative
        priority: Medium
  - name: "Delete — Edge Cases"
    prefix: DEL
    items:
      - objective: "Verify that the empty state is displayed after the last record is deleted"
        category: "Edge Case"
        priority: Medium
      - objective: "Verify that every selected record is removed by bulk deletion and the unselected records are kept (if supported)"
        category: "Edge Case"
        priority: Low
