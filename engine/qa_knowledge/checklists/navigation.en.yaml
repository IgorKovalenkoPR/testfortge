version: 1
area: navigation
locale: en
sections:
  - name: "Navigation"
    prefix: NAV
    items:
      - objective: "Verify that the main navigation menu is displayed on all pages"
        category: Positive
        priority: High
      - objective: "Verify that the destination URL matches the item label after clicking every menu item"
        category: Positive
        priority: High
      - objective: "Verify that the current page is highlighted in the navigation"
        category: Positive
        priority: Medium
      - objective: "Verify that the browser Back button returns to the previous route and Forward restores the next one"
        category: Positive
        priority: Medium
      - objective: "Verify that the browser URL changes to match the destination route on every navigation"
        category: Positive
        priority: Medium
      - objective: "Verify that 404 page is displayed for non-existent URLs"
        category: Negative
        priority: High
      - objective: "Verify that a deep link entered directly in the address bar opens the same page as navigating to it"
        category: Positive
        priority: Medium
