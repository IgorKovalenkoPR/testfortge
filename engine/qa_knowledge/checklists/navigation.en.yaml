version: 1
area: navigation
locale: en
sections:
  - name: "Navigation"
    prefix: NAV
    items:
      - objective: "Verify that the main navigation menu is displayed on all pages"
        category: Positive
        priority: High
      - objective: "Verify that the destination URL matches the item label after clicking every menu item"
        category: Positive
        priority: High
      - objective: "Verify that the current page is highlighted in the navigation"
        category: Positive
        priority: Medium
      - objective: "Verify that the previous route is reopened by the browser Back button and the next one by Forward"
        category: Positive
        priority: Medium
      - objective: "Verify that the browser URL changes to match the destination route on every navigation"
        category: Positive
        priority: Medium
      - objective: "Verify that 404 page is displayed for non-existent URLs"
        category: Negative
        priority: High
      - objective: "Verify that the same page is opened by a deep link entered directly in the address bar as by navigating to it"
        category: Positive
        priority: Medium
