version: 1
area: web_general
locale: en
sections:
  - name: "Header & Navigation"
    prefix: HDR
    items:
      - objective: "Verify that the company logo is displayed in the Header"
        category: Positive
        priority: High
      - objective: "Verify that the Homepage is opened after clicking the company logo"
        category: Positive
        priority: Medium
      - objective: "Verify that the main navigation menu in the Header lists every expected item"
        category: Positive
        priority: High
      - objective: "Verify that each navigation link opens the URL that matches its label"
        category: Positive
        priority: High
      - objective: "Verify that the navigation item for the current page has the active visual state (highlight / underline / different background)"
        category: Positive
        priority: Medium
      - objective: "Verify that the submenu becomes visible with all its items on hover over a navigation item"
        category: Positive
        priority: Medium
      - objective: "Verify that the Header navigation collapses into a Hamburger button at a 375px viewport"
        category: Positive
        priority: High
      - objective: "Verify that the menu opens on tapping the Hamburger button and closes on tapping outside it"
        category: Positive
        priority: Medium
      - objective: "Verify that the browser tab title matches the page name shown in the Header"
        category: Positive
        priority: Medium
      - objective: "Verify that the breadcrumb trail shows the exact path the user navigated (if breadcrumbs are used on this page)"
        category: Positive
        priority: Low
  - name: "Content & Layout"
    prefix: CNT
    items:
      - objective: "Verify that the page contains exactly one H1 element and its text matches the page topic"
        category: Positive
        priority: High
      - objective: "Verify that body text uses the site's declared font family and is legible (no clipped characters, no overflow)"
        category: Positive
        priority: High
      - objective: "Verify that every image on the page returns HTTP 200 with no broken-image placeholder"
        category: Positive
        priority: High
      - objective: 'Verify that every decorative image has alt="" and every content image has a descriptive alt attribute'
        category: Positive
        priority: Medium
      - objective: "Verify that every CTA button (e.g. 'Buy', 'Sign Up', 'Submit') is visible above the fold and reacts to click"
        category: Positive
        priority: High
      - objective: "Verify that content sections appear in the order defined by the design spec (hero, features, pricing, Footer)"
        category: Positive
        priority: Medium
      - objective: "Verify that the live page contains no 'Lorem Ipsum' or 'TBD' placeholder strings"
        category: Negative
        priority: Medium
      - objective: "Verify that no two visible elements overlap and every control stays inside its parent container at 1280px and 375px"
        category: Negative
        priority: Medium
      - objective: "Verify that long text (e.g. > 100 chars) in titles/cards is truncated with ellipsis and a tooltip reveals the full value"
        category: "Edge Case"
        priority: Low
  - name: "Links & Media"
    prefix: LNK
    items:
      - objective: "Verify that every internal link stays on the same origin and returns HTTP 200"
        category: Positive
        priority: High
      - objective: 'Verify that every external link carries target="_blank" and rel="noopener"'
        category: Positive
        priority: Medium
      - objective: "Verify that no link on the page returns HTTP 404 or 5xx"
        category: Negative
        priority: High
      - objective: "Verify that playback starts within 2 seconds with no decoder error after clicking play on each video or audio element"
        category: Positive
        priority: Medium
      - objective: "Verify that each social media link opens the brand's official account for that network"
        category: Positive
        priority: Medium
      - objective: "Verify that the default mail client opens with the prefilled recipient address after clicking a mailto: link"
        category: Positive
        priority: Low
      - objective: "Verify that the call application opens with the prefilled phone number after tapping a tel: link on a mobile device"
        category: Positive
        priority: Low
  - name: "Footer"
    prefix: FTR
    items:
      - objective: "Verify that the Footer is rendered at the bottom of the page and stays below the content on every viewport"
        category: Positive
        priority: Medium
      - objective: "Verify that every link inside the Footer returns HTTP 200 and opens the page its label names"
        category: Positive
        priority: Medium
      - objective: "Verify that the copyright line in the Footer shows the current year and the legal entity name from the design spec"
        category: Positive
        priority: Low
      - objective: "Verify that the Footer keeps the same structure and links across at least three pages of the site"
        category: Positive
        priority: Low
  - name: "Forms & Input"
    prefix: FRM
    items:
      - objective: "Verify that every form field has a visible label matching the spec (no placeholder-only labels)"
        category: Positive
        priority: High
      - objective: 'Verify that every required field is marked with an asterisk and carries aria-required="true"'
        category: Positive
        priority: Medium
      - objective: "Verify that the payload is accepted and a success state is displayed after submitting every field with valid data"
        category: Positive
        priority: High
      - objective: "Verify that an inline error is displayed next to each missing field after submitting with required fields empty"
        category: Negative
        priority: High
      - objective: "Verify that an invalid email value ('test@', '@domain', 'no-at-sign') is rejected with a valid-email-required message"
        category: Negative
        priority: High
      - objective: "Verify that submission is blocked with a numeric-only message after entering letters into the phone field"
        category: Negative
        priority: Medium
      - objective: "Verify that a success message is displayed within 2 seconds and the URL state updates after submitting a valid form"
        category: Positive
        priority: High
      - objective: "Verify that the other fields keep their values when a validation error is triggered on one field"
        category: Negative
        priority: Medium
      - objective: "Verify that the Form is submitted without truncation or error at the field's maximum allowed length"
        category: "Edge Case"
        priority: Medium
      - objective: "Verify that the field's minimum allowed length passes validation"
        category: "Edge Case"
        priority: Medium
      - objective: "Verify that Unicode and emoji characters (e.g. 'Привіт 🚀') survive submission and round-trip in the saved record"
        category: "Edge Case"
        priority: Medium
      - objective: "Verify that '<script>alert(1)</script>' submitted in any text field is stored and displayed as inert text, not executed"
        category: Security
        priority: High
      - objective: "Verify that \"' OR 1=1 --\" submitted in any text field returns a normal validation error, not a SQL error or a changed result set"
        category: Security
        priority: High
  - name: "Responsive Design"
    prefix: RSP
    items:
      - objective: "Verify that the layout uses a single column with no horizontal scroll bar at a 375px viewport"
        category: Positive
        priority: High
      - objective: "Verify that the layout matches the tablet breakpoint of the design spec at a 768px viewport"
        category: Positive
        priority: High
      - objective: "Verify that the layout matches the desktop breakpoint of the design spec at a 1280px or wider viewport"
        category: Positive
        priority: High
      - objective: "Verify that images scale proportionally with no distortion or cropping of faces and text between a 375px and a 1920px viewport"
        category: Positive
        priority: Medium
      - objective: "Verify that no page state (normal, modal open, form focused) introduces a horizontal scrollbar at any viewport ≥ 320px"
        category: Negative
        priority: High
      - objective: "Verify that every body-text paragraph is legible at 100% zoom (font-size at least 14px) on a 375px viewport"
        category: Positive
        priority: Medium
      - objective: "Verify that each interactive control has a hit area of at least 44x44 CSS pixels including padding on a 375px viewport"
        category: Positive
        priority: Medium
      - objective: "Verify that the layout re-flows without truncation or fixed-position overlap after rotating a mobile device from portrait to landscape"
        category: "Edge Case"
        priority: Low
  - name: "Performance"
    prefix: PRF
    items:
      - objective: "Verify that the page is loaded within 3 seconds on a standard connection"
        category: Positive
        priority: High
      - objective: "Verify that no JavaScript console errors are present on page load"
        category: Negative
        priority: High
      - objective: "Verify that images are optimized (compressed, WebP format where supported)"
        category: Positive
        priority: Medium
      - objective: "Verify that lazy loading is applied to below-the-fold images"
        category: Positive
        priority: Low
      - objective: "Verify that the page is usable on a slow 3G connection"
        category: "Edge Case"
        priority: Medium
  - name: "Accessibility (WCAG 2.1)"
    prefix: A11Y
    items:
      - objective: "Verify that all images have descriptive alt text"
        category: Positive
        priority: High
      - objective: "Verify that color contrast ratio meets WCAG 2.1 AA standard (4.5:1 for text)"
        category: Positive
        priority: High
      - objective: "Verify that the page is navigable using keyboard only (Tab, Enter, Escape)"
        category: Positive
        priority: High
      - objective: "Verify that focus indicators are visible on interactive elements"
        category: Positive
        priority: Medium
      - objective: "Verify that a screen reader reads all content in logical order"
        category: Positive
        priority: Medium
      - objective: "Verify that form fields have associated labels for assistive technologies"
        category: Positive
        priority: Medium
      - objective: "Verify that every interactive region has an aria-role matching its purpose (navigation, main, complementary)"
        category: Positive
        priority: Low
  - name: "Security (Basic)"
    prefix: SEC
    items:
      - objective: "Verify that the page is served over HTTPS"
        category: Positive
        priority: High
      - objective: "Verify that no sensitive data is exposed in page source or console"
        category: Negative
        priority: High
      - objective: "Verify that Content Security Policy (CSP) headers are present"
        category: Positive
        priority: Medium
      - objective: "Verify that cookies are set with Secure and HttpOnly flags"
        category: Positive
        priority: Medium
      - objective: "Verify that no mixed content (HTTP resources on HTTPS page) is present"
        category: Negative
        priority: Medium
  - name: "SEO (Basic)"
    prefix: SEO
    items:
      - objective: "Verify that meta title is present and under 60 characters"
        category: Positive
        priority: Medium
      - objective: "Verify that meta description is present and under 160 characters"
        category: Positive
        priority: Medium
      - objective: "Verify that canonical URL is specified"
        category: Positive
        priority: Low
      - objective: "Verify that the page has exactly one H1 and its H2/H3 tags do not skip levels"
        category: Positive
        priority: Low
