version: 1
pack: naming
lang: ua
label: Іменування елементів і написання кроків

# Кожна відповідь тут — це правило, яке генератор уже застосовує, цитоване, а
# не переказане.
#
# Правила лежать у style/wording_rules.yaml і glossary/ui_terms.en.yaml,
# виміряні з референсного плану команди на 4 808 кейсів, і їх читають
# tc_author, checklist_author та glossary.lint_text. Якщо порада в чаті
# розходиться зі згенерованим результатом, тестувальнику кажуть одне, а
# показують інше — і програє порада.
#
# ВАЖЛИВО про мову: самі терміни і граматика кейсу лишаються англійськими —
# "Verify that", "Click on", "drop-down", "entry field", "Modal",
# "Accordion", "Hamburger button". Це не недопереклад: референсний план і
# всі згенеровані кейси англійською, тож перекладена порада «пишіть
# «Перевірити, що…»» дала б кейс, який не проходить лінтер і не збігається
# з жодним іншим кейсом у наборі. Українською тут пояснення, англійською —
# те, що потрапляє в кейс.
#
# Дві відмінності, які плутають найчастіше, і обидві видно лише якщо читати
# правила, а не припускати:
#
#   * "Press" дозволене — але лише для клавіш. "Press the Enter key" —
#     правильно, "press the Submit button" — ні. Порада, яка забороняє
#     "press" узагалі, така сама неправильна, як і та, що дозволяє його
#     будь-де.
#   * "should" заборонене в НАЗВІ й дозволене в ОЧІКУВАНОМУ РЕЗУЛЬТАТІ.
#     Переглянений навчальний матеріал команди вживає його в результатах
#     наскрізь, і команда-лід не заперечив; арбітраж зафіксовано у
#     wording_rules.yaml. Заборонене в результаті насправді інше — оцінювати
#     його: "correctly", "properly", "works fine".

entries:

  - id: naming_click_or_press
    any: [натиснути чи клікнути, клікнути чи натиснути, click чи press,
          press чи click, натиснути або клікнути, яке дієслово, який дієслов,
          клікнути, натиснути на, тапнути]
    weight: 1
    answer: |
      **"Click on"** для всього, на що вказують, **"Tap"** — мобільний
      відповідник, і **"Press"** — лише для клавіш.

      • `Click on the "Submit" button` — натисніть на кнопку
      • `Tap the "Submit" button` — мобільний
      • `Press the "Enter" key` — саме для цього зарезервоване "Press"

      Тобто крок, який «press» кнопку, неправильний, і крок, який «click»
      клавішу, теж. Правило не «ніколи не press», а «press те, що справді
      натискають пальцем».

      Список дозволених дієслів короткий навмисно: **Go to, Click on, Tap,
      Expand, Collapse, Select, Fill in, Enter, Clear, Leave … empty, Mark,
      Unmark, Press, Hover over, Scroll, Swipe, Upload, Drag and drop,
      Change, Confirm, Pay attention to, Try to find.** Одна дія на крок, і
      завжди з явним обʼєктом.
    follow_up:
      - "Як писати крок зі скролом?"
      - "З чого має починатися назва тест-кейсу?"
    source: qa_knowledge/style/wording_rules.yaml — action_verbs

  - id: naming_dropdown_form
    any: [дропдаун, спадн, випадаюч, drop-down, dropdown, combobox, селект,
          вибір зі списку]
    weight: 0.5
    answer: |
      **Пишіть "drop-down"** — через дефіс, щоразу.

      Глосарій тримає один канонічний термін на контрол саме для того, щоб
      тестувальник, який не писав кейс, міг його знайти пошуком. Синоніми — це
      те, що робить набір непошуковим: три назви одного контрола означають три
      частковi пошуки.

      Ті, де найчастіше тягнуться до синоніма:

      • **drop-down** — не без дефіса, не "select", не "combobox"
      • **entry field**, або власний лейбл поля — не "textbox"
      • **Accordion** — не "spoiler", не "expander"
      • **Hamburger button** — не "burger menu"
      • **Modal** — не "lightbox"

      І називайте його разом із лейблом, цитованим точно:
      `the "Industries" drop-down`.
    follow_up:
      - "Як назвати вікно, що накриває сторінку?"
      - "Як назвати поле без лейбла?"
    source: qa_knowledge/glossary/ui_terms.en.yaml

  - id: naming_no_label
    any: [без лейбла, без підпису, лупа, іконка пошуку, тільки іконка, лише
          іконка, немає назви, placeholder, плейсхолдер, без назви]
    weight: 0.5
    answer: |
      **Назвіть його — у такому порядку переваги, і ніколи лише за
      розташуванням.**

      1. **Його placeholder**, цитований: `the "Search" entry field`.
      2. **Його accessible name** — `aria-label` або `title`. Це те, що
         озвучує скрінрідер, і зазвичай те, як його назвав розробник.
      3. **Тип контрола плюс що він робить**: `the search entry field in the
         Header`.

      Розташування — це уточнення, а не назва. «Іконка справа» і «друга
      картка» перестають бути правдою в момент зміни верстки, і жодне з них
      не каже наступному тестувальнику, що шукати. Якщо є два ідентичні
      контроли — назвіть контрол, а **потім** уточніть: `the "Delete" button
      in the second row`.

      До речі, назви областей сторінки — власні назви: **Header, Footer,
      Homepage, Sidebar, Navigation**. Пишеться "in the Header".
    follow_up:
      - "Чи можна писати «друга картка в списку»?"
      - "Чи писати Header і Footer з великої?"
    source: qa_knowledge/style/wording_rules.yaml — element_naming

  - id: naming_profile_menu
    any: [аватарк, аватар, іконка профілю, іконка користувача, по фото
          профілю, відкривається по, як назвати те, що відкривається]
    weight: 0.5
    answer: |
      **Це drop-down** — і називайте його за тригером і лейблом, а не за
      виглядом.

      `Click on the user avatar in the Header` → `the account drop-down is
      displayed`. Якщо в панелі є видимий заголовок або дизайн її називає —
      цитуйте це: `the "My account" drop-down`.

      Якщо воно накриває сторінку і блокує взаємодію з тим, що позаду, це
      **Modal**, а не drop-down — і ця відмінність важлива, бо ці двоє
      по-різному поводяться на Escape, на клік поза межами і на малому екрані,
      а це три тест-кейси.
    follow_up:
      - "Це dropdown чи drop-down?"
      - "Як назвати вікно, що накриває сторінку?"
    source: qa_knowledge/glossary/ui_terms.en.yaml

  - id: naming_capitals
    any: [з великої, велика літера, з великої літери, header і footer,
          власна назва, капіталіз]
    weight: 0.5
    answer: |
      **Так — назви областей сторінки є власними назвами.** Header, Footer,
      Homepage, Sidebar, Navigation. Пишеться "in the Header", не "in the
      header".

      Це не стильова забаганка: це три окремі коментарі рецензента в
      референсному плані, і всі три — те саме речення: *"Footer should be
      started from a capital letter."*

      Чому це заслуговує на правило: з великої "Header" читається як область
      сторінки. З малої "header" може бути HTTP-заголовком, заголовком
      таблиці або просто заголовком — і крок «перевірити header» сказав три
      можливі речі одночасно.
    follow_up:
      - "Як назвати поле без лейбла?"
      - "З чого має починатися назва тест-кейсу?"
    source: qa_knowledge/style/wording_rules.yaml — element_naming

  - id: naming_by_position
    any: [друга картка, третій елемент, той, що справа, іконка справа,
          перша кнопка, за розташуванням, другий елемент, останній елемент]
    weight: 0.5
    answer: |
      **Не варто.** «Друга картка в списку» — це не назва, а опис верстки, яка
      зміниться, і воно нічого не ідентифікує для тестувальника, який читатиме
      кейс через рік.

      Назвіть елемент, а потім уточніть розташуванням лише якщо справді є два
      ідентичні:

      • не `Click on the second card`, а `Click on the "AI Assistant Quality
        Audit" case study card`
      • коли лейбл справді дублюється: `Click on the "Delete" button in the
        second row of the results table`

      Є друга причина, крім довговічності. Якщо ви тестуєте саме порядок, то
      кейс, який ідентифікує елементи **через** порядок, не може впасти — він
      знайде те, що стоїть другим, і назве це правильним.
    follow_up:
      - "Як назвати поле без лейбла?"
      - "Чи писати Header і Footer з великої?"
    source: qa_knowledge/style/wording_rules.yaml — element_naming

  - id: naming_title_grammar
    any: [назва тест-кейсу, назва кейсу, з чого починатися, як назвати
          тест-кейс, як називати кейси, заголовок кейсу, назва має починатися,
          саммарі]
    weight: 1
    answer: |
      **`Verify that <actor> can <action> via the "<label>" <control type>`.**

      Кожна назва в референсному плані починається з **"Verify that"** — 2 649
      із 4 808 буквально «Verify that User can …», і 101 — «Verify that User
      cannot …». Отже:

      • **Завжди відкривайте "Verify that".** Інших відкривачів у корпусі
        немає.
      • **Називайте актора**: User, або конкретну роль, якщо кейс справедливий
        лише для неї — Manager, Admin, Sales Head.
      • **"can" для позитивних, "cannot" для негативних.** Не "should", не
        "must", не "is able to", не "verify the ability to".
      • **Цитуйте лейбл і називайте тип контрола**: `the "Create" button`,
        `the "Department" drop-down`.
      • **Одне твердження на назву.** Назва, що зʼєднує два незалежні
        перевірки через "and", розбивається на два кейси.
      • **Без точки в кінці**, і 60–160 символів — норма корпусу.

      `Verify that User cannot submit the form via the "Save" button while
      the "Email" entry field is empty`
    follow_up:
      - "Чи можна писати «повинна» в очікуваному результаті?"
      - "Моя назва на 240 символів — це багато?"
    source: qa_knowledge/style/house_style.yaml — summary_grammar

  - id: naming_should_in_results
    any: [повинна, повинен, має показати, should в очікуваному, should в
          результаті, чи писати should, чи можна повинна, майбутній час]
    weight: 1
    answer: |
      **В очікуваному результаті "should" (і українське «повинна»)
      дозволене. У назві — ні.**

      Цей розподіл свідомий і арбітрований, а не припущений. Переглянений
      навчальний матеріал команди вживає "should" у своїх очікуваних
      результатах наскрізь — "The entered data should be accepted", "Button
      should be hidden when there is no additional data" — і команда-лід не
      заперечив. Форма теперішнього часу, "The entered data is accepted",
      прийнятна так само й саме її вживає клієнтський корпус. **Не
      переписуйте одну в іншу**: обидві є house style.

      Назви — інша річ: там кожен кейс відкриває "Verify that <actor> can /
      cannot …", і "should" не зʼявляється ніколи.

      Два слова лишаються забороненими в обох місцях: **"must"** і **"shall"**.
      Жоден із референсних корпусів їх не вживає, і вони читаються як вимога, а
      не як спостереження.

      Що справді ламає очікуваний результат — не "should", а оцінювання. Про
      це наступне правило.
    follow_up:
      - "Через що очікуваний результат стає непридатним?"
      - "З чого має починатися назва тест-кейсу?"
    source: qa_knowledge/style/wording_rules.yaml — result_wording

  - id: naming_result_wording
    any: [коректно, правильно працює, працює як треба, як очікується,
          очікуваний результат, валідується коректно, correctly, properly,
          належним чином]
    weight: 0.5
    answer: |
      **Формулюйте спостережний результат. Ніколи не оцінюйте його.**

      Заборонені в очікуваних результатах і в обʼєктивах чеклістів:
      *correctly, incorrectly, correct, incorrect, properly, as expected,
      works fine, works as designed, appropriately, successfully works* — і
      їхні українські відповідники. Коментар рецензента за цим правилом
      прямий: *"Try do not use correct/incorrect, specify the action or the
      result."*

      Проблема оцінки в тому, що її неможливо не пройти. «Фільтр працює
      коректно» — коректно на чию думку, і як наступний тестувальник це
      дізнається? Замініть тим, що видно на екрані:

      • не «фільтр працює коректно», а **"only projects related to the
        selected industry are displayed"**
      • не «форма валідується коректно», а **'the "Name" entry field is
        highlighted in red and an error message is displayed below the
        field'**

      Негативний кейс стверджує **обидві половини**: дію заблоковано **і**
      зворотний звʼязок, який бачить користувач. А коли незалежних результатів
      кілька — нумеруйте їх: 1. … 2. … 3. …
    follow_up:
      - "Чи можна писати «повинна» в очікуваному результаті?"
      - "Як розбити крок, що робить дві дії?"
    source: qa_knowledge/style/wording_rules.yaml — result_wording

  - id: naming_one_action_per_step
    any: [один крок чи, розбити крок, дві дії, одна дія, кілька дій,
          в одному кроці, обʼєднати кроки, три речі]
    weight: 0.5
    answer: |
      **Окремі кроки — по одній дії, кожна зі своїм обʼєктом.**

      «Відкрити форму, заповнити email і натиснути Submit» — це три дії, тож
      це три кроки:

      1. `Click on the "Contact us" button in the Header`
      2. `Fill in the "Email" entry field with a valid email:
         qa.tester@example.com`
      3. `Click on the "Submit" button`

      Дві причини, і кусає друга. Обʼєднаний крок не може зафіксувати, де саме
      впало — «крок 2 не пройшов» не каже нічого, коли крок 2 робив три речі.
      І тестові дані належать конкретній дії; кроку, що заповнює три поля,
      нікуди подіти три значення.

      Також заборонені як кроки, бо їх не може виконати ніхто, крім автора:
      *"Navigate to the relevant page", "Perform the action", "Observe the
      result", "Do the same for other fields"*.
    follow_up:
      - "Як писати крок зі скролом?"
      - "Через що очікуваний результат стає непридатним?"
    source: qa_knowledge/style/wording_rules.yaml — action_verbs

  - id: naming_scroll
    any: [скрол, проскрол, прокрут, свайп вниз, крок зі скролом]
    weight: 0.5
    answer: |
      **"Scroll" завжди називає свій обʼєкт і напрямок.**

      `Scroll the page down to the Footer` — не голе "Scroll down". Коментар
      рецензента, збережений у правилах, — одне питання: *"1. What do you
      scroll?"* Сторінка, модалка, таблиця і список drop-down скролються
      незалежно, і крок, який не каже який саме, невиконуваний для другої
      людини.

      Поки ви в цій частині кейсу: кроки-спостереження пишуться як **"Pay
      attention to <element>"** або **"Try to find <element>"**. Ніколи не
      ставте "Verify", "Check" чи "Ensure" у крок — твердження належить
      очікуваному результату, а кроку, який стверджує, нікуди записати те, що
      справді побачили.
    follow_up:
      - "Як розбити крок, що робить дві дії?"
      - "Через що очікуваний результат стає непридатним?"
    source: qa_knowledge/style/wording_rules.yaml — action_verbs

  - id: naming_quote_labels
    any: [цитувати лейбл, точно як на екрані, точний лейбл, скопіювати підпис,
          лейбл точно, підпис точно]
    weight: 0.5
    answer: |
      **Так — точно так, як воно намальоване, у прямих лапках.**

      Включно з регістром, який використав дизайн, і включно з квадратними
      дужками, якщо дизайн їх малює: `the [Show more] button`, `the "Contact
      us" button`. Корпус використовує і лапки, і дужки; будьте послідовні в
      межах одного документа.

      Причина в тому, що лейбл — це половина локатора. Тестувальник, який не
      писав кейс, має лейбл і тип контрола, і більше нічого, щоб знайти
      контрол — а автоматизатор, який читатиме кейс, візьме цей самий рядок
      для селектора. Перенабрати його з памʼяті як "Contact Us", коли на
      екрані "Contact us", коштує комусь зламаного локатора потім.
    follow_up:
      - "Як назвати поле без лейбла?"
      - "Чи писати Header і Footer з великої?"
    source: qa_knowledge/style/wording_rules.yaml — element_naming

  - id: naming_accordion
    any: [accordion, акордеон, розгортається, спойлер, згортається,
          показує більше тексту, читати далі, розкривна секція]
    weight: 0.5
    answer: |
      **"Accordion"** — не "spoiler", не "expander", не «розкривний блок».

      Дієслова до нього — **Expand** і **Collapse**, обидва з дозволеного
      списку: `Expand the "Delivery options" Accordion`.

      Варто знати, що на ньому перевіряти, бо назва — це проста частина:
      згорнутий стан за замовчуванням, розгортання однієї секції, чи
      розгортання другої згортає першу (це два різні продукти), робота з
      клавіатури, і чи схований контент доступний пошуку та скрінрідеру, поки
      секція згорнута.
    follow_up:
      - "Це dropdown чи drop-down?"
      - "Як назвати вікно, що накриває сторінку?"
    source: qa_knowledge/glossary/ui_terms.en.yaml

  - id: naming_modal
    any: [modal, модалк, лайтбокс, попап, поп-ап, діалог, оверлей, накриває
          сторінку, блокує сторінку, вікно поверх, поверх сторінки]
    weight: 0.5
    answer: |
      **"Modal"** — поверхня, намальована поверх сторінки, яка блокує
      взаємодію з тим, що позаду. Не "lightbox", не «попап-вікно».

      Називайте за заголовком: `the "Delete project?" Modal`.

      Відмінність, яка важлива під час тестування: Modal блокує сторінку
      позаду, а drop-down — ні. Тому Modal винен вам конкретний набір
      перевірок — Escape закриває, клік по підкладці закриває (або свідомо не
      закриває), фокус переходить усередину і замкнений там, поки вона
      відкрита, сторінка позаду не скролиться, а закриття повертає фокус на
      те, що її відкрило. Саме ці кейси губляться, і губляться частіше, коли
      кейс називає її «попапом».
    follow_up:
      - "Як назвати те, що відкривається по аватарці?"
      - "Це dropdown чи drop-down?"
    source: qa_knowledge/glossary/ui_terms.en.yaml

  - id: naming_hamburger
    any: [гамбургер, три смужки, три лінії, бургер, іконка мобільного меню]
    weight: 1
    answer: |
      **"Hamburger button"** — з великої, і "button", а не "menu", бо контрол,
      який ви натискаєте, і меню, яке він відкриває, — це дві різні речі й
      часто два різні дефекти.

      `Click on the Hamburger button in the Header` → `the Navigation menu is
      displayed`.

      Цей розподіл себе виправдовує в баг-репорті: «Hamburger button нічого не
      робить» і «Navigation menu відкривається порожнім» — різні відмови, і
      назвати обидві «бургер-меню зламане» означає втратити відмінність.
    follow_up:
      - "Це dropdown чи drop-down?"
      - "Як назвати поле без лейбла?"
    source: qa_knowledge/glossary/ui_terms.en.yaml

  - id: naming_entry_field
    any: [textbox, текстове поле, поле введення, інпут, entry field,
          чи можна textbox]
    weight: 0.5
    answer: |
      **"Entry field"**, або власний лейбл поля — house-глосарій не вживає
      "textbox".

      `Fill in the "Email" entry field with a valid email` — і назвіть поле
      **і** скажіть, валідні дані чи невалідні, а потім повторіть буквальне
      значення в колонці тестових даних. «Заповнити поле валідними даними» —
      невиконуваний крок: наступний тестувальник не знає, що ви набрали.

      Для свідомого пропуску в негативному кейсі є своя формула:
      **`Leave the "Email" entry field empty`**. Вона читається як намір, а не
      як крок, який хтось забув дописати.
    follow_up:
      - "Це dropdown чи drop-down?"
      - "Як розбити крок, що робить дві дії?"
    source: qa_knowledge/glossary/ui_terms.en.yaml

  - id: naming_title_length
    any: [занадто довг, надто довг, символ, скільки символів, довжина назви,
          "240", скоротити назву]
    all: [[назв, заголов, саммарі]]
    weight: 0.5
    answer: |
      **Задовго — 60–160 символів норма корпусу, а 220 жорстка межа.**

      Назва такої довжини майже завжди — два кейси під одним іменем. Шукайте
      «and»: одне твердження на назву, і назва, що зʼєднує дві незалежні
      перевірки, розбивається на два кейси. Зазвичай це саме собою скорочує її
      нижче норми без жодного переформулювання.

      Дві інші речі, які без потреби роздувають назву: повторення модуля або
      сторінки, які вже несе заголовок секції, і опис кроків замість
      твердження. Назва каже, *що перевіряється*; кроки кажуть як.
    follow_up:
      - "З чого має починатися назва тест-кейсу?"
      - "Як розбити крок, що робить дві дії?"
    source: qa_knowledge/style/house_style.yaml — summary_grammar

  - id: naming_general
    any: [як назвати, який термін, термінолог, house style, формулюв,
          як писати, іменуванн, як правильно писати]
    weight: -3
    answer: |
      **House-правила в одному місці** — усі виміряні з референсного плану
      команди, і це ті самі, які застосовує генератор:

      • **Елементи**: канонічний термін глосарія з точно цитованим лейблом —
        `the "Industries" drop-down`. Назви областей — власні: Header, Footer,
        Homepage.
      • **Ніколи лише за розташуванням.** Назвіть, потім уточніть.
      • **Кроки**: одна дія, дозволене дієслово, явний обʼєкт. "Click on" для
        вказування, "Tap" для мобільного, "Press" лише для клавіш. "Scroll"
        завжди називає, що саме скролить.
      • **Назви**: `Verify that <actor> can / cannot <action> via the
        "<label>" <control>`. Без "should", без "must", без точки в кінці,
        одне твердження, 60–160 символів.
      • **Очікувані результати**: спостережні факти, ніколи оцінки — жодних
        "correctly", "properly", "works fine". "should" тут дозволене;
        "must" — ні.

      Спитайте про будь-яке з них — і отримаєте правило разом із джерелом.
    follow_up:
      - "Писати «натиснути» чи «клікнути»?"
      - "З чого має починатися назва тест-кейсу?"
      - "Через що очікуваний результат стає непридатним?"
    source: qa_knowledge/style/wording_rules.yaml
