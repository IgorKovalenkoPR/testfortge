version: 1
pack: layer
lang: ua
label: Бек чи фронт

# Увесь пак має один урок: не вгадуй шар — подивись. Кожна відповідь
# приводить до вкладки Network і консолі, бо ці дві речі перетворюють
# догадку на доказ за десять секунд, і бо репорт, який їх несе, не
# повертають.
#
# Tedgie свідомо відмовляється називати шар за симптомом. Ця відмова і є
# навчанням: стажер, який засвоїв «неправильна сума = бек», буде часто і
# впевнено помилятися й не мати способу це побачити. Стажер, який засвоїв
# «порівняй відповідь із екраном», має рацію щоразу і жодної евристики не
# потребує.
#
# Технічні назви (Network, console, HAR, payload, 500) лишаються як є: це
# те, що написано у вкладках DevTools, і перекладена порада «відкрийте
# мережу» не збігається з жодним підписом, який тестувальник бачить.

entries:

  - id: layer_wrong_value
    any: [сума, підсумок, кількість, ціна, неправильне значення, неправильне
          число, неправильні дані, неправильний результат, розрахунок,
          знижка, баланс, загальна сума]
    all: [[бек, фронт, backend, frontend, який шар, серверн, клієнтськ,
           чий баг, чия помилка]]
    answer: |
      **Не вгадуйте — порівняйте відповідь із екраном.** Це десять секунд і
      воно закриває питання остаточно.

      1. Відкрийте DevTools → **Network**, відтворіть дію, знайдіть запит,
         який повертає це значення.
      2. Подивіться в **payload** відповіді. Чи число вже неправильне в ній?
      3. Якщо відповідь неправильна → це сталося до відображення. Якщо
         відповідь правильна, а екран показує інше → це сталося під час
         відображення.

      Що б це не було, доказ уже прикріплений до репорту, і розробнику не
      треба повторювати вашу роботу, щоб зрозуміти, яку половину системи
      відкривати. Поки ви не подивилися, чесна відповідь — «ще не можу
      сказати»: симптом типу неправильної суми справді буває з обох боків, і
      вибір шару за симптомом — це те, як баги на два дні їдуть не до тієї
      людини.
    follow_up:
      - "Що прикріпити до бага?"
      - "Як зняти HAR-файл?"
      - "Відповідь правильна, а екран порожній."
    source: TestForTge mentoring pack

  - id: layer_how_to_tell_server
    any: [серверн, як зрозуміти, як дізнатися, як визначити, як відрізнити,
          це сервер, чий бік, який шар, бек чи фронт, backend чи frontend]
    weight: 0.5
    answer: |
      **Три перевірки, в такому порядку.** Кожна займає секунди, і будь-яка
      може закрити питання.

      1. **Вкладка Network.** Знайдіть запит. **500** або будь-який інший 5xx
         — це сервер говорить, що в нього не вийшло, і тут немає
         двозначності. 4xx зазвичай означає, що неправильним був сам запит, а
         це часто клієнтський дефект.
      2. **Payload відповіді.** Якщо дані приходять уже неправильними,
         проблема сталася до того, як вони потрапили в браузер.
      3. **Консоль.** JavaScript-помилка при тому, що запит вернув 200 і
         правильні дані, вказує в інший бік.

      Дві корисні швидкі перевірки. Якщо це відтворюється при прямому виклику
      API — Postman, curl або «copy as fetch» із браузера — інтерфейс тут
      узагалі не задіяний. І якщо це стається лише в одному браузері, це майже
      напевно не сервер: сервер не знає, хто саме його спитав.
    follow_up:
      - "Як зняти HAR-файл?"
      - "Чи потрібен SQL, щоб тестувати API?"
    source: TestForTge mentoring pack

  - id: layer_evidence
    any: [що прикріпити, які докази, що додати до бага, щоб не повернули,
          повернули баг, відхилили баг, недостатньо інформації, забракувал]
    all: [[прикріп, доказ, репорт, баг, інформац, додати]]
    weight: 1
    answer: |
      **Прикріпіть те, що звільняє розробника від потреби відтворювати це
      самому.** Приблизно в порядку того, чого найчастіше бракує:

      • **Кроки**, пронумеровані, з відомого початкового стану, і тестові
        дані, якими ви користувалися. «Зайти як X, відкрити Y, натиснути Z».
      • **Запит і відповідь** для виклику, що зламався — статус, payload,
        час. **HAR** несе весь обмін цілком.
      • **Лог консолі**, включно з тим, що надрукувалося до збою, а не лише
        червоний рядок.
      • **Середовище і білд**: яка URL, яка версія, який браузер і ОС, який
        акаунт і роль.
      • **Скріншот або коротке відео** — останнім, не першим. Воно показує,
        що сталося, і ніколи не показує чому.

      Одна звичка варта більше за весь цей список: знімайте все під час
      **першого** відтворення. Повертатися по лог консолі потім — це друге
      відтворення, а переривчасті дефекти не завжди його дають.
    follow_up:
      - "Як зняти HAR-файл?"
      - "Розробник каже «не відтворюється»."
    source: TestForTge mentoring pack

  - id: layer_spinner
    any: [спінер, крутиться, вічно вантажиться, не вантажиться, зависає,
          завис, нічого не відбувається після, лоадер не зникає]
    answer: |
      **Три різні дефекти виглядають точно так само, і вкладка Network
      розрізняє їх з одного погляду.**

      Відтворіть з відкритим DevTools → Network і прочитайте, який із трьох
      це:

      1. **Запиту немає взагалі** — натискання не викликало запит. Це
         клієнтський бік: обробник, який упав, заблокований контрол, валідація,
         що тихо відмовила. Дивіться консоль.
      2. **Запит у стані pending і не завершується** — він пішов і нічого не
         повернулося. Зафіксуйте, скільки ви чекали і чи він узагалі відпадає
         по таймауту; прикріпіть запит, щоб таймаут було видно.
      3. **Відповідь прийшла нормальна, а спінер лишився** — відповідь ніхто
         не обробив. Це дефект відображення, і відповідь у ваших доказах
         підтверджує, що з даними все гаразд.

      Прикріпіть те, що з трьох знайшли. «Спінер крутиться вічно» — це те саме
      речення для всіх трьох, тому це один із найчастіше повернутих репортів.
    follow_up:
      - "Що прикріпити до бага?"
      - "Відповідь правильна, а екран порожній."
    source: TestForTge mentoring pack

  - id: layer_500
    any: ["500", "502", "503", 5xx, internal server error, помилка сервера,
          серверна помилка]
    weight: 1
    answer: |
      **500 — це сервер говорить, що в нього не вийшло. Заводьте завжди.**

      Це не ваша провина і не потребує виправдань: що б ви не надіслали,
      правильна система відповідає осмисленою помилкою, а не 500. Навіть якщо
      ви свідомо надіслали дурницю, необроблене падіння на дурниці — це вже
      валідний дефект, і зазвичай воно означає, що вхідні дані ніхто не
      валідував.

      Зробіть репорт дешевим для роботи: URL і метод запиту, payload, який ви
      надіслали, повна відповідь, час, коли це сталося, і акаунт. Розробнику
      знадобиться серверний лог за цією позначкою часу — і саме ваша позначка
      дозволяє його знайти.

      Одне варто перевірити першим: чи воно відтворюється. 500, що трапився
      один раз під час деплою, — інша розмова, ніж 500 щоразу.
    follow_up:
      - "Що прикріпити до бага?"
      - "Яка severity для 500?"
    source: TestForTge mentoring pack

  - id: layer_stale_ui
    any: [не оновлюється, доки не перезавантажу, після перезавантаження,
          треба оновити сторінку, лише після релоаду, застаріл,
          список не оновився, не підтягується]
    weight: 1
    answer: |
      **Дані збереглися правильно — це дефект стану на фронті.**

      Підтвердьте це двома кроками, щоб репорт казав це з доказом: запит на
      збереження вернув успіх, і після перезавантаження запис на місці. Отже
      значення записалося і база правильна; зламалося те, що інтерфейс
      продовжував показувати старе.

      Скажіть це прямо в репорті. Написане як «запис не зберігається», воно
      відправляє розробника шукати не в тій половині системи, і він
      повернеться зі словами «у мене працює». Написане як «зберігається і
      персиститься; список показує старе значення до ручного оновлення» —
      дефект уже локалізований за нього.

      Варто зазначити, чи оновлюються інші екрани: іноді один компонент
      підписаний на зміну, а інший ні, і саме ця різниця є підказкою.
    follow_up:
      - "Що прикріпити до бага?"
      - "Неправильна сума — це бек чи фронт?"
    source: TestForTge mentoring pack

  - id: layer_validation
    any: [валідац, порожній email, порожнє поле, обовʼязкове поле, приймає
          порожнє, дає відправити, пропускає невалідн, обхід валідації]
    weight: 0.5
    answer: |
      **Заводьте як обидва, і перед тим, як писати, покличте API напряму.**

      Валідація в інтерфейсі — це зручність для користувача. Перевірка, яка
      має значення, — на сервері, бо все, що робить браузер, можна обійти:
      DevTools, прямий виклик із Postman чи curl, або просто клієнт, який
      ваш JavaScript не виконує.

      Тож зробіть так: надішліть ті самі невалідні дані прямо в API. Тоді ви
      знаєте, який із двох дуже різних дефектів у вас.

      • **Інтерфейс відмовляє, а API приймає** — це дефект, дотичний до
        безпеки, а не косметика. Невалідні або зловмисні дані можуть дійти до
        сховища.
      • **Приймають обидва** — вимога не реалізована, і в репорті треба
        назвати вимогу.
      • **API відмовляє, а інтерфейс дав натиснути «Надіслати»** — дефект
        юзабіліті: користувач отримує серверну помилку там, де мав отримати
        підказку в полі.
    follow_up:
      - "Як покликати API напряму?"
      - "Яка severity для відсутньої серверної валідації?"
    source: TestForTge mentoring pack

  - id: layer_browser_specific
    any: [працює в chrome, тільки в safari, не в safari, лише у firefox,
          не у firefox, в edge, інший браузер, один браузер]
    weight: 1
    answer: |
      **Якщо це стається в одному браузері й не стається в іншому — воно на
      клієнті.**

      Причина проста: пішов той самий запит і повернулася та сама відповідь —
      API не знає, хто саме питав, і не поводився інакше. Різниться код, який
      виконався після.

      Підтвердьте й локалізуйте:

      1. **Консоль у тому браузері, де ламається.** Кросбраузерні дефекти
         майже завжди лишають там помилку, і вона зазвичай називає
         непідтримувану можливість.
      2. **Точні версії, обох.** «Safari 17.2 ламається, Chrome 121 працює» —
         з цим можна працювати; «Safari ламається» — ні.
      3. **Чи це відображення, чи поведінка** — зламана верстка і кнопка, що
         нічого не робить, це різні дефекти з одним тригером.
      4. **Приватне вікно**, щоб виключити розширення й закешовані ресурси.

      Далі перевірте сумісність того, що назвала консоль. Часто відповідь —
      можливість, якої браузер не реалізує, і репорт може це сказати прямо.
    follow_up:
      - "Що прикріпити до бага?"
      - "Як тестувати браузер, якого в мене немає?"
    source: TestForTge mentoring pack

  - id: layer_console_habit
    any: [кожен баг, завжди дивитися, чи дивитися в консоль, відкривати
          консоль, чи варто відкривати, чи потрібно перевіряти консоль]
    all: [[консол, console]]
    weight: 1
    answer: |
      **Так — зробіть це звичкою і тримайте її відкритою, поки тестуєте.**

      Це безкоштовно. Вкладка вже там, тримати її відкритою не коштує нічого,
      і вона перетворює «сторінка виглядала не так» на «сторінка виглядала не
      так і викинула ось цю помилку ось у цей момент». Ця різниця часто і є
      всім дослідженням.

      Дві речі, яких не дає більше ніщо. Вона ловить дефекти, які поки не
      мають видимого симптому — помилку на шляху, куди ви випадково не
      подивилися. І вона ставить позначку часу на збій відносно вашої дії,
      а саме це дозволяє розробнику зіставити його з серверним логом.

      Тримайте **Network** поруч із тієї ж причини. Разом вони дають більшості
      репортів потрібні докази вже під час першого відтворення, а не другого.
    follow_up:
      - "Що прикріпити до бага?"
      - "Як зняти HAR-файл?"
    source: TestForTge mentoring pack

  - id: layer_render_failure
    any: [відповідь правильна, дані приходять, приходять нормально, показує
          нічого, екран порожній, порожній екран, нічого не відображається,
          порожня сторінка, нічого не показує]
    weight: 1
    answer: |
      **Правильна відповідь плюс порожній екран — це дефект відображення.**

      Складнішу половину ви вже зробили: дані прийшли. Зламався код, який мав
      їх показати, і ваш доказ підтверджує, що виклик був нормальний — саме це
      не дає завести баг не на ту людину.

      Далі — консоль. Настільки повна відмова відображення майже завжди
      викидає виняток, і stack trace зазвичай називає компонент. Прикріпіть
      його разом із відповіддю, яку ви зняли.

      Дві перевірки варто додати в репорт: чи ламається на будь-яких даних,
      чи лише на цих — один запис із неочікуваною формою, порожній список,
      null у полі, дуже довгий рядок — і чи виправляє це перезавантаження.
      Обидві істотно звужують причину.
    follow_up:
      - "Що прикріпити до бага?"
      - "Список не оновлюється, доки не перезавантажу."
    source: TestForTge mentoring pack

  - id: layer_har
    any: [har, har-файл, експортувати network, зберегти мережу, лог мережі,
          зняти трафік, зняти мережу]
    weight: 1
    answer: |
      **DevTools → Network → експорт.** У Chrome і Edge це стрілка
      завантаження на панелі Network («Export HAR»); у Firefox — у
      контекстному меню панелі; у Safari — Export на вкладці Network.

      Дві речі зробіть до експорту, обидві легко забути:

      • **Увімкніть «Preserve log»** — інакше навігація або редирект зітруть
        усе, що ви щойно зняли.
      • **Очистіть, потім відтворіть.** HAR усієї сесії читати значно важче,
        ніж HAR однієї зламаної дії.

      Одне застереження варто взяти серйозно: HAR містить усе, що було
      надіслано, включно з **токенами авторизації, куками і будь-якими
      персональними даними в payload'ах**. Користуйтеся тестовим акаунтом, і
      якщо тікет видно за межами команди — скажіть, що ви вичистили. Якщо
      потрібен лише один виклик, експорт одного запиту замість цілого логу
      зазвичай достатній.
    follow_up:
      - "Що прикріпити до бага?"
      - "Чи тестувати на справжніх даних користувачів?"
    source: TestForTge mentoring pack

  - id: layer_sql
    any: [sql, база даних, запит до бази, select, чи потрібен sql,
          вчити sql, чи треба знати sql]
    weight: 0.5
    answer: |
      **Для старту не обовʼязково, а знадобиться швидше, ніж здається.**

      Більшість тестування бекенду взагалі не потребує доступу до бази: можна
      надсилати запити, читати відповіді й перевіряти, що API повертає те, що
      йому сказали. Це покриває більшість дефектів API, і відповідь у репорті
      все одно кращий доказ, ніж результат запиту, бо це те, що застосунок
      реально віддав.

      Де SQL себе виправдовує — питання, на які API не відповість. Запис
      справді записався, чи лише повернувся в ехо? Чи оновлення не зачепило
      інші рядки? Чи дані лишилися узгодженими після невдалої операції?

      Найменший корисний обсяг справді малий: `SELECT` із `WHERE`,
      `ORDER BY`, `COUNT` і `JOIN`, коли потрібні дві таблиці. Це вихідні, не
