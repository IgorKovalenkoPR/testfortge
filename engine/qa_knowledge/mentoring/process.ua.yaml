version: 1
pack: process
lang: ua
label: Процес і судження

# Питання в цьому паку — ті, що не мають чистої відповіді, і саме тому їм
# потрібна одна. «Скільки кейсів на форму логіну», «коли тестування
# завершене», «що різати» — стажеру, який це питає, зазвичай уже сказали
# «залежить», і це правда й водночас безкорисно.
#
# Тож кожен запис перетворює питання на метод, який можна застосувати
# сьогодні, і каже, що міряти. Там, де канонічна відповідь є в силабусі
# (рівні тестування, принципи, техніки, тест-план), її тримає ISTQB-шар, і
# цей пак туди не лізе.

entries:

  - id: proc_no_time_for_regression
    any: [немає часу, не вистачає часу, різати, скоротити, зменшити обсяг,
          мало часу, дедлайн, реліз завтра, один день, встигнути]
    all: [[регрес, тестуван, обсяг, скоуп]]
    weight: 1
    answer: |
      **Обирайте за ризиком і вирішуйте, що **лишити**, а не що викинути.**
      Список того, що лишаєте, короткий і захищуваний; список викинутого
      довгий і з ним ніхто не спорить.

      Лишити, у цьому порядку:

      1. **Те, що змінилося**, і те, що зміна зачіпає. Прочитайте діф або
         спитайте розробника, які модулі рухалися. Це найвища віддача з усіх
         способів вибору — дефекти скупчуються там, де була робота.
      2. **Шляхи, якими ходять гроші й дані.** Вхід, чекаут, оплата, права,
         усе, що записує.
      3. **Смоук по всьому іншому** — поверхнево й широко, щоб катастрофічна
         поломка будь-де все одно спіймалася.
      4. **Дефекти минулого релізу** в тих областях, які фіксили.

      А далі скажіть вголос, що не покрито, письмово, до релізу — «немає
      кросбраузерного проходу, немає експортів, немає адмінки». Неповідомлений
      скорочений обсяг стає неприємним сюрпризом; повідомлений — це
      бізнес-рішення, яке підписує хтось інший.
    follow_up:
      - "Коли можна сказати, що тестування завершене?"
      - "Що таке ризик-орієнтоване тестування?"
    source: TestForTge mentoring pack

  - id: proc_when_is_testing_done
    any: [тестування завершене, тестування закінчене, коли зупинитися, коли
          можна зупинитись, достатньо тестування, коли досить,
          критерії готовності, підписати реліз]
    weight: 1
    answer: |
      **Коли виконані exit-критерії, які ви узгодили на початку — а не коли
      закінчуються дефекти.**

      Дефекти не закінчуються ніколи; це один із семи принципів. Тож
      «завершено» має бути визначено до старту, і зазвичай це короткий список:

      • заплановане покриття виконане — кейси пройдені, чекліст пройдений;
      • **немає відкритих дефектів вище узгодженої severity**, а винятки
        перелічені поіменно й прийняті;
      • ризики, визначені під час планування, кожен або перевірений, або
        свідомо прийнятий;
      • результати відзвітовані, і хтось ухвалив рішення.

      Якщо цього ніхто не визначив, то це і є справжня відповідь на ваше
      питання: запропонуйте критерії зараз, письмово, і отримайте згоду. Це
      перетворює «ми вже все?» зі суперечки на чекліст.

      Одну річ варто сказати прямо: «завершено» — це рішення, а не відкриття.
      Ваша робота — зробити стан продукту достатньо читабельним, щоб хтось це
      рішення ухвалив.
    follow_up:
      - "Для чого потрібні entry та exit criteria?"
      - "Немає часу на регресію — що різати?"
    source: ISTQB CTFL §1.4.4, §5.1

  - id: proc_how_many_cases
    any: [скільки кейсів, скільки тест-кейсів, скільки перевірок, кількість
          кейсів, скільки тестів, скільки писати]
    weight: 1
    answer: |
      **Кількість — це результат, а не рішення.** Оберіть техніки,
      застосуйте їх і порахуйте те, що вийшло.

      Для форми логіну це приблизно так:

      • **Класи еквівалентності** — валідні креденшели; неправильний пароль;
        невідомий користувач; порожні поля. Чотири класи, по кейсу на кожен;
        більше кейсів із того самого класу не додають нічого.
      • **Граничні значення** на всьому, що має межу — мінімальна й
        максимальна довжина пароля, по одному нижче й вище кожної.
      • **Негативні й безпекові кейси** — заблокований акаунт, прострочений
        пароль, ліміт спроб і що буває після нього, чи повідомлення про
        помилку відрізняє «немає такого користувача» від «неправильний пароль»
        (не має відрізняти).
      • **Стан** — уже залогінений, сесія прострочена, кнопка «назад» після
        виходу.

      Це дає десь 12–20 для форми логіну, і число не є суттю: техніка — це те,
      що ви захищаєте на рецензії, і саме вона каже, коли зупинитись.

      Далі нехай ризик це підрізає. Прототипу не потрібен кейс на ліміт спроб;
      банківському логіну він потрібен першим.
    follow_up:
      - "Які техніки тест-дизайну варто знати першими?"
      - "Чи чекліст гірший за тест-кейси?"
    source: ISTQB CTFL §4

  - id: proc_no_requirements
    any: [немає вимог, без вимог, нічого не задокументовано, немає специфікац,
          немає документац, немає критеріїв приймання, недокументован]
    weight: 1
    answer: |
      **Тестуйте досліджувально, з письмовим чартером, і нехай питання, які
      ви згенеруєте, стануть вимогами.**

      Година цього дає більше, ніж очікування:

      1. **Напишіть чартер** до старту — «дослідити чекаут із невалідними
         картковими даними, щоб знайти валідацію й обробку помилок, 60
         хвилин». Чартер — це те, що відрізняє дослідження від клікання, і
         те, що робить сесію звітною.
      2. **Аналогічні продукти як оракул.** Ви знаєте, що робить форма
         реєстрації. Стандартна поведінка — захищуване очікування, а те, чим
         цей продукт відрізняється, — саме те, про що треба спитати.
      3. **Записуйте кожне припущення** на ходу. Цей список — найцінніше, що
         ви створите: це документ вимог, написаний зовні, і продакту значно
         легше його виправити, ніж написати з нуля.
      4. **Питайте конкретно.** «Що має статися, коли картку відхилили?»
         отримує відповідь. «А вимоги є?» — ні.

      Спершу впорядкуйте області за ризиком, щоб, якщо сесію обріжуть, ви
      витратили її там, де дефект мав би значення.
    follow_up:
      - "Як тестувати те, чого я не розумію?"
      - "Сесія не знайшла нічого — це марно?"
    source: ISTQB CTFL §4.4

  - id: proc_estimate_overrun
    any: [оцінив, зайняло більше, вийшов за оцінку, недооцінив, "3 дні",
          зайняло вдвічі, не вклався в оцінку, промахнувся з оцінкою]
    weight: 1
    answer: |
      **Найімовірніше річ не у вашому тест-дизайні — перевитрата зазвичай у
      роботі, яку ніхто не бюджетує.**

      Чотири причини, на які припадає більшість:

      • **Ретест і підтвердження.** Кожен знайдений дефект повертається на
        перевірку, часто двічі. Якщо ви забюджетували лише виконання, багатий
        на дефекти білд подвоює ваш час за конструкцією.
      • **Простій середовища.** Очікування деплою, зламаний стейдж, фікстура,
        яку треба перебудувати. Це справжній робочий час і він невидимий в
        оцінці, яка рахує лише кейси.
      • **Переробка** після того, як вимоги зрушили під вами.
      • **Очікування відповідей** — заблокований на питанні не є безкоштовним.

      Тож виправлення — це не запас, а вимірювання. З цього прогону
      записуйте чотири числа: час на дизайн, час на виконання, час на ретест і
      час у блокуванні. Через дві-три фічі ви матимете власний множник, і він
      буде кращим за будь-яке правило з пальця — включно з популярним «додай
      30% на ретест», яке правильне в середньому і неправильне для вашого
      проєкту.

      І ще одне варто перевірити: чи обсяг, який ви оцінювали, це обсяг, який
      ви тестували. Перевитрати часто є зростанням скоупу, яке ніхто не
      переоцінив.
    follow_up:
      - "Як оцінити фічу, якої я ніколи не бачив?"
      - "Ретестити лише виправлений баг?"
    source: ISTQB CTFL §5.2

  - id: proc_reopened
    any: [reopened, реопен, переоткрив, повертається знову, ретест не пройшов,
          все ще зламано після фікса, фікс не працює, знову впало]
    weight: 1
    answer: |
      **Якнайкоротше — а другий reopen це сигнал про репорт, не лише про
      фікс.**

      Коли переоткриваєте, скажіть точно, що ви ретестили і що побачили: номер
      білда, кроки і чим це відрізнялося від заявленого фікса. «Все ще
      зламано» перезапускає все дослідження; «все ще падає на білді 412, ті
      самі кроки, помилка тепер 400 замість 500» рухає його далі.

      Якщо той самий дефект переоткривається двічі, правдиве одне з трьох, і
      варто назвати яке саме:

      • **корінну причину так і не знайшли** — залатали симптом;
      • **ваші кроки були неоднозначні**, і розробник виправив інший дефект,
        ніж той, який ви знайшли;
      • **дефектів два** з одним симптомом, і один із них виправлено.

      Третє трапляється часто і його легко проґавити. Якщо поведінка змінилася,
      але все одно неправильна, це доказ на його користь.
    follow_up:
      - "Ретестити лише виправлений баг?"
      - "Розробник каже «не відтворюється»."
    source: ISTQB CTFL §5.5

  - id: proc_retest_scope
    any: [ретест лише, тільки виправлений, навколо нього, підтверджуюче
          тестування чи, після фікса, перевірити фікс, що ще перевірити після]
    weight: 1
    answer: |
      **І те, і те — і це дві названі активності, не зливайте їх.**

      **Confirmation testing** — це сам фікс: точні кроки з репорту на білді,
      який заявляє виправлення. Якщо вони пройшли, дефект виправлено і більше
      нічого.

      **Regression testing** — це те, що фікс міг зламати: фіча, в якій він
      живе, усе, що ділить код, який розробник торкнув, і шляхи, які
      споживають ті самі дані. Спитайте розробника, що саме він змінив — це
      питання на тридцять секунд і воно краще за вгадування радіуса
      ураження.

      Скільки регресії — залежить від фікса. Зміна одного рядка в лейблі
      потребує перевірки лейбла. Зміна у спільній процедурі валідації потребує
      кожної форми, яка її використовує, і це варто сказати вголос у тікеті,
      щоб вартість фікса була видима.

      І перезапустіть **негативний** кейс, якщо він був. Фікс, який змушує
      валідний шлях працювати шляхом видалення валідації, проходить
      confirmation ідеально.
    follow_up:
      - "Яка різниця між смоук і регресією?"
      - "Скільки баг має висіти в Reopened?"
    source: ISTQB CTFL §2.2.3

  - id: proc_should_i_automate
    any: [чи автоматизувати, варто автоматизувати, автоматизувати цей,
          кандидат на автоматизацію, автоматизувати тест]
    weight: 1
    answer: |
      **Чотири питання. Три «так» роблять це вартим роботи.**

      1. **Як часто це буде запускатися?** Кейс, що біжить на кожен білд,
         відпрацьовує свою вартість швидко; той, що на кожен реліз —
         повільно; той, що один раз — ніколи.
      2. **Чи поведінка стабільна?** Автоматизувати екран, який ще
         перемальовують, означає підтримувати тест частіше, ніж запускати.
      3. **Чи перевірка механічна?** Точні значення, стани й тексти дешево
         перевіряти. «Чи це виглядає добре», «чи це зручно», «чи формулювання
         доречне» — ні, і скрипт, який вдає протилежне, видає впевнену
         дурницю.
      4. **Скільки коштує підтримка?** Кожен автоматизований кейс — це код,
         яким ви володієте назавжди. Набір, якому ніхто не вірить, бо він
         падає випадково, гірший за відсутність набору: він вчить команду
         ігнорувати червоне.

      Найкращі перші кандидати майже завжди нудні: смоук-шляхи, підготовка
      даних для ручного тестування і та сама форма, заповнена сорока
      комбінаціями. Найгірші — досліджувальна робота й одноразові розслідування.
    follow_up:
      - "Немає часу на регресію — що різати?"
      - "Скільки кейсів писати на форму логіну?"
    source: TestForTge mentoring pack

  - id: proc_cannot_reproduce
    any: [не відтворюється, не відтворив, не можу відтворити, у мене працює,
          закрив як не відтворюється, немає репро]
    weight: 1
    answer: |
      **Виходьте з того, що ви обидва маєте рацію, і шукайте різницю.** Вона
      майже завжди є, і вона з цього списку:

      • **Білд і версія.** Ви на тій самій? Фікс або деплой між вашим
        прогоном і їхнім пояснює більшість таких випадків.
      • **Середовище.** Стейдж проти локального, інша конфігурація, інші
        feature-флаги.
      • **Акаунт і роль.** Права, тариф, локаль, акаунт із наявними даними
        проти свіжого.
      • **Дані.** Запис, який ви взяли, може й бути причиною. Порожній список,
        дуже довге імʼя, null у полі — це відтворюється у вас і ні в кого
        більше.
      • **Стан.** Кеш, куки, наявна сесія, попередня дія в тій самій сесії.
      • **Таймінг.** Ви клікнули двічі, чи швидко? Стан гонки існує і на
        замовлення не відтворюється.

      Далі відтворіть ще один раз і зніміть усе: відео з відкритими консоллю
      і Network, точні дані, акаунт, білд. Переривчастий дефект із відео — це
      дефект; без відео — це незгода.

      Якщо у вас воно справді не відтворюється — напишіть це в тікеті й
      запишіть, що ви пробували. Це інформація, а тихо згорнути тікет — ні.
    follow_up:
      - "Що прикріпити до бага?"
      - "Скільки баг має висіти в Reopened?"
    source: TestForTge mentoring pack

  - id: proc_checklist_vs_cases
    any: [чекліст гірший, чекліст чи тест-кейс, чекліст замість, чеклісти
          краще, чекліст проти, чому чекліст]
    weight: 1
    answer: |
      **Різні інструменти, і вибір залежить від того, хто читає.** Жоден із
      них не є юніорською версією іншого.

      **Чекліст** — це одна спостережна перевірка на рядок, без кроків. Він
      швидко дає ширину, його швидко писати й швидко проходити, і він
      припускає, що читач знає продукт. Найкраще для смоук-проходів,
      повторюваних наскрізних тем і для того, щоб дати досвідченому
      тестувальнику покриття без церемоній.

      **Тест-кейс** несе передумови, кроки, дані й очікуваний результат. Він
      відтворюваний людиною, яка ніколи не бачила продукт, він аудитований, і
      саме з нього автоматизатор пише код. Найкраще там, де дефект дорогий, де
      флоу довгий і де кейс запускатиме не автор.

      Справжній обмін — деталь проти швидкості. На більшості проєктів існує й
      те, й те: чекліст для широкого поверхневого проходу, кейси для шляхів,
      де помилятися коштує грошей. Обрати одне на все — єдина очевидна помилка.
    follow_up:
      - "Скільки кейсів писати на форму логіну?"
      - "Коли можна сказати, що тестування завершене?"
    source: TestForTge mentoring pack

  - id: proc_dont_understand
    any: [не розумію, не розбираюсь, гадки не маю, ніколи не бачив, незнайом,
          новий домен, не знаю продукт, не знаю як це працює]
    weight: 1
    answer: |
      **Вивчайте це, тестуючи — і перетворюйте кожну прогалину на питання з
      конкретною відповіддю.**

      Метод, який працює з нуля, приблизно за годину:

      1. **Обійдіть це перед тим, як судити.** Відкрийте кожен екран,
         клікніть кожен контрол, не змінюючи нічого важливого. Ви будуєте
         карту, а не шукаєте дефекти.
      2. **Скажіть вголос, для чого кожна частина.** Там, де не можете, це і є
         перше, про що треба спитати — і «для чого цей екран?» це нормальне
         питання, на яке люди раді відповісти.
      3. **Позичте очікування у продуктів, які знаєте.** Ви користувалися
         кошиком, пошуком, реєстрацією. Стандартна поведінка — легітимний
         оракул, і будь-яке відхилення варте питання.
      4. **Питайте конкретно.** «Що має статися, якщо двоє редагують той самий
         запис?» отримує справжню відповідь; «можеш пояснити модуль?» отримує
         екскурсію, яку ви забудете.
      5. **Записуйте те, що дізнаєтесь.** Через тиждень ви будете тією
         людиною, яка це документує для наступного тестувальника.

      Не розуміти домен на початку — нормальний стан, а не дискваліфікація.
      Питання, які ви ставите, поки він незнайомий, часто найкращі з усіх, що
      про нього хтось ставив.
    follow_up:
      - "Прийшов білд без вимог. Що тестувати?"
      - "Сесія не знайшла нічого — це марно?"
    source: TestForTge mentoring pack

  - id: proc_stlc
    any: [stlc, життєвий цикл тестування, етапи тестування, фази тестування,
          стадії тестування, цикл тестування]
    weight: 1
    answer: |
      **Життєвий цикл і те, що кожен етап справді видає:**

      1. **Аналіз вимог** — прочитати тест-базис, знайти, що тестовуване і
         чого бракує. Вихід: питання, ризики й дефекти, які ви знайшли у
         вимогах, коли коду ще не існувало. Це найдешевший етап, щоб їх
         знайти.
      2. **Планування** — обсяг, підхід, трудомісткість, середовища, entry- і
         exit-критерії. Вихід: план і оцінка.
      3. **Дизайн** — умови, кейси, чеклісти, дані. Вихід: testware і
         трасування назад до базису.
      4. **Підготовка середовища** — часто паралельно, і часто саме те, що вас
         реально блокує. Вихід: де запускати і з якими даними.
      5. **Виконання** — прогнати, порівняти, завести дефекти, ретестити,
         прогнати регресію. Вихід: результати й баг-репорти.
      6. **Закриття** — звіт проти exit-критеріїв, запис того, що не покрито,
         зібрані уроки. Вихід: рішення і те, що наступний проєкт зробить
         інакше.

      На практиці вони перетинаються — дизайн починається до кінця планування,
      а аналіз узагалі не припиняється. Цінність списку в тому, що в кожного
      етапу є вихід, тож «ми на дизайні» означає щось перевірне.
    follow_up:
      - "Для чого потрібні entry та exit criteria?"
      - "Що входить у тест-план?"
    source: ISTQB CTFL §1.4

  - id: proc_duplicate
    any: [той самий баг, дублікат, двоє знайшли, вже заведено, вже репортили,
          хтось уже завів, обидва завели]
    weight: 1
    answer: |
      **Лишіть перший, звʼяжіть другий як дублікат і перенесіть те, що знає
      другий.**

      Порядок тут менш важливий, ніж перенесення. Другий репорт майже завжди
      містить те, чого немає в першому — інші кроки, інше середовище, інший
      зачеплений екран — і це доказ про обсяг дефекту. Скопіюйте це в
      оригінал, перш ніж згортати дублікат; не видаляйте його.

      Дві причини не просто відкинути його. Два незалежні репорти — це сигнал
      про частоту й вплив, а це вхід для пріоритету. І якщо потім виявиться,
      що це були **не** той самий дефект, згорнутий дублікат — той запис, який
      знайде другий.

      Одна перевірка перед злиттям: однаковий симптом ще не однаковий дефект.
      Якщо кроки істотно різні, це можуть бути дві причини з одним проявом, і
      злиття означає, що одну виправлять, а другу тихо ні.
    follow_up:
      - "Розробник каже «не відтворюється»."
      - "Скільки баг має висіти в Reopened?"
    source: ISTQB CTFL §5.5

  - id: proc_exploratory_found_nothing
    any: [не знайшла нічого, не знайшов нічого, нічого не знайшлось, немає
          багів, нічого не зламано, марно, витрата часу, дарма]
    weight: 1
    answer: |
      **Не марно — ви створили інформацію, а це і є справжній продукт
      тестування.**

      «Дефектів у цій області за цим чартером не знайдено» — це справжній
      результат. Він підвищує впевненість там, де ви дивилися, звужує те, де
      ризик ще живе, і є доказом для релізного рішення. Відсутність дефектів
      безкорисна лише тоді, коли ніхто не записав, де ви дивилися.

      Тож зробіть це вартим чогось. Опишіть сесію: чартер, покриті області,
      дані, якими користувалися, до чого не дійшли, і питання, які виникли.
      Останній список зазвичай найцінніше в ній — сесія, що не знаходить
      дефектів, майже завжди знаходить кілька речей, яких ніхто не вирішив.

      І будьте підозріливі до одного: чи ви тестували там, де дефекти справді
      є. Чиста сесія в області, якої ніхто не змінював, очікувана. Чиста
      сесія по перепisаному модулю варта другого, злішого погляду з
      неприємнішими даними — довгі рядки, порожні стани, одночасне
      редагування, нещасливі шляхи.
    follow_up:
      - "Як тестувати те, чого я не розумію?"
      - "Прийшов білд без вимог. Що тестувати?"
    source: ISTQB CTFL §4.4

  - id: proc_estimate_unknown
    any: [оцінити фічу, як оцінити, оцінка тестування для, ніколи не бачив,
          не знаю скільки часу, оцінка для нового, естімейт]
    weight: 1
    answer: |
      **Спирайтеся на аналог, а потім дайте діапазон із вашими припущеннями.**
      Одне число про небачену фічу — це догадка з десятковою комою.

      1. **Знайдіть найближче з того, що ви вже тестували**, і починайте з
         того, скільки це реально зайняло. Ваші власні минулі числа кращі за
         будь-яку формулу.
      2. **Розбийте** — скільки екранів, скільки флоу, скільки ролей, скільки
         інтеграцій. Оцінити пʼять малих речей значно точніше, ніж одну
         велику.
      3. **Додайте невидиму роботу явно**: тест-дизайн, підготовку середовища
         й даних, ретест дефектів, які ви знайдете, і регресію на те, що це
         зачіпає.
      4. **Дайте діапазон** і скажіть, від чого він залежить. «4–7 днів: 4,
         якщо середовище готове і є критерії приймання, 7 — якщо очікування
         доведеться виводити з нуля».
      5. **Назвіть невідомі як ризики**, бо саме вони є предметом
         перемовин. Якщо ніхто не може сказати, що робить фіча, коли платіжний
         провайдер відпадає по таймауту, це ризик із ціною, і він належить
         оцінці, а не вашим вечорам.

      Далі запишіть, скільки це зайняло насправді. Дві такі фічі — і ви
      оцінюєте з вимірювання, а не з відчуття.
    follow_up:
      - "Оцінив 3 дні, зайняло 6 — що не так?"
      - "Що входить у тест-план?"
    source: ISTQB CTFL §5.2

  - id: proc_general
    any: [процес, воркфлоу, найкраща практика, як підійти, методолог,
          з чого почати]
    weight: -3
    answer: |
      **Чотири питання, які відповідають на більшість процесних питань, у
      цьому порядку:**

      1. **У чому ризик?** Що ламається, наскільки ймовірно, наскільки погано.
         Він упорядковує все інше — покриття, глибину, те, що ріжеться, коли
         ріжеться час.
      2. **Що є оракулом?** Як ви дізнаєтеся, що результат неправильний —
         вимога, аналогічний продукт, здоровий сенс, стейкхолдер? Якщо не
         можете сказати, це перше, що треба вирішити.
      3. **Що тут означає «завершено»?** Exit-критерії, узгоджені до старту,
         щоб фініш був чеклістом, а не суперечкою.
      4. **Що ви скажете людям?** Покриття, що не покрито, які ризики
         прийняті. Тестування, яке не відзвітували, не поінформувало жодного
         рішення.

      Спитайте про щось конкретне — регресію під тиском часу, оцінку, чартери
      для дослідження, обсяг ретесту, автоматизацію кейса — і отримаєте метод,
      а не принцип.
    follow_up:
      - "Коли можна сказати, що тестування завершене?"
      - "Немає часу на регресію — що різати?"
      - "Чи автоматизувати цей тест?"
    source: TestForTge mentoring pack
