version: 1
pack: severity_priority
lang: ua
label: Серйозність і пріоритет

# Українська версія. Не переклад слово в слово: тригери — це те, як питання
# ставлять насправді, а команда говорить змішаним регістром — «severity»,
# «баг», «репортити» лишаються англійськими всередині українського речення,
# і тригери мусять ловити обидві форми.
#
# Назви рівнів (Critical / Major / Minor / Trivial) НЕ перекладаються: це те,
# що написано в трекері, і перекладена порада «поставте незначну» не
# відповідає жодному полю, яке тестувальник бачить перед собою.

entries:

  - id: sp_cosmetic_text
    any: [опечат, орфограф, друкарськ, копірайт, футер, formulierung, текст
          неправильн, неправильний текст, назва неправильн, typo, footer]
    all: [[серйозн, severity, пріоритет, priority, наскільки критичн, тріаж]]
    answer: |
      **Рекомендована severity: Minor** — або Trivial, якщо це чиста
      декорація, яку ніхто не читає.

      _Чому:_ нічого не заблоковано. Користувач проходить усі сценарії, дані
      правильні, зламане лише подання. Це і є визначення низу шкали.

      **Пріоритет — окреме питання, і він може бути високим.** Помилка в
      назві компанії або хибний рік у копірайті — це сором там, де його
      бачать клієнти, тож бізнес часто хоче це в найближчий реліз, хоч
      системі байдуже. У репорті скажіть обидві речі: низька severity, а
      терміновість нехай ставить продакт.
    follow_up:
      - "Чи може бути низька severity і високий пріоритет?"
      - "Хто визначає пріоритет?"
      - "Чи варто репортити зсув на 3px?"
    source: ISTQB CTFL §5.5

  - id: sp_cosmetic_layout
    any: [зсув, вирівн, не по центру, піксел, "3px", відступ, перекрива,
          розмір шрифт, колір неправильн, чи це взагалі баг, чи це баг]
    all: [[серйозн, severity, пріоритет, priority, варто, репорт, чи це баг,
           тріаж]]
    answer: |
      **Так, репортьте — Trivial, або Minor, якщо це виглядає зламаним, а не
      просто неідеальним.**

      _Чому взагалі репортити:_ написати баг коштує кілька хвилин, і поле
      severity вже несе вашу оцінку, що це дрібниця. Дефект, який ніхто не
      завів, неможливо пріоритезувати, а «ми про це знали» після релізу —
      гірша розмова, ніж тікет Trivial, який свідомо не полагодили.

      Прикріпіть скріншот із розміром вікна і скажіть, чи це на всіх
      breakpoint'ах, чи на одному. Якщо лише на одній ширині — це і є
      найкорисніша частина репорту.

      Один виняток варто назвати: якщо зсув перекриває або приховує контрол
      так, що ним неможливо скористатися, це вже не косметика, а Major.
    follow_up:
      - "Яка severity для опечатки у футері?"
      - "Що прикріпити до бага?"
    source: ISTQB CTFL §5.5

  - id: sp_crash_narrow_audience
    any: [крашиться, падає, краш, повністю не працює, не можу завершити,
          "500", сторінка помилки, білий екран, заблоковано, crash]
    all: [[серйозн, severity, пріоритет, priority, наскільки критичн, тріаж]]
    weight: 0.5
    answer: |
      **Рекомендована severity: Critical**, якщо обхідного шляху немає, і
      High, якщо є.

      _Чому:_ severity міряє вплив **коли дефект спрацював**, а не скільком
      користувачам він трапляється. Чекаут, який падає для однієї країни, —
      це повна відмова для кожного користувача в тій країні: вони взагалі не
      можуть завершити покупку, і з інтерфейсу цього не обійти.

      Скільком користувачам це стається — це доказ у репорті, і саме ним
      бізнес поставить пріоритет. Не знижуйте severity через вузьку
      аудиторію: ви зробите роботу продакта замість нього, погано, і
      приховаєте той факт, що відмова повна.
    follow_up:
      - "Хто визначає пріоритет?"
      - "Що прикріпити до бага?"
    source: ISTQB CTFL §5.5

  - id: sp_data_loss
    any: [втрата даних, втрачає дані, втратив дані, незбережен, зникає,
          зникли, видалилося, пошкоджен, не збереглося]
    all: [[серйозн, severity, пріоритет, priority, наскільки критичн, тріаж]]
    weight: 1
    answer: |
      **Рекомендована severity: Critical.** Втрата даних стоїть на вершині
      шкали навіть тоді, коли трапляється рідко.

      _Чому:_ користувач не може це відкотити і не може відновити свою роботу
      сам. Частота — це вхідні дані для пріоритету, а не для severity:
      дефект, який втрачає дані один раз із п'ятдесяти, втрачає їх повністю.

      У репорті чітко скажіть, що саме втрачено і чи вціліло щось: форма,
      яку користувач перенабрав, — це прикро, а відправлений запис, що зник
      після підтвердження, — інший баг, і за ним часто стоїть проблема
      узгодженості даних.
    follow_up:
      - "Як довести, що дані втрачено?"
      - "Рідко, але критично — як аргументувати пріоритет?"
    source: ISTQB CTFL §5.5

  - id: sp_security
    any: [пароль, відкритим текстом, безпек, токен, api-ключ, api ключ,
          розкрит, витік, чужі дані, персональні дані, іншого користувача]
    all: [[серйозн, severity, пріоритет, priority, наскільки критичн, тріаж]]
    weight: 1
    answer: |
      **Рекомендована severity: Critical**, і повідомте приватно, якщо в
      команді є для цього канал.

      _Чому:_ дефект безпеки — це розкриття, тож його вплив не міряється
      тим, працює функція чи ні. Пароль, показаний відкритим текстом,
      читається будь-ким через плече, під час шерингу екрана, і часто
      потрапляє в автозаповнення браузера та в кожен скріншот.

      Не експериментуйте далі, ніж потрібно для підтвердження, і не
      використовуйте справжні креденшели чи справжні персональні дані під
      час перевірки. Запишіть точно те, що побачили, і зупиніться —
      відтворювати розкриття ширше, ніж необхідно, це окремий ризик.
    follow_up:
      - "Що прикріпити до бага безпеки?"
      - "Чи тестувати на справжніх даних користувачів?"
    source: ISTQB CTFL §5.5

  - id: sp_performance_vs_requirement
    any: [повільніше, повільно, секунд, таймаут, продуктивн, надто довго,
          час відповіді, довго вантажиться]
    all: [[серйозн, severity, пріоритет, priority, наскільки критичн, тріаж]]
    answer: |
      **Рекомендована severity: Major**, якщо порушено заявлену вимогу, і
      Medium, якщо числа ніде не зафіксовано і просто «відчувається
      повільно».

      _Чому:_ нічого видимо не зламано, тож рефлекс — назвати це косметикою.
      Але порушено вимірюваний критерій приймання, а це функціональна
      відмова вимоги. Вимога і є доказом — цитуйте її в репорті, а поруч
      поставте своє виміряне число.

      Якщо вимоги немає — скажіть це прямо і запропонуйте її. «8с проти
      незаявленої цілі» — це питання до продакта; «8с проти SLA 2с» — дефект,
      який не потребує дискусії.
    follow_up:
      - "Як правильно міряти час відповіді?"
      - "Вимоги немає — це все одно баг?"
    source: ISTQB CTFL §5.5

  - id: sp_localisation
    any: [локаліз, переклад, не переклад, англійською на, неправильна мова,
          українська версія, мовна версія]
    all: [[серйозн, severity, пріоритет, priority, наскільки критичн, тріаж]]
    answer: |
      **Рекомендована severity: Minor**, якщо користувач усе одно розуміє і
      може продовжити, і **Major**, якщо не може.

      _Чому:_ саме тут потрібне міркування, а не рефлекс. Неперекладене
      повідомлення про помилку на мовній версії — це справжній дефект, і
      питання, яке визначає рівень: чи може користувач за ним діяти.
      «Invalid email format» англійською зрозуміє більшість і воно нікого не
      блокує. Неперекладені платіжні або юридичні формулювання, або
      повідомлення, за яким треба діяти, щоб продовжити, — це Major. А якщо
      ламається сам перемикач мови, це вже функціональний дефект, не
      локалізаційний.

      У репорті скажіть, які саме рядки, на яких екранах, і чи перекладена
      решта сторінки: один втрачений ключ і цілий втрачений бандл — різні
      баги з однаковим симптомом.
    follow_up:
      - "Як тестувати перемикач мови?"
      - "Яка severity для неправильного формату дати?"
    source: ISTQB CTFL §5.5

  - id: sp_environment_only
    any: [стейдж, staging, тестове середовище, тільки на дев, dev-середовищ,
          не на проді, не на продакшн, лише локально]
    all: [[серйозн, severity, пріоритет, priority, заблоков, тріаж]]
    weight: 0.5
    answer: |
      **Severity лишається високою — Critical, якщо це повністю блокує
      тестування, — але чітко скажіть, що це обмежено середовищем.**

      _Чому:_ тут два різні впливи, і їх не можна зливати в один. Для
      команди зламаний логін на стейджі блокує все тестування, і це
      максимальна severity. Для користувачів поки не зачеплено нічого, тож
      бізнес може обґрунтовано поставити пріоритет нижчий, ніж підказує
      severity.

      Напишіть обидві речі: «блокує все тестування на стейджі; на продакшні
      не відтворюється». А перед тим, як заводити це як дефект продукту,
      перевірте очевидні причини середовища — конфігурацію, тестові дані,
      прострочений сертифікат, застарілий білд. Якщо це конфігурація, тікет
      усе одно потрібен, просто не на продукт.
    follow_up:
      - "Як відрізнити конфігурацію від дефекту продукту?"
      - "Хто визначає пріоритет?"
    source: ISTQB CTFL §5.5

  - id: sp_low_sev_high_prio
    any: [низька severity, severity низька, серйозність низька, низька
          серйозність, високий пріоритет, пріоритет високий, чи може бути,
          чи таке буває, одночасно]
    all: [[серйозн, severity]]
    weight: 1
    answer: |
      **Так — і це абсолютно нормально.** Ці два поля відповідають на різні
      питання, тож мають повне право розходитися.

      Severity — технічний вплив: наскільки погано поводиться система, коли
      дефект спрацював. Priority — бізнесова терміновість: як швидко це
      мусить бути виправлено. Різні власники, різні докази.

      Класична пара, обидві половини справжні:

      • **Низька severity, високий пріоритет** — логотип компанії написано з
        помилкою на головній. Із системою все гаразд, із брендом — ні. Іде в
        найближчий хотфікс.
      • **Висока severity, низький пріоритет** — експорт падає у звіті, який
        запускають три внутрішні користувачі, і в них є ручний обхід. Повна
        відмова, жодної терміновості.

      Коли вони розходяться, скажіть це прямо в репорті, замість того щоб
      усереднювати в одному полі.
    follow_up:
      - "Хто визначає пріоритет?"
      - "Чи підняти severity, щоб полагодили швидше?"
    source: ISTQB CTFL §5.5

  - id: sp_who_decides
    any: [хто визначає, хто ставить, хто вирішує, це моє рішення, я чи,
          чи менеджер, чи пм, можу я змінити пріоритет, хто обирає]
    all: [[пріоритет, priority, серйозн, severity]]
    weight: 1
    answer: |
      **Ви пропонуєте severity на основі доказів. Пріоритет визначає
      бізнес.**

      Severity — це технічна оцінка впливу, і ви та людина, яка щойно його
      виміряла, тож це ваше поле і вам його захищати тим, що ви побачили.
      Ніхто не старший за докази.

      Priority — це рішення про реліз: воно важить дефект проти роадмапи,
      клієнтів, що чекають, вартості фікса і ризику його везти. Це рішення
      продакта або менеджера, і вони часто знають про контекст те, чого не
      знаєте ви.

      Де тестувальники програють цю розмову — коли б'ються не за те. Якщо
      вважаєте, що це терміновіше, ніж оцінили, **не піднімайте severity** —
      принесіть вплив: скільком користувачам, як часто, чого це їм коштує, чи
      є обхід. Це змінює пріоритети. Перемаркування severity — ні.
    follow_up:
      - "Чи може бути низька severity і високий пріоритет?"
      - "Розробник каже «не будемо фіксити». Що робити?"
    source: ISTQB CTFL §5.5

  - id: sp_inflation
    any: [поставити critical, вказати критичн, щоб полагодили, щоб швидше
          пофіксили, підняти severity, завищити, перебільш, накрутити]
    all: [[серйозн, severity, пріоритет, priority]]
    weight: 1.5
    answer: |
      **Ніколи не завищуйте severity, щоб привернути увагу.** Це найшвидший
      спосіб втратити єдиний важіль, який у вас є.

      Severity — це фактологічне твердження про вплив. Якщо ваші не
      витримують перевірки, кожен наступний Critical дисконтують — і того
      разу, коли він справді критичний, ніхто не поворухнеться. Довіра — це
      робочий капітал тестувальника, і завищення його витрачає.

      Що справді працює — аргументувати **пріоритет**, тобто саме те поле,
      про яке насправді питання: скільком користувачам це трапляється, як
      часто, чого їм коштує, чи є обхід, який клієнт чекає. Це бізнес-кейс,
      і він рухає релізні рішення. Неправильне число в полі severity — ні.
    follow_up:
      - "Хто визначає пріоритет?"
      - "Розробник каже «не будемо фіксити». Що робити?"
    source: ISTQB CTFL §5.5

  - id: sp_wont_fix
    any: [не будемо фіксити, wont fix, "won't fix", не фіксимо, каже що це
          дрібниця, закрив мій баг, не погоджується, відхилив баг,
          повернув баг]
    weight: 1
    answer: |
      **Не сперечайтеся про мітку — принесіть вплив, а потім віддайте
      рішення тому, кому воно належить.**

      Три кроки, саме в цьому порядку:

      1. **Перевірте, чи вони не мають рації.** Перечитайте власний репорт
         очима незнайомця. Якщо ваші докази не показують того впливу, який ви
         заявили, це варто знати до розмови.
      2. **Додайте докази, які є у вас і немає в них.** Скільком
         користувачам, як часто, чого коштує, чи є обхід, яку вимогу
         порушено. Виміряйте, якщо можете — число закриває дискусію, яку
         прикметники затягують.
      3. **Ескалюйте до пріоритету, а не до голосу.** «Я не погоджуюсь» не
         веде нікуди; «це зачіпає платний флоу реєстрації, ось кількість»
         веде до продакта, і пріоритет — його. Зафіксуйте рішення, якщо воно
         не на вашу користь: дефект, свідомо не виправлений, — це
         задокументоване бізнес-рішення, і це легітимний результат.
    follow_up:
      - "Хто визначає пріоритет?"
      - "Розробник каже «не відтворюється»."
    source: ISTQB CTFL §5.5

  - id: sp_scale_size
    any: [скільки рівнів, скільки severity, скільки серйозност, розмір шкали,
          які рівні severity]
    answer: |
      **Чотири — звична шкала, і три працює.** Значно важливіше за число те,
      щоб уся команда розуміла під кожним рівнем те саме.

      Робоча четвірка: **Critical** — заблоковано ключовий сценарій, втрачено
      дані або є розкриття; **Major** — функція суттєво зламана, але є обхід;
      **Minor** — незручність, сценарії працюють; **Trivial** — косметика.

      Запишіть ці визначення там, де їх видно з трекера, і узгодьте вголос
      один раз. Ширша шкала не додає точності — вона лише переносить
      суперечку з «це Major чи Minor» на «це 6 чи 7», тобто ту саму
      суперечку з меншим спільним розумінням.
    follow_up:
      - "Яка різниця між severity і priority?"
      - "Хто визначає пріоритет?"
    source: ISTQB CTFL §5.5

  - id: sp_general
    any: [серйозн, severity, пріоритет, priority, тріаж]
    weight: -3
    answer: |
      **Як обирати severity — у тому порядку, який справді працює:**

      1. **Чи може користувач завершити справу?** Ні, і обходу немає →
         Critical. Ні, але обхід є → Major.
      2. **Чи втрачено, зіпсовано або розкрито дані?** → Critical, незалежно
         від того, наскільки це рідко. Рідкість — вхід для пріоритету.
      3. **Чи порушено заявлену вимогу?** → Major, навіть якщо візуально все
         гаразд. Вимога і є доказом.
      4. **Інакше це подання** → Minor, або Trivial, якщо чиста декорація.

      Далі пріоритет ставиться окремо — точніше, пропонується: severity це
      ваша технічна оцінка, priority — релізне рішення бізнесу. Скажіть у
      репорті обидві речі й дозвольте їм розійтися, якщо кейс того вимагає:
      логотип з помилкою справді має низьку severity і високий пріоритет.
    follow_up:
      - "Яка severity для опечатки у футері?"
      - "Чи може бути низька severity і високий пріоритет?"
      - "Хто визначає пріоритет?"
