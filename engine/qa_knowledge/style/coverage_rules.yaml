version: 1
name: Test-case coverage model (control enumeration + mandatory pairings)
locale: en

# ─────────────────────────────────────────────────────────────────────
# What this file is
# ─────────────────────────────────────────────────────────────────────
# house_style.yaml says HOW to write a case. This file says WHICH cases
# must exist. It is the coverage model reverse-engineered from the Odoo
# Test Plan corpus (4,808 cases), where the driver of volume is not the
# requirement count but systematic enumeration:
#
#   * every control on a surface gets a case,
#   * every view variant of a surface is walked separately,
#   * every privileged action gets a with-rights / without-rights pair,
#   * every state machine gets one case per legal transition plus one
#     per forbidden transition,
#   * every validated field gets a valid / empty / invalid / boundary set.
#
# engine/tc_author.py pastes this into the cached system block. The
# `must_pair` blocks are the mandatory-negative derivation rules — they
# replace ratio targets (see house_style.yaml → categories).
# ─────────────────────────────────────────────────────────────────────

enumeration_order:
  - list_surface        # grid / index / table
  - view_variants       # kanban, list, form, calendar, gantt
  - create_form
  - detail_form
  - record_actions
  - state_machine
  - permissions
  - error_messages
  - cross_cutting

# ─────────────────────────────────────────────────────────────────────
# 1. List / grid surface
# ─────────────────────────────────────────────────────────────────────
list_surface:
  applies_when: The artifacts evidence a table, grid, list or index of records.

  # Evidence tokens, resolved by engine/tc_rules._has_grid_evidence
  # against what engine/site_crawler actually parsed out of the page. A
  # check whose token the markup cannot satisfy is SKIPPED, never
  # guessed — the same discipline create_form.per_control_type runs on.
  # The five tokens at the bottom have no HTML signature at all, so on a
  # crawled site they never fire; they stay here as the coverage model
  # the LLM path reads, and as the record of what a richer artifact
  # (a spec, a recorded session) would unlock.
  evidence:
    columns: The table declares two or more <th> column headers.
    rows: The table body holds at least one data row.
    row_links: A data cell holds a link out of the row.
    checkboxes: Data rows carry a selection checkbox.
    select_all: The header row carries a select-all checkbox.
    sortable: A column header carries aria-sort, a sort class, or a header link.
    pagination: A pager is rendered — rel=next/prev, a container the markup names a pager, or an aria-labelled page control.
    search: A search input or a role="search" form is rendered.
    filters: A control the markup itself names a filter is rendered.
    bulk_actions: A picker the markup itself names a bulk / mass action is rendered.
    create_control: A control labelled Create / New / Add is rendered.
    group_by_control: No HTML signature — never fires on a crawled page.
    advanced_search_control: No HTML signature — never fires on a crawled page.
    save_filter_control: No HTML signature — never fires on a crawled page.
    column_picker_control: No HTML signature — never fires on a crawled page.
    record_counter: No HTML signature — never fires on a crawled page.

  # `fan_out` names the inventory list to iterate: one case per sortable
  # column, per filter, per bulk action, per create control. The
  # placeholder it fills is fixed per list ({column}, {filter},
  # {action}, {control}).
  checks:
    - id: reach
      objective: Confirm the grid renders every column header it declares
      category: Positive
      priority: High
      requires: columns
      title: 'Verify that the "{grid}" grid is displayed with every column header it declares'
      step: 'Pay attention to the header row of the "{grid}" grid'
      expected: 'The "{grid}" grid is displayed, and the header row carries every declared column: {columns}.'
    - id: row_rendering
      objective: Confirm a data row is populated in every column
      category: Positive
      priority: Medium
      requires: rows
      title: 'Verify that a data row of the "{grid}" grid is populated in every column'
      step: 'Pay attention to the first data row of the "{grid}" grid'
      expected: 'The first data row renders a value in every column the grid declares, and no cell is left holding a raw placeholder such as "null" or "undefined".'
    - id: open_record
      objective: Open a record from its row link
      category: Positive
      priority: High
      requires: row_links
      title: 'Verify that User can open a record from the "{grid}" grid by clicking its row link'
      step: 'Click on the link in the first data row of the "{grid}" grid'
      expected: 'The detail surface of the clicked row is opened, and the record it renders is the one that row named.'
    - id: open_new_tab
      objective: Open a row link in a new browser tab
      category: Positive
      priority: Low
      requires: row_links
      title: 'Verify that User can open a row of the "{grid}" grid in a new browser tab'
      step: 'Middle-click the link in the first data row of the "{grid}" grid'
      expected: 'The record is opened in a new browser tab, and the "{grid}" grid is left as it was in the original tab.'
    - id: start_create
      objective: Start creation via the "Create" / "New" / "Add" control
      category: Positive
      priority: High
      requires: create_control
      fan_out: create_controls
      title: 'Verify that User can start record creation from the "{grid}" grid via the "{control}" control'
      step: 'Click on the "{control}" control'
      expected: 'The creation surface is opened with its inputs empty, and the "{grid}" grid is left unchanged behind it.'
    - id: search_simple
      objective: Search by the primary text column
      category: Positive
      priority: High
      requires: search
      title: 'Verify that User can find a row of the "{grid}" grid by searching a value from its first column'
      step: 'Enter a value taken from the first column of an existing row into the "{search}" control'
      expected: 'The "{grid}" grid renders the matching row, and the rows that do not match it are no longer rendered.'
    - id: empty_state
      objective: Search for a value no record carries
      category: Negative
      priority: Medium
      requires: search
      title: 'Verify that the "{grid}" grid renders its empty state when the search matches no rows'
      step: 'Enter a value no record carries into the "{search}" control'
      expected: 'No data row is rendered. An explicit empty-state message replaces the rows of the "{grid}" grid, and the browser console raises no error.'
    - id: filters
      objective: Apply each predefined filter and confirm the row set narrows
      category: Positive
      priority: Medium
      requires: filters
      fan_out: filters
      title: 'Verify that the "{filter}" filter narrows the "{grid}" grid to the matching rows'
      step: 'Apply the "{filter}" filter'
      expected: 'Only the rows matching the "{filter}" selection are rendered in the "{grid}" grid, and the applied filter is marked as active.'
    - id: filters_cleared
      objective: Clear an applied filter and confirm the full row set returns
      category: Positive
      priority: Medium
      requires: filters
      fan_out: filters
      title: 'Verify that clearing the "{filter}" filter restores the full row set of the "{grid}" grid'
      step: 'Apply the "{filter}" filter, then clear it'
      expected: 'The "{grid}" grid renders the same rows it held before the filter was applied, and no filter is marked as active.'
    - id: sort_ascending
      objective: Sort by a sortable column, ascending
      category: Positive
      priority: Medium
      requires: sortable
      fan_out: sortable_columns
      title: 'Verify that User can sort the "{grid}" grid by the "{column}" column in ascending order'
      step: 'Click on the "{column}" column header once'
      expected: 'The rows are reordered by "{column}" from the lowest value to the highest, and the header marks the ascending direction.'
    - id: sort_descending
      objective: Sort by a sortable column, descending
      category: Positive
      priority: Medium
      requires: sortable
      fan_out: sortable_columns
      title: 'Verify that User can sort the "{grid}" grid by the "{column}" column in descending order'
      step: 'Click on the "{column}" column header twice'
      expected: 'The rows are reordered by "{column}" from the highest value to the lowest, and the header marks the descending direction.'
    - id: pagination_next
      objective: Move to the next page via the pager
      category: Positive
      priority: Medium
      requires: pagination
      title: 'Verify that User can move to the next page of the "{grid}" grid via the pager'
      step: 'Click on the next-page control of the pager'
      expected: 'The next page of records is rendered in the "{grid}" grid, and the pager marks the new page as the current one.'
    - id: pagination_previous
      objective: Move back to the previous page via the pager
      category: Positive
      priority: Medium
      requires: pagination
      title: 'Verify that User can return to the previous page of the "{grid}" grid via the pager'
      step: 'Move to the second page, then click on the previous-page control of the pager'
      expected: 'The first page of records is rendered again in the "{grid}" grid, and the pager marks it as the current page.'
    - id: multi_select
      objective: Mark and unmark records via the row checkboxes
      category: Positive
      priority: Medium
      requires: checkboxes
      title: 'Verify that User can mark and unmark rows of the "{grid}" grid via the row checkboxes'
      step: 'Mark the checkboxes of two rows, then unmark one of them'
      expected: 'Both rows are marked after the first two clicks, and after the third only the row that stayed marked is selected.'
    - id: select_all
      objective: Select every row on the page via the header checkbox
      category: Positive
      priority: Medium
      requires: select_all
      title: 'Verify that the header checkbox of the "{grid}" grid marks every row on the current page'
      step: 'Mark the checkbox in the header row of the "{grid}" grid'
      expected: 'Every row rendered on the current page of the "{grid}" grid is marked, and the header checkbox is shown in its selected state.'
    - id: bulk_actions
      objective: Run each bulk action on a multi-row selection
      category: Positive
      priority: Medium
      requires: bulk_actions
      fan_out: bulk_actions
      note: One case per action the bulk control offers — delete, mass edit, export, related-task creation.
      title: 'Verify that User can run the "{action}" bulk action on a multi-row selection in the "{grid}" grid'
      step: 'Mark two rows, then choose "{action}" from the bulk-action control'
      expected: 'The "{action}" action is applied to both marked rows and to no other row, and the outcome that action defines is rendered.'
    - id: bulk_actions_no_selection
      objective: Trigger a bulk action with no row marked
      category: Negative
      priority: Medium
      requires: bulk_actions
      title: 'Verify that the "{grid}" grid refuses a bulk action while no row is marked'
      step: 'Leave every row checkbox unmarked, then trigger the bulk-action control'
      expected: 'No record is changed. The bulk-action control is disabled, or a message states that no row is selected.'
    - id: group_by
      objective: Apply each Group By option and confirm records group
      category: Positive
      priority: Medium
      requires: group_by_control
      title: 'Verify that User can group the "{grid}" grid by each Group By option'
    - id: search_advanced
      objective: Search via Advanced Search with parameter drop-downs
      category: Positive
      priority: Medium
      requires: advanced_search_control
      title: 'Verify that User can narrow the "{grid}" grid via Advanced Search'
    - id: save_filter
      objective: Save the current filter set as a favourite
      category: Positive
      priority: Low
      requires: save_filter_control
      title: 'Verify that User can save the current filter set of the "{grid}" grid as a favourite'
    - id: column_picker
      objective: Add and remove columns via the field selector
      category: Positive
      priority: Low
      requires: column_picker_control
      title: 'Verify that User can add and remove columns of the "{grid}" grid via the field selector'
    - id: counter
      objective: Confirm the record counter matches the visible row count
      category: Positive
      priority: Low
      requires: record_counter
      title: 'Verify that the record counter of the "{grid}" grid matches the visible row count'
  must_pair:
    - when: A filter or search returns no rows
      derive: 'Negative — no rows are rendered, an explicit empty-state message replaces the table, no console error.'
    - when: A bulk action operates on the current selection
      derive: 'Negative — the same action triggered with nothing selected is refused, and the control is disabled or the refusal is named.'

# ─────────────────────────────────────────────────────────────────────
# 2. View variants
# ─────────────────────────────────────────────────────────────────────
view_variants:
  applies_when: The surface offers more than one rendering of the same data.
  rule: >-
    Each view is its own SECTION, walked independently. Controls that
    exist only in one view (inline kanban editing, list-view checkboxes,
    form-view record switcher) are enumerated in that view's section
    only. This is where the corpus generates most of its volume — the
    Recruitment sheet walks "Kanban view" and "List view" as separate
    section blocks over the same Job Position object.
  per_view_checks:
    - Switch to the view via the view switcher
    - Confirm the record data renders in the view's own layout
    - Exercise every inline action the view exposes on a record
    - Exercise the record context menu of that view
    - Confirm view-specific empty state

# ─────────────────────────────────────────────────────────────────────
# 3. Create form
# ─────────────────────────────────────────────────────────────────────
create_form:
  applies_when: The artifacts evidence a create / add / new-record form.
  checks:
    - id: happy_path
      objective: Create the record with only the required fields filled
      category: Positive
      priority: High
    - id: required_empty
      objective: Attempt to save with the required fields left empty
      category: Negative
      priority: High
    - id: required_highlight
      objective: Confirm required fields are visually marked before submission
      category: Positive
      priority: Medium
    - id: per_field_fill
      objective: Fill in each field and confirm the value is accepted
      category: Positive
      priority: Medium
      fan_out: one case per field in the artifacts' field inventory
    - id: save
      objective: Persist via the "Save" control and confirm the record appears in the grid
      category: Positive
      priority: High
    - id: discard
      objective: Abandon via the "Discard" / "Cancel" control and confirm nothing is persisted
      category: Positive
      priority: High
    - id: unsaved_guard
      objective: Navigate away with unsaved changes
      category: Negative
      priority: Medium
      note: Expected — a confirmation dialog appears; leaving discards, staying preserves the edits.
    - id: breadcrumbs
      objective: Confirm the breadcrumb trail reflects the create context and returns to the grid
      category: Positive
      priority: Low
  per_control_type:
    text_input:
      cases:
        - objective: 'Enter a valid value'
          category: Positive
        - objective: 'Leave empty when required'
          category: Negative
          requires: required
          title: 'Verify that User cannot submit the form without the "{label}" {noun} filled'
          step: 'Leave the "{label}" {noun} empty'
        - objective: 'Enter a value at the maximum allowed length'
          category: Positive
          requires: maxlength
          title: 'Verify that the "{label}" {noun} accepts a value at the maximum allowed length'
        - objective: 'Enter a value one character over the maximum'
          category: Negative
          requires: maxlength
          title: 'Verify that the "{label}" {noun} rejects a value one character over the maximum'
          step: 'Enter one character more than the maximum into the "{label}" {noun}'
        - objective: 'Enter non-Latin characters and reopen the record'
          category: Positive
          title: 'Verify that the "{label}" {noun} accepts non-Latin characters and keeps them after a reload'
        - objective: 'Enter a whitespace-only value'
          category: Negative
          requires: required
          title: 'Verify that the "{label}" {noun} rejects a whitespace-only value'
          step: 'Enter only spaces into the "{label}" {noun}'
    email_input:
      cases:
        - objective: 'Enter a valid address'
          category: Positive
        - objective: 'Enter a malformed address'
          category: Negative
          title: 'Verify that the "{label}" {noun} rejects a malformed address'
          step: 'Enter a malformed address into the "{label}" {noun}'
    numeric_input:
      cases:
        - objective: 'Enter a value inside the allowed range'
          category: Positive
          requires: range
        - objective: 'Enter the minimum allowed value'
          category: Positive
          requires: range
          title: 'Verify that the "{label}" {noun} accepts the minimum allowed value'
        - objective: 'Enter the maximum allowed value'
          category: Positive
          requires: range
          title: 'Verify that the "{label}" {noun} accepts the maximum allowed value'
        - objective: 'Enter a value below the minimum'
          category: Negative
          requires: range
          title: 'Verify that the "{label}" {noun} rejects a value below the minimum'
          step: 'Enter a value below the minimum into the "{label}" {noun}'
        - objective: 'Enter a value above the maximum'
          category: Negative
          requires: range
          title: 'Verify that the "{label}" {noun} rejects a value above the maximum'
          step: 'Enter a value above the maximum into the "{label}" {noun}'
        - objective: 'Enter letters into a numeric control'
          category: Negative
          title: 'Verify that the "{label}" {noun} rejects letters'
          step: 'Enter letters into the "{label}" {noun}'
        - objective: 'Enter a decimal where only integers are allowed'
          category: Negative
          requires: step
          title: 'Verify that the "{label}" {noun} rejects a decimal value'
          step: 'Enter a decimal value into the "{label}" {noun}'
    date_input:
      cases:
        - objective: 'Pick a date via the date-picker'
          category: Positive
          title: 'Verify that User can pick a date in the "{label}" {noun} via the date-picker'
        - objective: 'Type the date directly in the accepted format'
          category: Positive
          title: 'Verify that User can type a date directly into the "{label}" {noun} in the accepted format'
        - objective: 'Enter a date outside the allowed range'
          category: Negative
          requires: range
          title: 'Verify that the "{label}" {noun} rejects a date outside the allowed range'
          step: 'Enter a date outside the allowed range into the "{label}" {noun}'
        - objective: 'Enter an end date earlier than the start date'
          category: Negative
          requires: sibling_date
          title: 'Verify that the form rejects an end date earlier than the start date'
    dropdown:
      note: >-
        The select / type-ahead / clear set per relational control is the
        largest volume driver in the corpus. The Odoo-specific pickers
        below stay gated on evidence this inventory cannot supply, so they
        never fire on a generic site.
      cases:
        - objective: 'Select an existing value'
          category: Positive
          requires: options
          title: 'Verify that User can select an existing value from the "{label}" {noun}'
        - objective: 'Filter by typing a prefix'
          category: Positive
          requires: options
          title: 'Verify that User can filter the "{label}" {noun} by typing a prefix'
        - objective: 'Clear the selection'
          category: Positive
          requires: not_required
          title: 'Verify that User can clear the selection in the "{label}" {noun}'
        - objective: 'Open the full picker via "Search More" and select from it'
          category: Positive
          requires: search_more_control
        - objective: 'Create a related record via "Create and Edit"'
          category: Positive
          requires: inline_create_control
        - objective: 'Attempt "Create and Edit" without the required permission'
          category: Negative
          requires: inline_create_control
    checkbox:
      cases:
        - objective: 'Mark and unmark the control'
          category: Positive
          title: 'Verify that User can mark and unmark the "{label}" {noun}'
          step: 'Mark the "{label}" {noun}, then unmark it'
        - objective: 'Confirm dependent controls follow the state'
          category: Positive
          requires: dependent_fields
    file_upload:
      cases:
        - objective: 'Upload a file of an accepted type and size'
          category: Positive
          title: 'Verify that User can upload an accepted file to the "{label}" {noun}'
        - objective: 'Upload a file of a rejected type'
          category: Negative
          requires: accept
          title: 'Verify that the "{label}" {noun} rejects a file of a disallowed type'
        - objective: 'Upload a file over the size limit'
          category: Negative
          requires: max_size
        - objective: 'Remove an uploaded file and upload it again'
          category: Positive
          title: 'Verify that User can remove a file from the "{label}" {noun} and upload the same file again'
    rich_text:
      cases:
        - objective: 'Enter formatted text and reload'
          category: Positive
          title: 'Verify that formatted text in the "{label}" {noun} survives a reload'
        - objective: 'Paste markup or script content'
          category: Negative
          title: 'Verify that the "{label}" {noun} renders pasted markup inert'
          step: 'Paste markup and script content into the "{label}" {noun}'
  must_pair:
    - when: A field is required
      derive: 'Negative — save is blocked, the field is highlighted, and the error message names that field.'
    - when: A field has a format rule (email, phone, URL, numeric, date)
      derive: 'Negative — one case per violated format rule, asserting both rejection and the field-level message.'
    - when: A field has a length or range limit
      derive: 'Positive at the limit, Negative one unit beyond it (boundary value analysis).'
    - when: A relational drop-down offers inline creation
      derive: 'Negative — the same action attempted by an actor without the creating permission.'

# ─────────────────────────────────────────────────────────────────────
# 4. Detail / edit form
# ─────────────────────────────────────────────────────────────────────
detail_form:
  checks:
    - {objective: 'Enter edit mode via the "Edit" control', category: Positive, priority: High}
    - {objective: 'Confirm every field is pre-populated with the stored value', category: Positive, priority: High}
    - {objective: 'Change one field, save, reload, and confirm only that field changed', category: Positive, priority: High}
    - {objective: 'Change one field, discard, and confirm the stored value is intact', category: Positive, priority: High}
    - {objective: 'Open each tab and confirm its content renders', category: Positive, priority: Medium, fan_out: one case per tab}
    - {objective: 'Confirm each smart button is displayed with a correct counter', category: Positive, priority: Medium}
    - {objective: 'Follow each smart button to its target grid', category: Positive, priority: Medium, fan_out: one case per smart button}
    - {objective: 'Confirm the counter updates after adding and removing a related record', category: Positive, priority: Medium}
    - {objective: 'Add and delete an attachment', category: Positive, priority: Medium}
    - {objective: 'Add, view and remove followers', category: Positive, priority: Medium}
    - {objective: 'Post a message and log an internal note', category: Positive, priority: Medium}
    - {objective: 'Confirm tooltips appear on hover over annotated fields', category: Positive, priority: Low}
    - {objective: 'Switch to the next and previous record via the record switcher', category: Positive, priority: Low}
    - {objective: 'Print / export the record from the print menu', category: Positive, priority: Medium}
    - {objective: 'Duplicate the record and confirm the copy is independent of the original', category: Positive, priority: Medium}
    - {objective: 'Delete the record through the confirmation dialog', category: Positive, priority: High}
    - {objective: 'Cancel the delete confirmation and confirm the record survives', category: Negative, priority: High}
    - {objective: 'Open the detail URL of a deleted record directly', category: Negative, priority: Medium}

# ─────────────────────────────────────────────────────────────────────
# 5. State machine
# ─────────────────────────────────────────────────────────────────────
state_machine:
  applies_when: >-
    The artifacts evidence stages, statuses, workflow buttons or a
    kanban column set — e.g. the corpus's Appraisal flow
    New → Plan in Progress → Waiting Appreciation → Done, plus Cancelled.
  checks:
    - {objective: 'Advance the record through each legal transition via its own control', category: Positive, priority: High, fan_out: one case per transition}
    - {objective: 'Confirm the transition control is NOT displayed while the record is in a state that forbids it', category: Negative, priority: High, fan_out: one case per guarded control}
    - {objective: 'Attempt a transition whose entry conditions are unmet', category: Negative, priority: High}
    - {objective: 'Confirm fields auto-filled by a transition carry the right value and are read-only', category: Positive, priority: Medium}
    - {objective: 'Reset the record to its initial state where the flow allows it', category: Positive, priority: Medium}
    - {objective: 'Attempt to leave a terminal state', category: Negative, priority: High}
    - {objective: 'Confirm actions on a locked / approved record are refused', category: Negative, priority: High}
  must_pair:
    - when: A control drives a transition
      derive: >-
        Negative — the same control in a state where the transition is
        illegal. The corpus writes these as pairs: 'can start recruitment
        via "Launch Recruitment"' (Positive) next to '"Launch
        Recruitment" is not displayed while Job Position is in
        recruitment' (Negative).

# ─────────────────────────────────────────────────────────────────────
# 6. Permissions / roles
# ─────────────────────────────────────────────────────────────────────
permissions:
  applies_when: The artifacts evidence more than one role, an access level, or an admin surface.
  rule: >-
    Build a role × action matrix and emit a symmetric pair for every
    privileged action. The corpus carries 228 cases whose precondition is
    the bare role marker "Manager X User", and pairs every
    "User with special rights can …" with
    "User without special rights cannot …".
  checks:
    - {objective: 'Confirm the privileged actor can perform the action', category: Positive, priority: High}
    - {objective: 'Confirm the unprivileged actor cannot perform the action', category: Negative, priority: High}
    - {objective: 'Confirm the restricted tab / field / menu is hidden from the unprivileged actor', category: Negative, priority: High}
    - {objective: 'Confirm the unprivileged actor cannot reach the restricted surface by its direct URL', category: Negative, priority: High}
    - {objective: 'Confirm each actor sees only the records their scope allows', category: Positive, priority: High}
  must_pair:
    - when: Any action is permission-gated
      derive: 'Exactly one Negative counterpart per gated action, per role that lacks the permission.'

# ─────────────────────────────────────────────────────────────────────
# 7. Error messages (systematic negative sweep — own section)
# ─────────────────────────────────────────────────────────────────────
error_messages:
  rule: >-
    Factor the systematic negative sweep into its own section rather than
    sprinkling it through the functional sections. Title grammar is
    '<Surface>: <attempted action>' (see house_style.yaml).
  matrix_axes:
    surface: every create form, edit form, modal, and search/filter dialog
    provocation:
      - Proceed with ALL required fields empty
      - Proceed with ANY ONE required field empty
      - Proceed with invalid data in a numeric field
      - Proceed with invalid data in a date field
      - Proceed with invalid data in an email field
      - Leave the surface without saving after modifying a record
      - Remove a record
      - Remove a follower / related line
      - Submit a nested modal (e.g. inline related-record creation) with required fields empty
  expected_shapes:
    all_required_empty: 'All the empty required fields are highlighted, and the error message names them.'
    one_required_empty: 'The empty required field is highlighted, and the error message names that field.'
    invalid_data: 'The field with invalid data is highlighted, and the error message names it.'
    destructive: 'A confirmation dialog is displayed before the action is applied.'
    unsaved: 'A confirmation dialog is displayed; the record is unchanged unless the user confirms.'
  note: >-
    The corpus's own failures cluster here — 8 of 25 error-message rows
    are Failed, mostly "field is not highlighted" or "the message names
    the wrong field". This section earns its keep.

# ─────────────────────────────────────────────────────────────────────
# 8. Cross-cutting sweeps (each its own section)
# ─────────────────────────────────────────────────────────────────────
cross_cutting:
  ui_interface:
    rule: One section that walks the visual contract of each surface type.
    checks:
      - Page / grid title is displayed
      - Every documented action control is displayed on the surface it belongs to
      - Control styling matches the design spec (colour, weight, state)
      - Applied filters are visually marked
      - Icons and images render (no broken-image placeholders)
      - Tooltips render for annotated fields
      - Drop-down lists render fully and their links resolve
      - Date fields expose the date-picker icon
      - Links open the intended page or modal
      - Layout holds at the supported viewport widths
  localization:
    applies_when: The artifacts evidence more than one language or a locale switcher.
    checks:
      - Every visible string is translated on each supported locale
      - Non-Latin input round-trips through save and reload
      - Date, number and currency formats follow the active locale
      - No layout overflow from longer translated strings
  performance:
    applies_when: The artifacts evidence data grids, reports or heavy pages.
    checks:
      - Grid renders within the agreed budget at production data volume
      - View switching and drag-and-drop stay responsive
      - Report generation completes and does not time out
      - Repeated navigation does not degrade over a session
  accessibility:
    checks:
      - Every interactive element is reachable by keyboard in a logical order
      - Every input has a programmatically associated label
      - Text contrast meets WCAG 2.1 AA
      - Images carry meaningful alternative text
      - Focus is visible and is moved to the first invalid field on a failed submit

# ─────────────────────────────────────────────────────────────────────
# Sizing
# ─────────────────────────────────────────────────────────────────────
sizing:
  guidance: >-
    Coverage is driven by the control inventory, not by a target count.
    For calibration: the corpus averages ~117 cases per module sheet, a
    single create form with 8 fields and 4 relational drop-downs
    typically yields 30-45 cases, and a grid surface yields 12-20.
  rules:
    - >-
      Never emit fewer than one case per evidenced control. If the
      artifacts list 12 buttons, 12 buttons get cases.
    - >-
      Do not invent controls to hit a number. Under-evidenced surfaces
      get fewer cases and an explicit gap note.
    - >-
      Prefer splitting a broad case into two narrow ones over merging two
      assertions into one title.
