version: 1
name: TestFort / QArea low-level checklist house style
locale: en

# ─────────────────────────────────────────────────────────────────────
# Provenance
# ─────────────────────────────────────────────────────────────────────
# Measured from the team's own reviewed low-level checklist: the
# "Low-level checklist" sheet of Training Plan_Horban Yaroslavna.xlsx,
# written against https://testfort.com/mobile-application-testing and
# reviewed in place by a team lead whose threaded comments are still
# attached to the file.
#
# Measured shape of that deliverable — 57 checks over 3 sections:
#
#   section            checks   numbering
#   ────────────────────────────────────────────────────────────────
#   1  Header               7   1.1 … 1.7
#   2  Page Content        38   2.1 … 2.15, 2.3.1, 2.7.1-3, 2.9.1-4,
#                               2.13.1-2, 2.15.1-12
#   3  Footer              12   3.1 … 3.12
#
#   34 checks at level 2, 23 at level 3.
#   57 of 57 open with "Verify"; 38 of 57 with "Verify that the".
#   27 of 57 quote an on-screen label.
#   13 of 57 carry a disambiguating "… in the <X> section" suffix.
#   Objective length: min 33, median 85, max 154 characters.
#
# A test case answers "does this flow work end to end". A low-level
# checklist answers "does every element on this surface do its one job" —
# it is an inventory sweep, so it is generated by walking the surface, not
# by expanding requirements.
#
# Prompt material: read as raw text by engine/checklist_author.py into a
# cached system block, alongside wording_rules.yaml and
# glossary/ui_terms.en.yaml. The mechanical half is enforced in code by
# engine/glossary.py, so the free / no-API-key path complies too.
# ─────────────────────────────────────────────────────────────────────

scope_banner:
  rule: >-
    The sheet names the surface under test before the first section, and
    links it. One checklist covers one page or one screen.
  evidence: >-
    Cell A1 carries the page slug "mobile-application-testing" hyperlinked
    to https://testfort.com/mobile-application-testing; row 3 carries the
    banner '"Mobile Application Testing Services" page'.
  rules:
    - >-
      Name the surface with its own on-screen title in quotes, followed by
      the word "page" or "screen": '"Mobile Application Testing Services"
      page'.
    - One checklist per surface. Do not merge two pages into one sheet.

columns:
  shape: ['№', Name, Status, Comments]
  evidence: Verbatim header row of the reference sheet.
  rules:
    - '№ carries the hierarchical number: 1, 1.1, 2.7.1.'
    - Name carries the objective — one observable check, nothing else.
    - >-
      Status starts at "Unchecked" on every row, including the section
      rows. Execution overwrites it with Passed / "Passed but" / Failed /
      Blocked / "-".
    - >-
      Comments is empty until execution. A Failed or "Passed but" row then
      carries the bug-tracker link.

sections:
  rule: >-
    Sections are the page's structural regions, in the order a tester
    walks the page top to bottom. Not test types.
  evidence: >-
    The reference uses exactly three: Header, Page Content, Footer. Header
    and Footer are the chrome shared by every page; Page Content is the
    part unique to this one.
  canonical:
    - Header          # logo, nav menus, CTA — repeats on every page
    - Page Content    # everything unique to this surface
    - Footer          # contacts, social, legal, sitemap
  optional:
    - Cookie banner   # only when the surface actually shows one
    - Modal           # when a dialog owns a self-contained set of checks
    - Mobile view     # when the mobile layout diverges enough to need it
  rules:
    - >-
      Never name a section after a test type — no "Positive checks", no
      "Negative checks", no "UI checks". The reference has none.
    - >-
      A section row carries a number and a name and nothing else: "1. |
      Header | Unchecked".
    - >-
      Header and Footer are the shared chrome and their check sets barely
      change between pages. Reuse them; do not re-derive them per page.

numbering:
  rule: >-
    Hierarchical, one dot per level, dropping the trailing dot on
    children. Section "1.", check "1.1", sub-check "2.7.1".
  evidence: >-
    Reference numbering runs 1. → 1.1 … 1.7 → 2. → 2.1 … 2.15 with
    2.3.1, 2.7.1-2.7.3, 2.9.1-2.9.4, 2.13.1-2.13.2, 2.15.1-2.15.12 → 3 →
    3.1 … 3.12.
  rules:
    - >-
      Level 2 is one check per element or per page section. Level 3 is
      that element's own interactions.
    - >-
      Go to level 3 only when the parent has interactions worth listing
      separately — an Accordion (expand / content visible / collapse), a
      Carousel (arrows / "Read more" / "View All" / long-title layout), a
      Form (one child per field per rule).
    - Never go past level 3. The reference does not, and level 4 stops being scannable.
    - >-
      Numbers are stable identifiers. Inserting a check appends it at the
      end of its parent rather than renumbering the siblings.

page_content_derivation:
  rule: >-
    Page Content is generated by walking the surface's own headings. One
    level-2 check per on-screen section, named with that section's exact
    heading in quotes.
  evidence: >-
    2.1 … 2.14 map one-to-one onto the page's fourteen headed sections —
    '"Mobile Testing by Platform"', '"Types of Mobile QA and Testing We
    Do"', '"When to Go for Mobile App Testing Services"',
    '"Popular Mobile Solutions We Can Test"', '"Our Featured Mobile
    Testing Projects"', '"Testing Tools & Technologies We Use"',
    '"What our clients say about us"', '"How We Deliver Quality Mobile
    Testing"', '"Your Personal Center of Excellence"', '"Why TestFort is
    Your Ideal Testing Company"' — and 2.15 is the contact Form.
  rules:
    - >-
      The default level-2 check for a content section is presence plus
      design conformance: 'Verify that the "<Heading>" section is visible
      and matches the design'.
    - >-
      When the section carries a list, say so: '… is present and contains
      the list of mobile solutions', '… with all headings and text
      visible'.
    - >-
      Add level-3 children for every interaction the section actually
      has — hover state, expand / collapse, arrows, "Read more", "View
      All", active / highlighted state, long-content layout.
    - >-
      Quote the heading exactly as it renders, including "&" and
      apostrophes. Do not normalise the client's copy.
    - >-
      Do not invent a section the crawl did not evidence. A checklist that
      names a section the page does not have fails for the wrong reason.

form_derivation:
  rule: >-
    A form is one level-2 check plus one level-3 child per field per rule.
    This is where a low-level checklist earns its name.
  evidence: >-
    The reference gives one contact form 13 rows — 2.15 plus 2.15.1
    through 2.15.12 — covering per-field valid input, per-field empty,
    invalid format, submit availability, the consent checkbox, the success
    message, and the mailto / tel links beside it.
  per_field:
    - '<Field> accepts valid data'
    - '<Field> does not accept an empty value on submit'
    - 'an error message is shown for invalid <format> in the <Field>'
  per_form:
    - 'the [Submit] button is clickable'
    - 'the form is not submitted with empty required fields'
    - 'a success message is displayed after submission'
    - 'the form is not submitted without marking the Consent checkbox'
    - 'the [Submit] button is disabled while the Consent checkbox is not marked'
  rules:
    - >-
      Only emit a rule the markup evidences. A required-field child needs
      `required` in the markup; a format child needs a real `type=email` /
      `pattern` / `maxlength`.
    - >-
      When the same form appears in more than one place on the page,
      append the disambiguating suffix — "in the Contact section".

objectives:
  rule: >-
    One observable check per row, opening with "Verify", naming the
    element with its glossary term and its quoted on-screen label.
  evidence: >-
    57 of 57 objectives open with "Verify"; 38 with "Verify that the".
    27 quote a label. Median length 85 characters.
  length: 33-154 characters is the corpus range; aim for 60-110.
  grammar:
    presence: 'Verify that the "<Label>" <element> is visible and matches the design'
    navigation: 'Verify that the <destination> is opened after clicking the "<Label>" <element>'
    redirect: 'Verify that the "<Label>" <element> redirects a user to the "<Destination>" page'
    menu: 'Verify that all sub-items are visible and clickable from the "<Label>" drop-down menu'
    interaction: 'Verify that the <element> <observable change> on <trigger>'
    field_positive: 'Verify that the <Field> field accepts valid data'
    field_negative: 'Verify that an error message is shown for <the broken rule> in the <Field> field'
    external_app: 'Verify that clicking the <element> opens the <application>'
  rules:
    - >-
      One check per row. A row joining two independent checks with "and"
      cannot be failed without ambiguity — unless the two are one
      inseparable observation ("is visible and matches the design").
    - >-
      Name the outcome, never grade it. "matches the design" is an
      observation against an artefact the tester holds; "displays
      correctly" is not. See ``wording_rules.yaml`` → ``result_wording``.
    - No trailing period. The reviewer raised this twice on this very sheet.
    - >-
      Capitalise page regions — Header, Footer, Homepage. The reviewer
      raised this three times on this very sheet.
    - >-
      Append "in the <X> section" when the same check exists elsewhere on
      the page, exactly as the reference does for the contact form.
    - >-
      A checklist objective is not a test case. It carries no steps, no
      preconditions, no test data and no separate expected result — the
      observable state is inside the objective itself. If a check needs
      three steps to reach, it belongs in the Test Cases module.

header_checks:
  rule: The shared Header sweep, reusable across every page of a site.
  evidence: Reference rows 1.1 … 1.7.
  template:
    - 'Verify that the Homepage is opened after clicking the logo'
    - 'Verify that all sub-items are visible and clickable from the "<Menu>" drop-down menu'
    - 'Verify that the user is redirected to the "<Destination>" page after clicking the "<Link>" link'
    - 'Verify that the [<CTA>] button redirects a user to the "<Destination>" page'
  rules:
    - One row per drop-down menu the Header actually carries.
    - One row per top-level link whose destination differs from a menu.

footer_checks:
  rule: The shared Footer sweep, reusable across every page of a site.
  evidence: Reference rows 3.1 … 3.12.
  template:
    - 'Verify that the Homepage is opened after clicking the logo'
    - 'Verify that clicking the email opens the default mail client'
    - 'Verify that clicking the phone number opens the call application'
    - 'Verify that addresses are visible'
    - 'Verify that clicking each social media icon (<names>) opens the corresponding page'
    - 'Verify that all sub-items are visible and clickable from the "<Menu>" menu'
    - 'Verify that clicking the "Privacy Policy" link redirects to the Privacy Policy page'
    - 'Verify that clicking the "Cookie Policy" link redirects to the Cookie Policy page'
  rules:
    - >-
      Name the social networks the Footer actually links, in the order
      they render. Do not write a generic "social icons" row.
    - >-
      Legal links get one row each — they are the rows a client checks
      first and the ones most often left pointing at a 404.

status_vocabulary:
  values: [Unchecked, Passed, 'Passed but', Failed, Blocked, '-']
  evidence: >-
    Every row of the reference sheet ships as "Unchecked"; the executed
    sheets of the Odoo corpus use the other five. "Passed but" marks a
    pass with a filed cosmetic defect; "-" marks not applicable.
  rules:
    - Generated checklists ship every row as "Unchecked".
    - Every Failed or "Passed but" row carries a bug link in Comments.

categories:
  field: Positive / Negative / Edge case / Security / Performance / Accessibility
  rules:
    - >-
      A presence, navigation or valid-input check is Positive. A check
      asserting a refusal, an error message or an absence is Negative.
    - >-
      The reference sheet carries no category column — it is a TestForTge
      addition used for the module's filter chips. Derive it; never let it
      change the wording.

anti_patterns:
  - text: 'A section named "Positive tests" or "UI checks"'
    why: >-
      Sections are surfaces, so a tester can walk them. The reference uses
      Header / Page Content / Footer and nothing else.
  - text: 'A single row covering a whole form ("Verify that the contact form works")'
    why: >-
      That is the opposite of low-level. The reference spends 13 rows on
      one contact form; one row hides every field rule that could break.
  - text: An objective carrying steps or a separate expected result
    why: >-
      Then it is a test case in the wrong module. A checklist row is one
      observation a tester can make on sight.
  - text: 'Paraphrasing a heading ("the platform section")'
    why: >-
      The heading IS the locator. Quote it verbatim — '"Mobile Testing by
      Platform"'.
  - text: Level-4 numbering (2.15.3.1)
    why: >-
      Stops being scannable, and the reference never needs it. Split the
      parent into two level-2 checks instead.
  - text: Renumbering siblings to insert a check
    why: >-
      The numbers are cited in bug reports and status updates. Append
      inside the parent instead.
